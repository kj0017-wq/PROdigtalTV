ung lassen sich Werbebotschaften präzise auf individuelle Zielgruppen zuschneiden. Dies eröffnet neue Möglichkeiten für effiziente und messbare Kommunikation im TV-Umfeld, indem klassische Reichweitenmodelle um datengetriebene Targeting-Ansätze ergänzt werden. Addressable TV steht somit für die Integration digitaler Technologien in traditionelle Bewegtbildwerbung und trägt zur Optimierung von Kampagnenperformance und Nutzererlebnis bei.  \n\nHinweis: Für eine vertiefte Darstellung wären ergänzende Informationen zu technischen Umsetzungsformen, Marktteilnehmern und aktuellen Anwendungsbeispielen hilfreich.","bodyText":"Addressable TV ermöglicht eine zielgenaue Ansprache von Zuschauern innerhalb hochwertiger Videoumfelder. Durch die Kombination von Datenanalyse und kreativer Gestaltung lassen sich Werbebotschaften präzise auf individuelle Zielgruppen zuschneiden. Dies eröffnet neue Möglichkeiten für effiziente und messbare Kommunikation im TV-Umfeld, indem klassische Reichweitenmodelle um datengetriebene Targeting-Ansätze ergänzt werden. Addressable TV steht somit für die Integration digitaler Technologien in traditionelle Bewegtbildwerbung und trägt zur Optimierung von Kampagnenperformance und Nutzererlebnis bei.  \n\nHinweis: Für eine vertiefte Darstellung wären ergänzende Informationen zu technischen Umsetzungsformen, Marktteilnehmern und aktuellen Anwendungsbeispielen hilfreich.","subtitle":"Präzise Zielgruppenansprache durch datenbasiertes Targeting im Bewegtbild“","publishDate":"","validFrom":"","articleText":"Addressable TV ermöglicht eine zielgenaue Ansprache von Zuschauern innerhalb hochwertiger Videoumfelder. Durch die Kombination von Datenanalyse und kreativer Gestaltung lassen sich Werbebotschaften präzise auf individuelle Zielgruppen zuschneiden. Dies eröffnet neue Möglichkeiten für effiziente und messbare Kommunikation im TV-Umfeld, indem klassische Reichweitenmodelle um datengetriebene Targeting-Ansätze ergänzt werden. Addressable TV steht somit für die Integration digitaler Technologien in traditionelle Bewegtbildwerbung und trägt zur Optimierung von Kampagnenperformance und Nutzererlebnis bei.  \n\nHinweis: Für eine vertiefte Darstellung wären ergänzende Informationen zu technischen Umsetzungsformen, Marktteilnehmern und aktuellen Anwendungsbeispielen hilfreich.","updated_at":"2026-06-23T08:12:01.895Z","thumbnail_media_asset_id":"media-asset-6263c9a2-1732-4af4-a141-95e514c545cd","imageUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Farticles%2FVORM%2Fki-addressable-tv-variante-2_VORM_topic_16x9_v2_thumb.webp?alt=media&token=aa8e566a-33b4-4c56-a01c-37a0eed33bb9","thumbnail_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Farticles%2FVORM%2Fki-addressable-tv-variante-2_VORM_topic_16x9_v2_thumb.webp?alt=media&token=aa8e566a-33b4-4c56-a01c-37a0eed33bb9","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Farticles%2FVORM%2Fki-addressable-tv-variante-2_VORM_topic_16x9_v2_thumb.webp?alt=media&token=aa8e566a-33b4-4c56-a01c-37a0eed33bb9","mediaAssetId":"media-asset-6263c9a2-1732-4af4-a141-95e514c545cd","updatedAt":"2026-07-27T13:39:57.112Z","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Farticles%2FVORM%2Fki-addressable-tv-variante-2_VORM_topic_16x9_v2_thumb.webp?alt=media&token=aa8e566a-33b4-4c56-a01c-37a0eed33bb9"},{"id":"berlinale-2026-bjoern-adamski-cloudunabhaengiges-videostreaming","longDescription":"Björn Adamski stellte cloudunabhängige Videostreaming-Infrastrukturen als Alternative zu einer vollständigen Abhängigkeit von internationalen Hyperscalern vor. Er erläuterte, wie Medienunternehmen durch flexible technische Architekturen mehr Kontrolle über ihre Inhalte, Daten und Distributionswege gewinnen können.\n\nIm Mittelpunkt standen die digitale Souveränität, transparente Kostenstrukturen und die Möglichkeit, unterschiedliche Infrastrukturpartner miteinander zu kombinieren. Durch offene und anpassbare Systeme können Unternehmen ihre Streaming-Angebote gezielter skalieren und Abhängigkeiten von einzelnen Plattform- oder Cloudanbietern reduzieren.\n\nDer Vortrag machte deutlich, dass technologische Unabhängigkeit zunehmend auch zu einer strategischen und wirtschaftlichen Frage für Medienunternehmen wird.","visibility":"public","speakerIds":["speakers-bjorn-adamski"],"description":"Björn Adamski stellte cloudunabhängige Videostreaming-Infrastrukturen als Alternative zu einer vollständigen Abhängigkeit von internationalen Hyperscalern vor. Er erläuterte, wie Medienunternehmen durch flexible technische Architekturen mehr Kontrolle über ihre Inhalte, Daten und Distributionswege gewinnen können.\n\nIm Mittelpunkt standen die digitale Souveränität, transparente Kostenstrukturen und die Möglichkeit, unterschiedliche Infrastrukturpartner miteinander zu kombinieren. Durch offene und anpassbare Systeme können Unternehmen ihre Streaming-Angebote gezielter skalieren und Abhängigkeiten von einzelnen Plattform- oder Cloudanbietern reduzieren.\n\nDer Vortrag machte deutlich, dass technologische Unabhängigkeit zunehmend auch zu einer strategischen und wirtschaftlichen Frage für Medienunternehmen wird.","speakerId":"speakers-bjorn-adamski","shortDescription":"Der CCO der 3Q GmbH zeigte, wie Medienunternehmen ihre Streaming-Infrastruktur unabhängiger, kontrollierbarer und wirtschaftlicher gestalten können.","title":"Digitale Souveränität durch cloudunabhängiges Videostreaming","eventIds":["event-berlinale-2026"],"subtitle":"Der CCO der 3Q GmbH zeigte, wie Medienunternehmen ihre Streaming-Infrastruktur unabhängiger, kontrollierbarer und wirtschaftlicher gestalten können.","status":"active","thumbnail_media_asset_id":"media-asset-fff6cb16-21db-4a27-9f6a-d868c91bd914","imageUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fuploads%2F gen zeigte er, wie KI bereits bei der Erstellung von Konzepten, Texten und Bildern eingesetzt werden kann und welche neuen Möglichkeiten sich daraus für Agenturen, Unternehmen und Medienproduktionen ergeben.\n\nGleichzeitig machte er deutlich, dass kreative Qualität nicht allein durch technische Systeme entsteht. Erfahrung, Intuition, strategisches Denken und die Verantwortung für das Ergebnis bleiben zentrale menschliche Kompetenzen. Künstliche Intelligenz kann kreative Prozesse beschleunigen und erweitern, ersetzt jedoch nicht die Fähigkeit, Ideen einzuordnen, weiterzuentwickeln und zielgerichtet einzusetzen.","speakerId":"speakers-gregor-c-blach","shortDescription":"Der Gründer und Geschäftsführer von WE DO communication zeigte, wie KI kreative Prozesse unterstützt und weshalb menschliche Erfahrung weiterhin unverzichtbar bleibt.","title":"Kreativität zwischen menschlicher Kompetenz und Künstlicher Intelligenz","eventIds":["event-berlinale-2026"],"subtitle":"Der Gründer und Geschäftsführer von WE DO communication zeigte, wie KI kreative Prozesse unterstützt und weshalb menschliche Erfahrung weiterhin unverzichtbar bleibt.","status":"active","sortOrder":2,"thumbnail_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fberlinale-2026-gregor-blach-kreativitaet-ki%2F1787043154156-f3f06655-af76-4dec-bfd0-7e58124b8d4d.jpg?alt=media&token=f8b9a987-602d-4d05-9a14-039776c58574","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fberlinale-2026-gregor-blach-kreativitaet-ki%2F1787043154156-f3f06655-af76-4dec-bfd0-7e58124b8d4d.jpg?alt=media&token=f8b9a987-602d-4d05-9a14-039776c58574","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fberlinale-2026-gregor-blach-kreativitaet-ki%2F1787043154156-f3f06655-af76-4dec-bfd0-7e58124b8d4d.jpg?alt=media&token=f8b9a987-602d-4d05-9a14-039776c58574","thumbnailMediaAssetId":"","thum ell auf Sender, Vermarkter, Mediaagenturen und werbungtreibende Unternehmen auswirken könnte. Eine stärker standardisierte und reichweitenbezogene Abrechnung kann die Vergleichbarkeit unterschiedlicher Medienangebote verbessern und neue Möglichkeiten für eine plattformübergreifende Mediaplanung schaffen.\n\nGleichzeitig entstehen Fragen hinsichtlich der Messbarkeit, der Preisentwicklung und der Bewertung unterschiedlicher Zielgruppen und Werbeumfelder. Der Vortrag zeigte, dass das neue Modell erhebliche Veränderungen für etablierte Planungs-, Einkaufs- und Abrechnungsprozesse im TV-Werbemarkt mit sich bringen kann.","visibility":"public","speakerIds":["speakers-stefan-uhl"],"description":"Stefan Uhl beschäftigte sich mit dem von der AdAlliance angekündigten neuen Pricing-Modell für lineare Fernsehwerbung. Im Mittelpunkt stand der geplante stärkere Übergang zu einer leistungsbezogenen Abrechnung auf Grundlage des Tausend-Kontakt-Preises.\n\nEr erläuterte, wie sich ein solches Modell auf Sender, Vermarkter, Mediaagenturen und werbungtreibende Unternehmen auswirken könnte. Eine stärker standardisierte und reichweitenbezogene Abrechnung kann die Vergleichbarkeit unterschiedlicher Medienangebote verbessern und neue Möglichkeiten für eine plattformübergreifende Mediaplanung schaffen.\n\nGleichzeitig entstehen Fragen hinsichtlich der Messbarkeit, der Preisentwicklung und der Bewertung unterschiedlicher Zielgruppen und Werbeumfelder. Der Vortrag zeigte, dass das neue Modell erhebliche Veränderungen für etablierte Planungs-, Einkaufs- und Abrechnungsprozesse im TV-Werbemarkt mit sich bringen kann.","speakerId":"speakers-stefan-uhl","shortDescription":"Der Geschäftsführer D-A-CH der Advise Media Consulting GmbH analysierte die Chancen und Risiken einer TKP-basierten Leistungsabrechnung im TV-Werbemarkt.","title":"Ein neues Pricing-Modell für das lineare Fernsehen","eventIds":["event-berlinale-2026"],"subtitle":"Der Geschäftsführer D-A-CH der Advise Media Consulting GmbH analy nds ein neues Plattformmodell für sogenannte Micro-Dramas im DACH-Markt vor. Dabei handelt es sich um kurze, serielle Bewegtbildformate, die insbesondere für die mobile Nutzung und die Darstellung im Hochformat entwickelt werden.\n\nDie Plattform soll Produzentinnen, Produzenten und Rechteinhabern zusätzliche Möglichkeiten bieten, Inhalte zu entwickeln, bestehende Stoffe neu auszuwerten und mobile Zielgruppen zu erreichen. Durch kurze Episoden, fortlaufende Erzählstrukturen und digitale Erlösmodelle entstehen neue Formen der Produktion und Vermarktung.\n\nDer Beitrag zeigte, wie sich veränderte Nutzungsgewohnheiten auf die Entwicklung audiovisueller Inhalte auswirken und welche wirtschaftlichen Chancen daraus für unabhängige Produzenten und Rechteinhaber entstehen können.","visibility":"public","speakerIds":["speakers-markus-vogelbacher","speakers-chriz-merkl"],"description":"Markus Vogelbacher und Chriz Merkl stellten mit Vertical Minds ein neues Plattformmodell für sogenannte Micro-Dramas im DACH-Markt vor. Dabei handelt es sich um kurze, serielle Bewegtbildformate, die insbesondere für die mobile Nutzung und die Darstellung im Hochformat entwickelt werden.\n\nDie Plattform soll Produzentinnen, Produzenten und Rechteinhabern zusätzliche Möglichkeiten bieten, Inhalte zu entwickeln, bestehende Stoffe neu auszuwerten und mobile Zielgruppen zu erreichen. Durch kurze Episoden, fortlaufende Erzählstrukturen und digitale Erlösmodelle entstehen neue Formen der Produktion und Vermarktung.\n\nDer Beitrag zeigte, wie sich veränderte Nutzungsgewohnheiten auf die Entwicklung audiovisueller Inhalte auswirken und welche wirtschaftlichen Chancen daraus für unabhängige Produzenten und Rechteinhaber entstehen können.","speakerId":"speakers-markus-vogelbacher","shortDescription":"Mit Vertical Minds präsentierten die Referenten eine Plattform für kurze, vertikal produzierte Serienformate im deutschsprachigen Markt.","title":"Neue Erlöswege für Filmproduktionen durch Micro-Dramas","eventIds":["event-berlinale-2026"],"subtitle":"Mit Vertical Minds präsentierten die Referenten eine Plattform für kurze, vertikal produzierte Serienformate im deutschsprachigen Markt.","status":"active","sortOrder":4,"thumbnailMediaAssetId":"media-asset-3e7d5612-3f17-4b08-87d0-5de533789cce","thumbnail_media_asset_id":"media-asset-3e7d5612-3f17-4b08-87d0-5de533789cce","imageUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fberlinale-2026-vogelbacher-merkl-micro-dramas%2F1787039412332-25558340-ee6a-4618-9e07-ab13f871e54b.jpg?alt=media&token=7baa195b-97c9-45d9-8a37-0c85f356de26","media_asset_id":"media-asset-3e7d5612-3f17-4b08-87d0-5de533789cce","thumbnail_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fberlinale-2026-vogelbacher-merkl-micro-dramas%2F1787039412332-25558340-ee6a-4618-9e07-ab13f871e54b.jpg?alt=media&token=7baa195b-97c9-45d9-8a37-0c85f356de26","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fberlinale-2026-vogelbacher-merkl-micro-dramas%2F1787039412332-25558340-ee6a-4618-9e07-ab13f871e54b.jpg?alt=media&token=7baa195b-97c9-45d9-8a37-0c85f356de26","mediaAssetId":"media-asset-3e7d5612-3f17-4b08-87d0-5de533789cce","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fberlinale-2026-vogelbacher-merkl-micro-dramas%2F1787039412332-25558340-ee6a-4618-9e07-ab13f871e54b.jpg?alt=media&token=7baa195b-97c9-45d9-8a37-0c85f356de26","companyLogoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fberlinale-2026-vogelbacher-merkl-micro-dramas-company-logo%2F1787039763847-a5523021-3bc2-4891-9740-1f4bcae9b591.jpg?alt=media&token=06d3e410-b27b-467f-9437-6e6e8ec567f5","updatedAt":"2026-08-18T07:56:10.343Z"},{"id":"content-management","longDescription":"Systeme und Prozesse fuer skalierbare Mediaprodukte.","articleText":"Content Management ist in der digitalen Medienwirtschaft weit mehr als die Pflege einzelner Webseiten. Inhalte muessen geplant, produziert, versioniert, beschrieben, freigegeben, verteilt und ausgewertet werden. Je mehr Kanaele, Plattformen und Ausspielwege hinzukommen, desto wichtiger wird eine robuste Content-Architektur. Ohne saubere Prozesse verlieren Organisationen Geschwindigkeit, Qualitaet und Uebersicht.\n\nEin modernes Content-Management-System muss redaktionelle Arbeit, technische Metadaten und betriebliche Anforderungen zusammenbringen. Dazu gehoeren Rollen und Rechte, Medienverwaltung, strukturierte Inhalte, Barrierefreiheit, Mehrsprachigkeit, Suchmaschinenoptimierung, Schnittstellen und Archivlogik. Besonders im Bewegtbildumfeld spielen Transcodierung, Untertitel, Rechtefenster, Vorschaubilder, Kapitelmarken und Distribution an externe Plattformen eine zentrale Rolle.\n\nDie eigentliche Herausforderung liegt haeufig nicht in der Software, sondern in der Organisation. Wer entscheidet, wann ein Inhalt veroeffentlicht wird? Welche Daten sind Pflicht? Wie werden alte Inhalte aktualisiert? Welche Inhalte duerfen intern bleiben, welche sind oeffentlich, welche exklusiv fuer Mitglieder oder Partner? Gute Systeme machen diese Regeln sichtbar und einfach bedienbar.\n\nPROdigitalTV betrachtet Content Management als Infrastruktur fuer professionelle Medienangebote. Effiziente Workflows schaffen Freiraum fuer redaktionelle Qualitaet und strategische Entwicklung. Im Netzwerk koennen Unternehmen Erfahrungen austauschen, technische Anforderungen schaerfen und zeigen, wie skalierbare Systeme die Zusammenarbeit zwischen Redaktion, Marketing, Vertrieb, Technik und Management verbessern.\n\nWichtig ist dabei eine klare Trennung zwischen Inhalt, Design und Ausspielung. Strukturierte Inhalte lassen sich leichter wiederverwenden, personalisieren und archivieren. Das erhoeht die Lebensdauer redaktioneller Arbeit und reduziert Doppelpflege. Gute Content-Management-Prozesse verbessern ausserdem Compliance, weil Freigaben, Rechte und Aenderungen nachvollziehbar bleiben. Fuer Organisationen, die Veranstaltungen, Mitglieder, Medien und redaktionelle Inhalte parallel betreuen, wird Content Management damit zum Rueckgrat der digitalen Kommunikation. Es entscheidet, wie professionell eine Plattform nach innen und aussen arbeitet.\n\nGerade fuer eine Branchenplattform zeigt sich der Wert solcher Strukturen im Alltag. Events, Referenten, Sponsoren, Mitglieder, Bilder und Nachberichte koennen nur dann konsistent erscheinen, wenn Inhalte einmal sauber erfasst und danach flexibel ausgespielt werden. Besonders wertvoll wird dies, wenn Inhalte spaeter fuer Archiv, Newsletter, Eventkommunikation und Mitgliederbereich erneut genutzt werden.","sortOrder":5,"icon":"CM","title":"Content Management","status":"active","shortDescription":"Systeme und Prozesse fuer skalierbare Mediaprodukte.","updated_at":"2026-06-23T08:12:01.728Z","thumbnail_media_asset_id":"media-asset-f2d3b7c8-fcdc-47fb-bbf2-1caa0dff6273","imageUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Farticles%2FOCLN%2Fki-content-management-variante-2_OCLN_topic_16x9_v2_thumb.webp?alt=media&token=b192c0f9-c5c4-4f48-80f5-02985da1f713","thumbnail_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Farticles%2FOCLN%2Fki-content-management-variante-2_OCLN_topic_16x9_v2_thumb.webp?alt=media&token=b192c0f9-c5c4-4f48-80f5-02985da1f713","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Farticles%2FOCLN%2Fki-content-management-variante-2_OCLN_topic_16x9_v2_thumb.webp?alt=media&token=b192c0f9-c5c4-4f48-80f5-02985da1f713","mediaAssetId":"media-asset-f2d3b7c8-fcdc-47fb-bbf2-1caa0dff6273","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Farticles%2FOCLN%2Fki-content-management-variante-2_OCLN_topic_16x9 gen sich lokale und nationale Publisher im Wettbewerb um Reichweite, Werbeeinnahmen und Nutzerdaten stellen müssen. Gleichzeitig diskutierte er Möglichkeiten, wie sich regionale Anbieter durch glaubwürdige Inhalte, Nähe zu ihren Zielgruppen und eine klare strategische Positionierung im Markt behaupten können.","shortDescription":"Der Geschäftsführer der Nayoki Mediaplus GmbH & Co. KG analysierte die wachsende Marktmacht internationaler Plattformen und die Perspektiven regionaler Medienanbieter.","eventIds":["event-leica-welt-2026"],"sortOrder":4,"thumbnailMediaAssetId":"media-asset-863a2745-dea0-4497-8a76-fc03ef061055","thumbnail_media_asset_id":"media-asset-863a2745-dea0-4497-8a76-fc03ef061055","imageUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fleica-2026-christof-baron-lokale-publisher%2F1787040260355-917ad6b1-9019-4e1f-a1ed-40a476f92cee.jpg?alt=media&token=faa7286a-85a8-4044-b97f-615a49a362bf","thumbnail_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fleica-2026-christof-baron-lokale-publisher%2F1787040260355-917ad6b1-9019-4e1f-a1ed-40a476f92cee.jpg?alt=media&token=faa7286a-85a8-4044-b97f-615a49a362bf","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fleica-2026-christof-baron-lokale-publisher%2F1787040260355-917ad6b1-9019-4e1f-a1ed-40a476f92cee.jpg?alt=media&token=faa7286a-85a8-4044-b97f-615a49a362bf","mediaAssetId":"media-asset-863a2745-dea0-4497-8a76-fc03ef061055","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fleica-2026-christof-baron-lokale-publisher%2F1787040260355-917ad6b1-9019-4e1f-a1ed-40a476f92cee.jpg?alt=media&token=faa7286a-85a8-4044-b97f-615a49a362bf","updatedAt":"2026-08-18T08:04:44.137Z"},{"id":"leica-2026-dirk-engel-posthumanes-marketing","visibility":"public","speakerIds":["speakers-dirk-engel"],"speakerId":"speakers-dirk-engel","title":"Marketing im posthumanen Zeitalter","status":"active","subtitle":"Der Markt- und Mediaforscher untersuchte, wie Daten, Automatisierung und Künstliche Intelligenz zukünftige Marketingstrategien prägen werden.","shortDescription":"Der Markt- und Mediaforscher untersuchte, wie Daten, Automatisierung und Künstliche Intelligenz zukünftige Marketingstrategien prägen werden.","eventIds":["event-leica-welt-2026"],"sortOrder":5,"companyLogoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fleica-2026-dirk-engel-posthumanes-marketing-company-logo%2F1787037815698-cda8f9c8-c2a9-4614-8421-3a5382d3e2c7.jpg?alt=media&token=d45b9372-6665-4920-ab58-026064caa293","imageUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fleica-2026-dirk-engel-posthumanes-marketing%2F1787037815084-a51da215-889c-42b8-9cc2-4a9ad83e37e9.jpg?alt=media&token=01683c00-45a0-4ee7-94f5-51b1a62197a8","longDescription":"**Marketing im posthumanen Zeitalter**  \n*Der Markt- und Mediaforscher untersuchte, wie Daten, Automatisierung und Künstliche Intelligenz zukünftige Marketingstrategien prägen werden.*\n\nIm Zeitalter des posthumanen Marketings verändern sich die Grundlagen der Werbe- und Kommunikationsstrategien grundlegend. Dirk Engel, erfahrener Markt- und Mediaforscher, analysiert, wie datengetriebene Modelle, Algorithmen und automatisierte Systeme zunehmend Entscheidungen im Marketingprozess übernehmen. Diese Entwicklung eröffnet neue Möglichkeiten, etwa durch präzisere Zielgruppenanalysen und hochgradig personalisierte Kommunikation, die auf individuellen Nutzerprofilen basieren. \n\nEngel hebt hervor, dass die Integration von Künstlicher Intelligenz und Automatisierung zwar Effizienz und Genauigkeit steigert, jedoch nicht die menschliche Komponente im Marketing ersetzt. Kreativität, Erfahrung und Urteilsvermögen bleiben unverzichtbar, um die gewonnenen Daten sinnvoll zu interpretieren und strategisch einzusetzen. Die Herausforderung für Unternehmen liegt darin, eine Balance zwischen technologischer Innovation und menschlicher Expertise zu finden.\n\nDarüber hinaus betont Engel die Verantwortung der Unternehmen im Umgang mit Daten und automatisierten Entscheidungsprozessen. Datenschutz, ethische Standards und Transparenz gewinnen an Bedeutung, um Vertrauen bei Kunden und Partnern zu sichern. Die zunehmende Automatisierung erfordert daher nicht nur technisches Know-how, sondern auch eine reflektierte Haltung gegenüber den gesellschaftlichen Auswirkungen.\n\nFür die digitale Medienwirtschaft bedeutet diese Entwicklung eine Verschiebung der Kompetenzen und Arbeitsweisen. Marketingfachleute müssen sich verstärkt mit datenwissenschaftlichen Methoden auseinandersetzen und zugleich ihre kreativen Fähigkeiten weiterentwickeln. Die Kombination aus algorithmischer Präzision und menschlicher Intuition wird zum entscheidenden Erfolgsfaktor.\n\nDirk Engels Beitrag liefert damit eine fundierte Einordnung der aktuellen Transformation im Marketing und zeigt auf, wie Unternehmen sich auf die Zukunft einstellen können. Seine langjährige Erfahrung in der Marktforschung und Medienanalyse verleiht seinen Einschätzungen dabei besondere Relevanz für die Branche.\n\n**Keywords:** Marketing, Automatisierung, Künstliche Intelligenz, Marktforschung","description":"**Marketing im posthumanen Zeitalter**  \n*Der Markt- und Mediaforscher untersuchte, wie Daten, Automatisierung und Künstliche Intelligenz zukünftige Marketingstrategien prägen werden.*\n\nIm Zeitalter des posthumanen Marketings verändern sich die Grundlagen der Werbe- und Kommunikationsstrategien grundlegend. Dirk Engel, erfahrener Markt- und Mediaforscher, analysiert, wie datengetriebene Modelle, Algorithmen und automatisierte Systeme zunehmend Entscheidungen im Marketingprozess übernehmen. Diese Entwicklung eröffnet neue Möglichkeiten, etwa durch präzisere Zielgruppenanalysen und hochgradig personalisierte Kommunikation, die auf individuellen Nutzerprofilen basieren. \n\nEngel hebt hervor, dass die Integration von Künstlicher Intelligenz und Automatisierung zwar Effizienz und Genauigkeit steigert, jedoch nicht die menschliche Komponente im Marketing ersetzt. Kreativität, Erfahrung und Urteilsvermögen bleiben unverzichtbar, um die gewonnenen Daten sinnvoll zu interpretieren und strategisch einzusetzen. Die Herausforderung für Unternehmen liegt darin, eine Balance zwischen technologischer Innovation und menschlicher Expertise zu finden.\n\nDarüber hinaus betont Engel die Verantwortung der Unternehmen im Umgang mit Daten und automatisierten Entscheidungsprozessen. Datenschutz, ethische Standards und Transparenz gewinnen an Bedeutung, um Vertrauen bei Kunden und Partnern zu sichern. Die zunehmende Automatisierung erfordert daher nicht nur technisches Know-how, sondern auch eine reflektierte Haltung gegenüber den gesellschaftlichen Auswirkungen.\n\nFür die digitale Medienwirtschaft bedeutet diese Entwicklung eine Verschiebung der Kompetenzen und Arbeitsweisen. Marketingfachleute müssen sich verstärkt mit datenwissenschaftlichen Methoden auseinandersetzen und zugleich ihre kreativen Fähigkeiten weiterentwickeln. Die Kombination aus algorithmischer Präzision und menschlicher Intuition wird zum entscheidenden Erfolgsfaktor.\n\nDirk Engels Beitrag liefert damit eine fundierte Einordnung der aktuellen Transformation im Marketing und zeigt auf, wie Unternehmen sich auf die Zukunft einstellen können. Seine langjährige Erfahrung in der Marktforschung und Medienanalyse verleiht seinen Einschätzungen dabei besondere Relevanz für die Branche.\n\n**Keywords:** Marketing, Automatisierung, Künstliche Intelligenz, Marktforschung","updatedAt":"2026-08-18T07:28:34.014Z"},{"id":"leica-2026-jan-isenbart-werbewirkung","visibility":"public","speakerIds":["speakers-jan-isenbart"],"speakerId":"speakers-jan-isenbart","status":"active","longDescription":"Jan Isenbart stellte aktuelle Forschungsergebnisse zur Wirkung von Werbung vor und ordnete ein, welche Ziele Werbetreibende mit ihren Kommunikationsmaßnahmen realistisch erreichen können. Dabei ging es unter anderem um Aufmerksamkeit, Markenwahrnehmung und die langfristige Wirkung unterschiedlicher Medienkontakte. Sein Vortrag machte deutlich, dass erfolgreiche Werbung nicht allein anhand kurzfristiger Reaktionen beurteilt werden sollte, sondern im Zusammenspiel verschiedener Faktoren und Kommunikationskanäle betrachtet werden muss.","subtitle":"Der Geschäftsleiter Forschung & Service bei ARD Media präsentierte aktuelle Erkenntnisse zur Werbewirkung und zu realistischen Erwartungen an moderne Kommunikation.","description":"Jan Isenbart stellte aktuelle Forschungsergebnisse zur Wirkung von Werbung vor und ordnete ein, welche Ziele Werbetreibende mit ihren Kommunikationsmaßnahmen realistisch erreichen können. Dabei ging es unter anderem um Aufmerksamkeit, Markenwahrnehmung und die langfristige Wirkung unterschiedlicher Medienkontakte. Sein Vortrag machte deutlich, dass erfolgreiche Werbung nicht allein anhand kurzfristiger Reaktionen beurteilt werden sollte, sondern im Zusammenspiel verschiedener Faktoren und Kommunikationskanäle betrachtet werden muss.","shortDescription":"Der Geschäftsleiter Forschung & Service bei ARD Media präsentierte aktuelle Erkenntnisse zur Werbewirkung und zu realistischen Erwartungen an moderne Kommunikation.","title":"Was Werbung heute tatsächlich leisten kann","eventIds":["event-leica-welt-2026"],"sortOrder":3,"companyLogoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fleica-2026-jan-isenbart-werbewirkung-company-logo%2F1787136863142-709ba8ad-5649-4d3a-97fb-b4e4be7d2981.webp?alt=media&token=7f95cf19-6a78-45eb-9aae-0d7c34926464","thumbnailMediaAssetId":"media-asset-02ea575c-21e6-4d94-8ab3-310cece9f5fd","thumbnail_media_asset_id":"media-asset-02ea575c-21e6-4d94-8ab3-310cece9f5fd","article_media_asset_id":"media-asset-02ea575c-21e6-4d94-8ab3-310cece r Watch Movies GmbH stellte Strategien vor, mit denen Produzenten globale Märkte und neue Zielgruppen erreichen können.","description":"Thomas Schneider-Trumpp beschäftigte sich mit den Herausforderungen und Chancen der internationalen Vermarktung audiovisueller Inhalte. Er erläuterte, welche Voraussetzungen Produktionen erfüllen müssen, um auf unterschiedlichen Märkten erfolgreich angeboten werden zu können. Neben der inhaltlichen Positionierung spielen dabei geeignete Vertriebswege, internationale Partnerschaften und ein gutes Verständnis der jeweiligen Zielgruppen eine entscheidende Rolle.","shortDescription":"Der Gründer der Watch Movies GmbH stellte Strategien vor, mit denen Produzenten globale Märkte und neue Zielgruppen erreichen können.","thumbnail_media_asset_id":"media-asset-daf446e8-4c95-485d-b44b-6984a59eb6af","imageUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Farticles%2FQ0AJ%2Fki-audiovisuelle-inhalte-erfolgreich-international-vermarkten-variante-1_Q0AJ_topic_16x9_v1_thumb.webp?alt=media&token=4be56000-e3fe-4ee8-be7d-7f13e9085153","thumbnail_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Farticles%2FQ0AJ%2Fki-audiovisuelle-inhalte-erfolgreich-international-vermarkten-variante-1_Q0AJ_topic_16x9_v1_thumb.webp?alt=media&token=4be56000-e3fe-4ee8-be7d-7f13e9085153","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Farticles%2FQ0AJ%2Fki-audiovisuelle-inhalte-erfolgreich-international-vermarkten-variante-1_Q0AJ_topic_16x9_v1_thumb.webp?alt=media&token=4be56000-e3fe-4ee8-be7d-7f13e9085153","mediaAssetId":"media-asset-daf446e8-4c95-485d-b44b-6984a59eb6af","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Farticles%2FQ0AJ%2Fki-audiovisuelle-inhalte-erfolgreich-international-vermarkten-variante-1_Q0AJ_topic_16x9_v1_thumb.webp?alt=media&token=4be56000-e3fe-4ee8-be7d-7f13e9085153","eventIds":["event-leica-welt-2026"],"sortOrder":2,"updatedAt":"2026-08-18T07:10:58.372Z"},{"id":"ott","longDescription":"OTT als Kern moderner Medienstrategien.","articleText":"OTT-Angebote ermoeglichen Medienunternehmen, Inhalte direkt ueber das offene Internet zum Publikum zu bringen. Damit veraendert sich die Beziehung zwischen Anbieter und Nutzer grundlegend. Sender, Produzenten und Plattformen koennen eigene Markenraeume schaffen, Daten besser verstehen und Angebote unabhaengiger von klassischen Distributionswegen entwickeln. Gleichzeitig steigen die Anforderungen an Produktqualitaet, Technik und Marketing.\n\nEin erfolgreiches OTT-Angebot braucht mehr als einen Videoplayer. Entscheidend sind eine klare Positionierung, verlaessliche Streamingqualitaet, einfache Registrierung, gute Suche, personalisierte Empfehlungen, Abrechnung, Kundenservice und konsistente Gestaltung auf Smartphone, Tablet, Smart TV und Desktop. Auch Rechteverwaltung, Jugendschutz, Datenschutz und Barrierefreiheit muessen professionell geloest sein.\n\nDie wirtschaftlichen Modelle sind vielfaeltig: werbefinanziert, abonnementbasiert, transaktional oder hybrid. Jedes Modell verlangt andere Kennzahlen. Bei Abonnements stehen Bindung und Zahlungsbereitschaft im Fokus, bei werbefinanzierten Angeboten Reichweite, Inventarqualitaet und Nutzungsdauer. Fuer viele Anbieter wird die Kombination verschiedener Modelle entscheidend.\n\nPROdigitalTV sieht OTT als strategisches Feld, in dem Technologie, Content, Marke und Vermarktung eng zusammenarbeiten muessen. Besonders wichtig ist der Austausch darueber, welche Angebote eigenstaendig tragfaehig sind, wann Partnerschaften sinnvoller sind und wie europaeische Anbieter gegen internationale Plattformen bestehen koennen. OTT ist kein einzelnes Produkt, sondern ein langfristiger Transformationsprozess fuer die gesamte Medienorganisation.\n\nDer Aufbau eines OTT-Angebots verlangt Geduld und klare Prioritaeten. Viele Projekte scheitern nicht an der Idee, sondern an zu ungenauer Zielsetzung, zu komplexer Technik oder fehlender Vermarktung. Erfolgreiche Anbieter denken Produkt, Redaktion, Daten und Kundenbeziehung gemeinsam. Sie testen Nutzungspfade, verbessern kontinuierlich die Oberflaeche und messen, welche Inhalte Bindung erzeugen. Gleichzeitig muessen Kosten fuer Betrieb, Entwicklung und Lizenzen realistisch geplant werden. OTT wird damit zu einem Feld, in dem Medienkompetenz und digitale Produktkompetenz untrennbar zusammengehoeren.\n\nFuer die Branche bleibt deshalb wichtig, OTT nicht nur als App-Projekt zu verstehen. Es geht um Kundenzugang, Datenverantwortung, Markenbindung und langfristige Produktpflege. Wer diese Ebenen zusammendenkt, schafft digitale Angebote mit Substanz. Diese Verbindung macht OTT zu einem dauerhaften Lernfeld fuer alle, die direkte digitale Medienbeziehungen aufbauen wollen.","sortOrder":6,"icon":"OT","shortDescription":"Streaming-Angebote und direkte Kundenbeziehungen.","title":"OTT","status":"active","bodyText":"OTT als Kern moderner Medienstrategien.","subtitle":"","publishDate":"","validFrom":"","updated_at":"2026-06-23T08:12:01.785Z","thumbnail_media_asset_id":"media-asset-8fc04c9d-d7d8-4543-99b5-7d03d9b5e02a","imageUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Farticles%2FTD42%2Fott-ki-collage-1536x1024_news_desktop_1200x675.webp?alt=media&token=f0580493-81f7-47e5-a512-ceb261c492aa","thumbnail_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Farticles%2FTD42%2Fott-ki-collage-1536x1024_news_desktop_1200x675.webp?alt=media&token=f0580493-81f7-47e5-a512-ceb261c492aa","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Farticles%2FTD42%2Fott-ki-collage-1536x1024_news_desktop_1200x675.webp?alt=media&token=f0580493-81f7-47e5-a512-ceb261c492aa","mediaAssetId":"media-asset-8fc04c9d-d7d8-4543-99b5-7d03d9b5e02a","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Farticles%2FTD42%2Fott-ki-collage-1536x1024_news_desktop_1200x675.webp?alt=media&token=f0580493-81f7-47e5-a512-ceb261c492aa","updatedAt":"2026-07-27T13:27:23.652Z"},{"id":"plattformstrategien","longDescription":"Strategische Partnerschaften fuer Distribution.","articleText":"Plattformstrategien entscheiden heute massgeblich darueber, ob Medienangebote sichtbar, nutzbar und wirtschaftlich erfolgreich sind. Inhalte konkurrieren nicht nur mit aehnlichen Angeboten, sondern mit der gesamten Aufmerksamkeitslogik grosser Plattformen. Smart-TV-Oberflaechen, App-Stores, Streamingdienste, soziale Netzwerke, Suchsysteme und Aggregatoren bestimmen, wie Menschen Inhalte entdecken und bewerten.\n\nFuer Medienunternehmen stellt sich deshalb die Frage, welche Rolle eigene Plattformen, Partnerplattformen und offene Distributionswege spielen sollen. Eine starke eigene Marke ist wichtig, reicht aber selten allein. Gleichzeitig kann zu grosse Abhaengigkeit von externen Plattformen Risiken erzeugen: veraenderte Algorithmen, neue Gebuehrenmodelle, eingeschraenkter Datenzugang oder schwierige Auffindbarkeit.\n\nEine tragfaehige Plattformstrategie verbindet Reichweite, Kontrolle und Wirtschaftlichkeit. Sie definiert, welche Inhalte exklusiv bleiben, welche breit verteilt werden, welche Daten benoetigt werden und welche Partnerschaften strategisch sinnvoll sind. Auch technische Standards, Metadatenqualitaet, Rechteverwaltung und Markenfuehrung muessen zusammen gedacht werden.\n\nPROdigitalTV bietet fuer diese Fragen einen professionellen B2B-Rahmen. Im Netzwerk treffen Anbieter, Plattformbetreiber, Technologiepartner, Juristen und Vermarkter aufeinander. Der Austausch hilft, Interessen auszugleichen, Marktveraenderungen frueh zu erkennen und gemeinsame Standards zu diskutieren. Plattformstrategien sind damit nicht nur Vertriebsfragen, sondern Kernfragen der digitalen Medienwirtschaft.\n\nEine gute Strategie beantwortet auch, welche Abhaengigkeiten akzeptiert werden. Nicht jede Plattformpartnerschaft ist gleich wertvoll, und nicht jede Reichweite ist wirtschaftlich sinnvoll. Medienunternehmen brauchen Kriterien, mit denen sie Sichtbarkeit, Datenzugang, Erlospotenzial und Markenwirkung bewerten. Gleichzeitig sollten sie eigene Kanaele so entwickeln, dass sie nicht nur als Pflichtauftritt existieren, sondern echte Nutzerbeziehungen schaffen. Plattformstrategien bleiben dynamisch: Neue Geraete, neue Benutzeroberflaechen und neue Regulierung koennen etablierte Modelle schnell veraendern. Kontinuierlicher Austausch hilft, rechtzeitig zu reagieren.\n\nFuer PROdigitalTV ist dieser Austausch wertvoll, weil Plattformentscheidungen selten rein technisch sind. Sie betreffen Investitionen, Rechte, Verhandlungsmacht und Markenpositionierung. Gute Strategien machen diese Zusammenhaenge transparent und helfen, Prioritaeten belastbar zu setzen. Gerade deshalb sollten Plattformentscheidungen regelmaessig im Fuehrungskreis diskutiert werden. Sie beeinflussen Investitionen, Partnerschaften, Datenzugang und die langfristige Unabhaengigkeit der Marke.","sortOrder":7,"icon":"PS","shortDescription":"Reichweite in fragmentierten Maerkten sichern.","title":"Plattformstrategien","status":"active","updated_at":"2026-06-23T08:12:01.843Z","thumbnail_media_asset_id":"media-asset-273010a2-867f-4b82-964c-e8ff35d1fa8a","imageUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Farticles%2FIXRL%2Fplattformstrategien-ki-collage-1536x1024_news_desktop_1200x675.webp?alt=media&token=39bca1ef-f90d-4fbd-aea8-0649d87b8ee2","thumbnail_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Farticles%2FIXRL%2Fplattformstrategien-ki-collage-1536x1024_news_desktop_1200x675.webp?alt=media&token=39bca1ef-f90d-4fbd-aea8-0649d87b8ee2","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv- b er einen Einblick in strategische Überlegungen aus dem Magine Pro White Paper und zeigte, wie Anbieter Reichweite, technische Skalierung, Zielgruppenfokus und Monetarisierung gegeneinander abwägen können.","sortOrder":1,"subtitle":"Jan Bertil Dahms stellte zentrale Thesen aus dem Magine Pro White Paper vor und ordnete Skalierungsstrategien für digitale Medienangebote ein.","status":"active","media_asset_id":"media-asset-7608d08c-1e0d-4b2b-8926-5f095faaacd7","thumbnailMediaAssetId":"media-asset-38fb7c12-4532-457e-8c96-1979fc5a41ea","thumbnail_media_asset_id":"media-asset-38fb7c12-4532-457e-8c96-1979fc5a41ea","article_media_asset_id":"media-asset-38fb7c12-4532-457e-8c96-1979fc5a41ea","imageUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fsalzburg-2025-jan-bertil-dahms-go-big-or-go-small%2F1787045545068-cddb23d2-10bb-495b-a5ce-bf09c95e3b9e.webp?alt=media&token=ed86c303-a5e3-4bf8-b733-326234a2bdc8","thumbnail_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fsalzburg-2025-jan-bertil-dahms-go-big-or-go-small%2F1787045545068-cddb23d2-10bb-495b-a5ce-bf09c95e3b9e.webp?alt=media&token=ed86c303-a5e3-4bf8-b733-326234a2bdc8","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fsalzburg-2025-jan-bertil-dahms-go-big-or-go-small%2F1787045545068-cddb23d2-10bb-495b-a5ce-bf09c95e3b9e.webp?alt=media&token=ed86c303-a5e3-4bf8-b733-326234a2bdc8","mediaAssetId":"media-asset-38fb7c12-4532-457e-8c96-1979fc5a41ea","articleMediaAssetId":"media-asset-38fb7c12-4532-457e-8c96-1979fc5a41ea","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fsalzburg-2025-jan-bertil-dahms-go-big-or-go-small%2F1787045545068-cddb23d2-10bb-495b-a5ce-bf09c95e3b9e.webp?alt=media&token=ed86c303-a5e3-4bf8-b733-326234a2bdc8","updatedAt":"2026-08-18T09:32:47.866Z"},{"id":"salzburg-2025-jeanine-harmtodt-social-media-trends","longDescription":"Jeanine Harmtodt, Head of Digital Social & Campaigns beim Red Bull Media House, stellte aktuelle Social-Media-Trends und Kampagnenmechaniken vor. Ihr Vortrag zeigte, wie sich digitale Zielgruppenansprache, Community-Building, Kampagnenplanung und plattformgerechter Content weiterentwickeln und welche Rolle starke Marken im Social-Media-Umfeld spielen.","eventId":"event-salzburg-2025","visibility":"public","speakerIds":["speakers-jeanine-harmtodt"],"articleText":"Jeanine Harmtodt, Head of Digital Social & Campaigns beim Red Bull Media House, stellte aktuelle Social-Media-Trends und Kampagnenmechaniken vor. Ihr Vortrag zeigte, wie sich digitale Zielgruppenansprache, Community-Building, Kampagnenplanung und plattformgerechter Content weiterentwickeln und welche Rolle starke Marken im Social-Media-Umfeld spielen.","description":"Jeanine Harmtodt, Head of Digital Social & Campaigns beim Red Bull Media House, stellte aktuelle Social-Media-Trends und Kampagnenmechaniken vor. Ihr Vortrag zeigte, wie sich digitale Zielgruppenansprache, Community-Building, Kampagnenplanung und plattformgerechter Content weiterentwickeln und welche Rolle starke Marken im Social-Media-Umfeld spielen.","speakerId":"speakers-jeanine-harmtodt","shortDescription":"Jeanine Harmtodt zeigte aktuelle Entwicklungen im Social-Media-Marketing aus Sicht des Red Bull Media House.","title":"Social Media Trends","eventIds":["event-salzburg-2025"],"bodyText":"Jeanine Harmtodt, Head of Digital Social & Campaigns beim Red Bull Media House, stellte aktuelle Social-Media-Trends und Kampagnenmechaniken vor. Ihr Vortrag zeigte, wie sich digitale Zielgruppenansprache, Community-Building, Kampagnenplanung und plattformgerechter Content weiterentwickeln und welche Rolle starke Marken im Social-Media-Umfeld spielen.","sortOrder":3,"subtitle":"Jeanine Harmtodt zeigte aktuelle Entwicklungen im Social-Media-Marketing aus Sicht des Red Bull Media House.","status":"active","article_media_asset_id":"media-asset-a50e4ec6-233a-4d9c-b8b6-82099a4f086e","articleMediaAssetId":"media-asset-a50e4ec6-233a-4d9c-b8b6-82099a4f086e","thumbnailMediaAssetId":"media-asset-cd4091d4-8795-4e90-bd3f-e5d357fdc311","thumbnail_media_asset_id":"media-asset-cd4091d4-8795-4e90-bd3f-e5d357fdc311","imageUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fsalzburg-2025-jeanine-harmtodt-social-media-trends%2F1787044481677-1b0848c0-d15e-4bc3-b427-2ab7ca58e481.webp?alt=media&token=1c343498-a646-45ab-954a-c1ff9fab9366","media_asset_id":"media-asset-cd4091d4-8795-4e90-bd3f-e5d357fdc311","thumbnail_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fsalzburg-2025-jeanine-harmtodt-social-media-trends%2F1787044481677-1b0848c0-d15e-4bc3-b427-2ab7ca58e481.webp?alt=media&token=1c343498-a646-45ab-954a-c1ff9fab9366","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fsalzburg-2025-jeanine-harmtodt-social-media-trends%2F1787044481677-1b0848c0-d15e-4bc3-b427-2ab7ca58e481.webp?alt=media&token=1c343498-a646-45ab-954a-c1ff9fab9366","mediaAssetId":"media-asset-cd4091d4-8795-4e90-bd3f-e5d357fdc311","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fsalzburg-2025-jeanine-harmtodt-social-media-trends%2F1787044481677-1b0848c0-d15e-4bc3-b427-2ab7ca58e481.webp?alt=media&token=1c343498-a646-45ab-954a-c1ff9fab9366","updatedAt":"2026-08-18T09:23:31.140Z"},{"id":"smart-tv","sortOrder":1,"icon":"TV","shortDescription":"Plattformen, Interfaces und Reichweiten im vernetzten Wohnzimmer.","status":"active","subtitle":"Die Kombination aus traditioneller Programmstärke und datenbasierter Auffindbarkeit eröffnet neue Chancen für Reichweitenmessung und Zielgruppenansprache.","publishDate":"","validFrom":"","title":"Smart-TV-Plattformen als Brücke zwischen linearem Fernsehen und digitaler Mediennutzung","longDescription":"Smart-TV-Plattformen spielen eine zentrale Rolle in der Weiterentwicklung der Medienlandschaft, indem sie die Vorteile des linearen Fernsehens mit den Möglichkeiten digitaler Technologien verbinden. Während das klassische Fernsehen durch seine breite Akzeptanz und Verlässlichkeit punktet, bieten Smart-TV-Systeme eine verbesserte Auffindbarkeit von Inhalten und ermöglichen eine präzise Messung der Nutzung. Diese Verbindung schafft für Anbieter und Werbetreibende neue Potenziale, um Zielgruppen effektiver zu erreichen und Inhalte passgenau zu platzieren.\n\nIm vernetzten Wohnzimmer fungieren Smart-TV-Plattformen als Schnittstelle zwischen traditionellen Senderangeboten und digitalen Streamingdiensten. Nutzer profitieren von intuitiven Interfaces, die den Zugriff auf ein vielfältiges Programm erleichtern und gleichzeitig personalisierte Empfehlungen ermöglichen. Für die Medienbranche bedeutet dies eine Verschiebung hin zu datengetriebenen Geschäftsmodellen, die auf fundierten Nutzungsanalysen basieren. Die Messbarkeit der Zuschauerzahlen und des Nutzerverhaltens auf Smart TVs liefert wertvolle Insights für Programmgestaltung und Werbestrategien.\n\nDarüber hinaus stärken Smart-TV-Plattformen die Reichweite linearer Inhalte, indem sie diese in einem digitalen Umfeld zugänglich machen und so die Sichtbarkeit erhöhen. Die Kombination aus linearen Stärken und digitaler Auffindbarkeit ist ein entscheidender Faktor, um im Wettbewerb mit rein digitalen Anbietern bestehen zu können. Für die Medienwirtschaft eröffnet sich dadurch ein hybrides Modell, das traditionelle und neue Medienformen miteinander verzahnt und so nachhaltige Wachstumschancen schafft.\n\nInsgesamt markieren Smart-TV-Plattformen einen wichtigen Schritt in der Transformation der Fernsehbranche. Sie ermöglichen es, die Vorteile beider Welten zu nutzen: die Verlässlichkeit des linearen Fernsehens und die Flexibilität digitaler Medien. Damit tragen sie maßgeblich dazu bei, die Zukunft des Fernsehens im digitalen Zeitalter zu gestalten.\n\nKeywords:  \nSmart-TV, Plattformen, Reichweite, Nutzungsmessung","bodyText":"Smart-TV-Plattformen spielen eine zentrale Rolle in der Weiterentwicklung der Medienlandschaft, indem sie die Vorteile des linearen Fernsehens mit den Möglichkeiten digitaler Technologien verbinden. Während das klassische Fernsehen durch seine breite Akzeptanz und Verlässlichkeit punktet, bieten Smart-TV-Systeme eine verbesserte Auffindbarkeit von Inhalten und ermöglichen eine präzise Messung der Nutzung. Diese Verbindung schafft für Anbieter und Werbetreibende neue Potenziale, um Zielgruppen effektiver zu erreichen und Inhalte passgenau zu platzieren.\n\nIm vernetzten Wohnzimmer fungieren Smart-TV-Plattformen als Schnittstelle zwischen traditionellen Senderangeboten und digitalen Streamingdiensten. Nutzer profitieren von intuitiven Interfaces, die den Zugriff auf ein vielfältiges Programm erleichtern und gleichzeitig personalisierte Empfehlungen ermöglichen. Für die Medienbranche bedeutet dies eine Verschiebung hin zu datengetriebenen Geschäftsmodellen, die auf fundierten Nutzungsanalysen basieren. Die Messbarkeit der Zuschauerzahlen und des Nutzerverhaltens auf Smart TVs liefert wertvolle Insights für Programmgestaltung und Werbestrategien.\n\nDarüber hinaus stärken Smart-TV-Plattformen die Reichweite linearer Inhalte, indem sie diese in einem digitalen Umfeld zugänglich machen und so die Sichtbarkeit erhöhen. Die Kombination aus linearen Stärken und digitaler Auffindbarkeit ist ein entscheidender Faktor, um im Wettbewerb mit rein digitalen Anbietern bestehen zu können. Für die Medienwirtschaft eröffnet sich dadurch ein hybrides Modell, das traditionelle und neue Medienformen miteinander verzahnt und so nachhaltige Wachstumschancen schafft.\n\nInsgesamt markieren Smart-TV-Plattformen einen wichtigen Schritt in der Transformation der Fernsehbranche. Sie ermöglichen es, die Vorteile beider Welten zu nutzen: die Verlässlichkeit des linearen Fernsehens und die von Big Blue Marble, einem Zusammenschluss der ORF-Tochter ORS Group und dem Streaming-Spezialisten Insys Video Technologies, ermöglicht C2PA die automatische Erkennung von Manipulationen an gestreamten Inhalten. Dabei werden Ursprung und Bearbeitungen transparent nachvollziehbar gemacht. Dieses Verfahren ist ein wirksames Mittel gegen Desinformation, da es die Authentizität digitaler Inhalte offenlegt und somit Nutzer vor Falschinformationen schützt. Für Contentanbieter bietet C2PA zudem einen Schutz vor unbegründeten Manipulationsvorwürfen. Die Einführung dieses Standards ist ein bedeutender Schritt für die Medienbranche, da sie die Glaubwürdigkeit digital verbreiteter Inhalte erhöht und die Integrität von Medienproduktionen sichert. Insbesondere in Zeiten wachsender digitaler Verbreitung und zunehmender Falschinformationen gewinnt die technische Nachvollziehbarkeit von Inhalten an Relevanz.  \n\nKeywords: Authentizität, Desinformation, Streaming, Medienbranche","bodyText":"C2PA ist ein offener technischer Standard, der darauf abzielt, das Vertrauen in digitale Medieninhalte zu stärken. Entwickelt von Big Blue Marble, einem Zusammenschluss der ORF-Tochter ORS Group und dem Streaming-Spezialisten Insys Video Technologies, ermöglicht C2PA die automatische Erkennung von Manipulationen an gestreamten Inhalten. Dabei werden Ursprung und Bearbeitungen transparent nachvollziehbar gemacht. Dieses Verfahren ist ein wirksames Mittel gegen Desinformation, da es die Authentizität digitaler Inhalte offenlegt und somit Nutzer vor Falschinformationen schützt. Für Contentanbieter bietet C2PA zudem einen Schutz vor unbegründeten Manipulationsvorwürfen. Die Einführung dieses Standards ist ein bedeutender Schritt für die Medienbranche, da sie die Glaubwürdigkeit digital verbreiteter Inhalte erhöht und die Integrität von Medienproduktionen sichert. Insbesondere in Zeiten wachsender digitaler Verbreitung und zunehmender Falschinformationen gewinnt die technische Nachvollziehbarkeit vo 81-a0104716dcec%2F1788973444392-9ba41600-df73-41b8-aa49-d393423edd7b.webp?alt=media&token=085c8abc-977e-421d-ad94-0b1d7333cddb","companyLogoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-1fc49fa9-483f-4961-a281-a0104716dcec-company-logo%2F1789718525344-21c7832b-c222-4e6b-9d11-a6105b4e7094.webp?alt=media&token=5362b8b0-1a77-49fe-a27b-6c0b3adba256","sortOrder":2,"articleText":"Wie wird aus einem linearen Programm ein Fast Channel, der auf digitalen Plattformen zuverlässig angeboten und gefunden werden kann? Dr. Melanie Grundmann, Senior Content Managerin der Funke Mediagruppe, wird in ihrem Vortrag „Vom Playout auf die Plattform: Was einen Fast Channel wirklich distributionsfähig macht“ die entscheidenden Schritte zwischen Programmbereitstellung und Plattformdistribution einordnen.\n\nIm Mittelpunkt werden die technischen und redaktionellen Voraussetzungen stehen, die ein Fast Channel für die Verbreitung über Plattformen wie Samsung TV Plus, Rakuten TV oder LG Channels erfüllen muss. Der Vortrag wird zeigen, dass ein funktionierendes Playout allein noch keine erfolgreiche Distribution garantiert. Ebenso wichtig sind auf die jeweilige Plattform abgestimmte Inhalte, verlässliche Abläufe und ein Verständnis der Mechanismen, mit denen Reichweite und Nutzung entstehen.\n\nDr. Melanie Grundmann wird außerdem erläutern, welche Bedeutung die Zusammenarbeit mit Plattformbetreibern für Medienunternehmen gewinnt. Dabei wird es um die Verbindung von Content-Strategie, technischer Bereitstellung und Vermarktung gehen. Für Anbieter stellt sich die Frage, wie bestehende Inhalte so strukturiert und positioniert werden können, dass daraus ein tragfähiges digitales Angebot entsteht.\n\nDer Beitrag richtet den Blick damit auf die gesamte Strecke vom Playout bis zur sichtbaren Präsenz auf der Plattform. Er wird konkrete Orientierung dazu geben, welche Faktoren bei Planung, Betrieb und Weiterentwicklung eines Fast Channels zusammenspielen und warum Distributionsfähigkeit zu einer zentralen Voraussetzung für neue lineare Streamingangebote wird.\n\nKeywords: Fastchannel, Distribution, Plattformökonomie, Medienstrategie","bodyText":"Wie wird aus einem linearen Programm ein Fast Channel, der auf digitalen Plattformen zuverlässig angeboten und gefunden werden kann? Dr. Melanie Grundmann, Senior Content Managerin der Funke Mediagruppe, wird in ihrem Vortrag „Vom Playout auf die Plattform: Was einen Fast Channel wirklich distributionsfähig macht“ die entscheidenden Schritte zwischen Programmbereitstellung und Plattformdistribution einordnen.\n\nIm Mittelpunkt werden die technischen und redaktionellen Voraussetzungen stehen, die ein Fast Channel für die Verbreitung über Plattformen wie Samsung TV Plus, Rakuten TV oder LG Channels erfüllen muss. Der Vortrag wird zeigen, dass ein funktionierendes Playout allein noch keine erfolgreiche Distribution garantiert. Ebenso wichtig sind auf die jeweilige Plattform abgestimmte Inhalte, verlässliche Abläufe und ein Verständnis der Mechanismen, mit denen Reichweite und Nutzung entstehen.\n\nDr. Melanie Grundmann wird außerdem erläutern, welche Bedeutung die Zusammenarbeit mit Plattformbetreibern für Medienunternehmen gewinnt. Dabei wird es um die Verbindung von Content-Strategie, technischer Bereitstellung und Vermarktung gehen. Für Anbieter stellt sich die Frage, wie bestehende Inhalte so strukturiert und positioniert werden können, dass daraus ein tragfähiges digitales Angebot entsteht.\n\nDer Beitrag richtet den Blick damit auf die gesamte Strecke vom Playout bis zur sichtbaren Präsenz auf der Plattform. Er wird konkrete Orientierung dazu geben, welche Faktoren bei Planung, Betrieb und Weiterentwicklung eines Fast Channels zusammenspielen und warum Distributionsfähigkeit zu einer zentralen Voraussetzung für neue lineare Streamingangebote wird.\n\nKeywords: Fastchannel, Distribution, Plattformökonomie, Medienstrategie","longDescription":"Wie wird aus separate oogleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-527a7339-d174-4a41-9282-9f9190bac80d%2F1789640484490-71ef31c0-60ef-419b-b55d-a42425f70689.webp?alt=media&token=9fc5ab8f-32a7-4733-a456-da331a0a3601","title":"Sport1 - All Access","mediaAssetId":"media-asset-03cca416-7bcd-42f8-91d6-fb12603f2fd1","imageUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-527a7339-d174-4a41-9282-9f9190bac80d%2F1789640484490-71ef31c0-60ef-419b-b55d-a42425f70689.webp?alt=media&token=9fc5ab8f-32a7-4733-a456-da331a0a3601","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-527a7339-d174-4a41-9282-9f9190bac80d%2F1789640484490-71ef31c0-60ef-419b-b55d-a42425f70689.webp?alt=media&token=9fc5ab8f-32a7-4733-a456-da331a0a3601","articleMediaAssetId":"media-asset-03cca416-7bcd-42f8-91d6-fb12603f2fd1","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-527a7339-d174-4a41-9282-9f9190bac80d%2F1789640484490-71ef31c0-60ef-419b-b55d-a42425f70689.webp?alt=media&token=9fc5ab8f-32a7-4733-a456-da331a0a3601","thumbnailMediaAssetId":"media-asset-03cca416-7bcd-42f8-91d6-fb12603f2fd1","visibility":"public","speakerIds":["speakers-278f6d39-6322-4279-8a16-2f1b04109c22"],"shortDescription":"Wie man Medienhypes über verschiedene Touchpoints kreiert","article_media_asset_id":"media-asset-03cca416-7bcd-42f8-91d6-fb12603f2fd1","subtitle":"Wie man Medienhypes über verschiedene Touchpoints kreiert","companyLogoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-527a7339-d174-4a41-9282-9f9190bac80d-company-logo%2F1789718876753-b89d89d7-9c0e-47d8-b464-a0273837c3a2.webp?alt=media&token=889cbeb3-6191-4dd6-8c12-ebdf5f0b8236","longDescription":"Wie entsteht aus einem Sportthema ein Medienereignis, das Menschen über mehrere Kanäle hinweg erreicht? Andreas Gerhard, Chief Content & Distribution Officer der Sport 1 GmbH, wird in seinem Vortrag „Sport1 - All Access“ zeigen, wie Inhalte, Distribution und unterschiedliche Touchpoints zusammenspielen, wenn Aufmerksamkeit und Reichweite gezielt aufgebaut werden sollen.\n\nIm Mittelpunkt wird die Frage stehen, wie ein Medienhype nicht nur an einem einzelnen Ausspielweg entsteht, sondern über mehrere Kontaktpunkte hinweg entwickelt werden kann. Der Vortrag wird betrachten, wie redaktionelle Inhalte, Plattformen und die Ansprache verschiedener Nutzergruppen aufeinander abgestimmt werden müssen, damit ein Thema wahrgenommen und weitergetragen wird.\n\nAndreas Gerhard wird die Perspektive eines Sportmedienanbieters einbringen und erläutern, welche Rolle eine koordinierte Content- und Distributionsstrategie dabei spielt. „All Access“ beschreibt in diesem Zusammenhang den Anspruch, Inhalte über unterschiedliche Wege zugänglich zu machen und die einzelnen Berührungspunkte zu einem konsistenten Medienerlebnis zu verbinden. Für digitale Medienunternehmen wird damit relevant, wie Reichweite, Engagement und Markenbindung gemeinsam gedacht werden können.\n\nDer Beitrag wird einordnen, welche Mechanismen hinter der gezielten Inszenierung und Verbreitung von Sportinhalten stehen. Er gibt einen Ausblick darauf, wie Medienmarken ihre Themen künftig kanalübergreifend führen können, ohne die jeweilige Nutzungssituation aus dem Blick zu verlieren. So entsteht eine praxisnahe Perspektive auf moderne Medienhypes und ihre Bedeutung für Content, Distribution und Publikum.\n\nKeywords: Sportmedien, Touchpoints, Contentstrategie, Distribution","description":"Wie entsteht aus einem Sportthema ein Medienereignis, das Menschen über mehrere Kanäle hinweg erreicht? Andreas Gerhard, Chief Content & Distribution Officer der Sport 1 GmbH, wird in seinem Vortrag „Sport1 - All Access“ zeigen, wie Inhalte, Distribution und unterschiedliche Touchpoints zusammenspielen, wenn Aufmerksamkeit und Reichweite gezielt aufgebaut werden s fassender Expertise im Medienrecht.\n\nKeywords: Urheberrecht, Fast Channels, Tarif, Medienwirtschaft","title":"Der neue Tarif der Münchner Gruppe für Direkteinspeisung von Fast Channels nach §20d UrhG","companyLogoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-63a7e03c-d2e5-42cb-b3e6-49daf4877ca3-company-logo%2F1789641994004-06d41c17-94a5-4258-8410-dff00e7550a2.webp?alt=media&token=e49e206c-1a92-49a0-bbf9-a6779c0f04d8","thumbnailMediaAssetId":"media-asset-dda9c1ed-df2d-4d7e-b644-376b4599d6f9","thumbnail_media_asset_id":"media-asset-dda9c1ed-df2d-4d7e-b644-376b4599d6f9","article_media_asset_id":"media-asset-dda9c1ed-df2d-4d7e-b644-376b4599d6f9","imageUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-63a7e03c-d2e5-42cb-b3e6-49daf4877ca3%2F1789642146663-420aea72-ed97-44f3-b93c-08233f65c08a.webp?alt=media&token=99b92237-581c-46af-b717-fac553dfd540","thumbnail_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-63a7e03c-d2e5-42cb-b3e6-49daf4877ca3%2F1789642146663-420aea72-ed97-44f3-b93c-08233f65c08a.webp?alt=media&token=99b92237-581c-46af-b717-fac553dfd540","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-63a7e03c-d2e5-42cb-b3e6-49daf4877ca3%2F1789642146663-420aea72-ed97-44f3-b93c-08233f65c08a.webp?alt=media&token=99b92237-581c-46af-b717-fac553dfd540","mediaAssetId":"media-asset-dda9c1ed-df2d-4d7e-b644-376b4599d6f9","articleMediaAssetId":"media-asset-dda9c1ed-df2d-4d7e-b644-376b4599d6f9","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-63a7e03c-d2e5-42cb-b3e6-49daf4877ca3%2F1789642146663-420aea72-ed97-44f3-b93c-08233f65c08a.webp?alt=media&token=99b92237-581c-46af-b717-fac553dfd540","sortOrder":1,"publishDate":"2026-10-23","validFrom":"2026-10-23","eventIds":["event-archiv eferent"},"updatedAt":"2026-09-26T10:45:28.868Z"},{"id":"topics-bc392b40-caf1-47b5-b858-7992b0b8fd86","longDescription":"Medien und Gema im Zeitalter von KI\n\nDie fortschreitende Integration Künstlicher Intelligenz (KI) in der Medienproduktion und -distribution stellt die Rechteverwertungsgesellschaft Gema und die gesamte Medienbranche vor neue Herausforderungen. KI-Technologien ermöglichen nicht nur die automatisierte Erstellung und Bearbeitung von Musik und audiovisuellen Inhalten, sondern verändern grundlegend, wie diese Werke genutzt und verbreitet werden. Vor diesem Hintergrund muss die Gema ihre Lizenzierungsmodelle an die technischen Neuerungen anpassen und gleichzeitig die Rechte der Urheber wirksam schützen.\n\nEin zentrales Thema ist die rechtliche Einordnung von KI-generierten Werken. Während bei klassischen Werken die Urheberschaft klar einem Menschen zugeordnet werden kann, ist bei von KI erstellten Inhalten die Frage nach dem Rechtsinhaber komplex und bislang nicht abschließend geklärt. Dies betrifft insbesondere die Vergütung und Lizenzierung durch die Gema. Zusätzlich sind Mechanismen erforderlich, um die Nutzung von KI-unterstützten Bearbeitungen und Remixen transparent und rechtssicher zu gestalten.\n\nFür die Medienbranche bedeutet dies eine Phase intensiver Anpassung. Unternehmen müssen ihre Verträge und Lizenzvereinbarungen überprüfen und gegebenenfalls neu gestalten, um den Einsatz von KI-Technologien rechtlich abzusichern. Gleichzeitig eröffnen sich neue Geschäftsmodelle, etwa durch personalisierte Musikangebote oder automatisierte Content-Erstellung, die durch angepasste Lizenzierungsstrukturen unterstützt werden müssen.\n\nMichael Schmittmann, erfahrener Rechtsanwalt mit Schwerpunkt IP, Media & Technology, beleuchtet in diesem Zusammenhang die rechtlichen Rahmenbedingungen und die praktischen Auswirkungen auf die Medienwirtschaft. Seine langjährige Expertise, unter anderem als Leiter der Praxisgruppe bei Heuking Kühn Lüer Wojtek und Lehrbeauftragter für europäisches Kommunikationsrecht, bietet wertvolle Einblicke in die Schnittstellen von Recht, Technologie und Medien.\n\nDie Auseinandersetzung mit den Folgen der KI für die Gema und die Medienbranche ist entscheidend, um Urheberrechte auch in einer zunehmend digitalen und automatisierten Welt wirksam zu schützen und zugleich Innovationspotenziale zu nutzen.\n\nKeywords: KünstlicheIntelligenz, Urheberrecht, Lizenzierung, Medienwirtschaft","thumbnail_media_asset_id":"media-asset-a2b2bc75-ae5d-421f-b452-8168702996b9","publishDate":"2026-10-22","description":"Medien und Gema im Zeitalter von KI\n\nDie fortschreitende Integration Künstlicher Intelligenz (KI) in der Medienproduktion und -distribution stellt die Rechteverwertungsgesellschaft Gema und die gesamte Medienbranche vor neue Herausforderungen. KI-Technologien ermöglichen nicht nur die automatisierte Erstellung und Bearbeitung von Musik und audiovisuellen Inhalten, sondern verändern grundlegend, wie diese Werke genutzt und verbreitet werden. Vor diesem Hintergrund muss die Gema ihre Lizenzierungsmodelle an die technischen Neuerungen anpassen und gleichzeitig die Rechte der Urheber wirksam schützen.\n\nEin zentrales Thema ist die rechtliche Einordnung von KI-generierten Werken. Während bei klassischen Werken die Urheberschaft klar einem Menschen zugeordnet werden kann, ist bei von KI erstellten Inhalten die Frage nach dem Rechtsinhaber komplex und bislang nicht abschließend geklärt. Dies betrifft insbesondere die Vergütung und Lizenzierung durch die Gema. Zusätzlich sind Mechanismen erforderlich, um die Nutzung von KI-unterstützten Bearbeitungen und Remixen transparent und rechtssicher zu gestalten.\n\nFür die Medienbranche bedeutet dies eine Phase intensiver Anpassung. Unternehmen müssen ihre Verträge und Lizenzvereinbarungen überprüfen und gegebenenfalls neu gestalten, um den Einsatz von KI-Technologien rechtlich abzusichern. Gleichzeitig eröffnen sich neue Geschäftsmodelle, etwa durch personalisie r und kostengünstiger produziert werden kann – und was diese Entwicklung für Technik, Arbeitsplätze und Produktionsmodelle bedeutet.","speakerId":"speakers-497de429-fc6a-4969-89d1-af8a180be1c2","title":"Die TV-Produktion der Zukunft: Remote, softwarebasiert und KI-gestützt","visibility":"public","speakerIds":["speakers-497de429-fc6a-4969-89d1-af8a180be1c2"],"shortDescription":"DMC zeigt anhand konkreter Produktionsbeispiele, wie sich klassische TV- und Sportproduktion verändert: Remote Production, softwarebasierte Regien, KI-gesteuerte Kameras und zunehmend automatisierte Produktionsabläufe. Im Mittelpunkt steht die Frage, wie künftig effizienter, flexibler und kostengünstiger produziert werden kann – und was diese Entwicklung für Technik, Arbeitsplätze und Produktionsmodelle bedeutet.","subtitle":"","status":"active","thumbnailMediaAssetId":"media-asset-34cffacb-84dd-4b66-b6b8-7888c9223613","thumbnail_media_asset_id":"media-asset-34cffacb-84dd-4b66-b6b8-7888c9223613","thumbnail_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-ca341066-3730-492b-ae9b-256f3acdc9ee%2F1789638503061-bf9862be-e04a-4d29-af93-289b33f035f9.webp?alt=media&token=713ea7c1-8e92-4e67-8e4f-aa4b80a5667b","mediaAssetId":"media-asset-34cffacb-84dd-4b66-b6b8-7888c9223613","article_media_asset_id":"media-asset-34cffacb-84dd-4b66-b6b8-7888c9223613","companyLogoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-ca341066-3730-492b-ae9b-256f3acdc9ee-company-logo%2F1789638525188-03971188-118a-4b1c-9d6b-61a063e872d4.webp?alt=media&token=fe091fac-3988-42ac-a9ff-53346672bbce","imageUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-ca341066-3730-492b-ae9b-256f3acdc9ee%2F1789638503061-bf9862be-e04a-4d29-af93-289b33f035f9.webp?alt=media&token=713ea7c1-8e92-4e67-8e4f-aa4b80a5667b","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-ca341066-3730-492b-ae9b-256f3acdc9ee%2F1789638503061-bf9862be-e04a-4d29-af93-289b33f035f9.webp?alt=media&token=713ea7c1-8e92-4e67-8e4f-aa4b80a5667b","articleMediaAssetId":"media-asset-34cffacb-84dd-4b66-b6b8-7888c9223613","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-ca341066-3730-492b-ae9b-256f3acdc9ee%2F1789638503061-bf9862be-e04a-4d29-af93-289b33f035f9.webp?alt=media&token=713ea7c1-8e92-4e67-8e4f-aa4b80a5667b","sortOrder":3,"longDescription":"Die TV-Produktion der Zukunft: Remote, softwarebasiert und KI-gestützt\n\nDie klassische TV- und Sportproduktion befindet sich in einem tiefgreifenden Wandel, der durch technologische Innovationen vorangetrieben wird. Das Digital Media Center (DMC) demonstriert anhand konkreter Beispiele, wie Remote Production, softwarebasierte Regien und KI-gesteuerte Kameras zunehmend Einzug in die Produktionsprozesse halten. Diese Entwicklungen ermöglichen eine effizientere, flexiblere und kostengünstigere Gestaltung von Abläufen, die bislang durch aufwendige Vor-Ort-Präsenz und manuelle Steuerung geprägt waren.\n\nRemote Production erlaubt es, Produktionen ortsunabhängig zu steuern, wodurch Ressourcen besser genutzt und logistische Herausforderungen minimiert werden können. Softwarebasierte Regien ersetzen traditionelle Hardware-Setups durch digitale Plattformen, die eine dynamische Anpassung und Automatisierung von Produktionsschritten erlauben. Künstliche Intelligenz unterstützt insbesondere bei der Kameraführung und Bildanalyse, indem sie Bewegungen und Szenen automatisch erkennt und entsprechend reagiert. Dies führt zu einer höheren Präzision und ermöglicht neue kreative Ansätze.\n\nFür die Medienbranche ergeben sich daraus weitreichende Konsequenzen: Technische Infrastruktur und Workflows müssen neu gedacht und angepasst werden, um die Potenziale dieser Technologien voll auszuschöpfen. Gleichzeitig verändern sich die Anforderungen an Fachkräfte, deren Aufgaben zunehmend von der Bedienung komplexer Software und der Überwachung automatisierter Systeme geprägt sind. Auch die Produktionsmodelle selbst wandeln sich, da flexiblere und skalierbare Lösungen gefragt sind, die sich schnell an wechselnde Bedingungen anpassen lassen.\n\nInsgesamt steht die Branche vor der Herausforderung, diese Transformation so zu gestalten, dass Effizienzgewinne und Kostensenkungen mit der Sicherung von Qualität und Arbeitsplätzen in Einklang gebracht werden. Die vorgestellten Beispiele des DMC bieten wertvolle Einblicke in die praktische Umsetzung und zeigen, wie die TV-Produktion der Zukunft aussehen kann.\n\nKeywords: Remote Production, Software, Künstliche Intelligenz, Automatisierung","bodyText":"Die TV-Produktion der Zukunft: Remote, softwarebasiert und KI-gestützt\n\nDie klassische TV- und Sportproduktion befindet sich in einem tiefgreifenden Wandel, der durch technologische Innovationen vorangetrieben wird. Das Digital Media Center (DMC) demonstriert anhand konkreter Beispiele, wie Remote Production, softwarebasierte Regien und KI-gesteuerte Kameras zunehmend Einzug in die Produktionsprozesse halten. Diese Entwicklungen ermöglichen eine effizientere, flexiblere und kostengünstigere Gestaltung von Abläufen, die bislang durch aufwendige Vor-Ort-Präsenz und manuelle Steuerung geprägt waren.\n\nRemote Production erlaubt es, Produktionen ortsunabhängig zu steuern, wodurch Ressourcen besser genutzt und logistische Herausforderungen minimiert werden können. Softwarebasierte Regien ersetzen traditionelle Hardware-Setups durch digitale Plattformen, die eine dynamische Anpassung und Automatisierung von Produktionsschritten erlauben. Künstliche Intelligenz unterstützt insbesondere bei der Kameraführung und Bildanalyse, indem sie Bewegungen und Szenen automatisch erkennt und entsprechend reagiert. Dies führt zu einer höheren Präzision und ermöglicht neue kreative Ansätze.\n\nFür die Medienbranche ergeben sich daraus weitreichende Konsequenzen: Technische Infrastruktur und Workflows müssen neu gedacht und angepasst werden, um die Potenziale dieser Technologien voll auszuschöpfen. Gleichzeitig verändern sich die Anforderungen an Fachkräfte, deren Aufgaben zunehmend von der Bedienung komplexer Software und der Überwachung automatisierter Systeme geprägt sind. Auch die Produktionsmodelle selbst wandeln sich, da flexiblere und skalierbare Lösungen gefragt sind, die sich schnell an wechselnde Bedingungen anpassen lassen.\n\nInsgesamt steht die Branche vor der Herausforderung, diese Transformation so zu gestalten, dass Effizienzgewinne und Kostensenkungen mit der Sicherung von Qualität und Arbeitsplätzen in Einklang gebracht werden. Die vorgestellten Beispiele des DMC bieten wertvolle Einblicke in die praktische Umsetzung und zeigen, wie die TV-Produktion der Zukunft aussehen kann.\n\nKeywords: Remote Production, Software, Künstliche Intelligenz, Automatisierung","articleText":"Die TV-Produktion der Zukunft: Remote, softwarebasiert und KI-gestützt\n\nDie klassische TV- und Sportproduktion befindet sich in einem tiefgreifenden Wandel, der durch technologische Innovationen vorangetrieben wird. Das Digital Media Center (DMC) demonstriert anhand konkreter Beispiele, wie Remote Production, softwarebasierte Regien und KI-gesteuerte Kameras zunehmend Einzug in die Produktionsprozesse halten. Diese Entwicklungen ermöglichen eine effizientere, flexiblere und kostengünstigere Gestaltung von Abläufen, die bislang durch aufwendige Vor-Ort-Präsenz und manuelle Steuerung geprägt waren.\n\nRemote Production erlaubt es, Produktionen ortsunabhängig zu steuern, wodurch Ressourcen besser genutzt und logistische Herausforderungen minimiert werden können. Softwarebasierte Regien ersetzen traditionelle Hardware-Setups durch digitale Plattformen, die eine dynamische Anpassung und Automatisierung von Produktionsschritten erlauben. Künstliche Intelligenz unterstützt insbesondere bei der Kameraführun
