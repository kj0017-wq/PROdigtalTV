490-71ef31c0-60ef-419b-b55d-a42425f70689.webp?alt=media&token=9fc5ab8f-32a7-4733-a456-da331a0a3601","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-527a7339-d174-4a41-9282-9f9190bac80d%2F1789640484490-71ef31c0-60ef-419b-b55d-a42425f70689.webp?alt=media&token=9fc5ab8f-32a7-4733-a456-da331a0a3601","articleMediaAssetId":"media-asset-03cca416-7bcd-42f8-91d6-fb12603f2fd1","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-527a7339-d174-4a41-9282-9f9190bac80d%2F1789640484490-71ef31c0-60ef-419b-b55d-a42425f70689.webp?alt=media&token=9fc5ab8f-32a7-4733-a456-da331a0a3601","thumbnailMediaAssetId":"media-asset-03cca416-7bcd-42f8-91d6-fb12603f2fd1","visibility":"public","speakerIds":["speakers-278f6d39-6322-4279-8a16-2f1b04109c22"],"shortDescription":"Wie man Medienhypes über verschiedene Touchpoints kreiert","article_media_asset_id":"media-asset-03cca416-7bcd-42f8-91d6-fb12603f2fd1","subtitle":"Wie man Medienhypes über verschiedene Touchpoints kreiert","companyLogoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-527a7339-d174-4a41-9282-9f9190bac80d-company-logo%2F1789718876753-b89d89d7-9c0e-47d8-b464-a0273837c3a2.webp?alt=media&token=889cbeb3-6191-4dd6-8c12-ebdf5f0b8236","longDescription":"Wie entsteht aus einem Sportthema ein Medienereignis, das Menschen über mehrere Kanäle hinweg erreicht? Andreas Gerhard, Chief Content & Distribution Officer der Sport 1 GmbH, wird in seinem Vortrag „Sport1 - All Access“ zeigen, wie Inhalte, Distribution und unterschiedliche Touchpoints zusammenspielen, wenn Aufmerksamkeit und Reichweite gezielt aufgebaut werden sollen.\n\nIm Mittelpunkt wird die Frage stehen, wie ein Medienhype nicht nur an einem einzelnen Ausspielweg entsteht, sondern über mehrere Kontaktpunkte hinweg entwickelt werden kann. Der Vortrag wird betrachten, wie redaktionelle Inhalte, Plattformen und die Ansprache verschiedener Nutzergruppen aufeinander abgestimmt werden müssen, damit ein Thema wahrgenommen und weitergetragen wird.\n\nAndreas Gerhard wird die Perspektive eines Sportmedienanbieters einbringen und erläutern, welche Rolle eine koordinierte Content- und Distributionsstrategie dabei spielt. „All Access“ beschreibt in diesem Zusammenhang den Anspruch, Inhalte über unterschiedliche Wege zugänglich zu machen und die einzelnen Berührungspunkte zu einem konsistenten Medienerlebnis zu verbinden. Für digitale Medienunternehmen wird damit relevant, wie Reichweite, Engagement und Markenbindung gemeinsam gedacht werden können.\n\nDer Beitrag wird einordnen, welche Mechanismen hinter der gezielten Inszenierung und Verbreitung von Sportinhalten stehen. Er gibt einen Ausblick darauf, wie Medienmarken ihre Themen künftig kanalübergreifend führen können, ohne die jeweilige Nutzungssituation aus dem Blick zu verlieren. So entsteht eine praxisnahe Perspektive auf moderne Medienhypes und ihre Bedeutung für Content, Distribution und Publikum.\n\nKeywords: Sportmedien, Touchpoints, Contentstrategie, Distribution","description":"Wie entsteht aus einem Sportthema ein Medienereignis, das Menschen über mehrere Kanäle hinweg erreicht? Andreas Gerhard, Chief Content & Distribution Officer der Sport 1 GmbH, wird in seinem Vortrag „Sport1 - All Access“ zeigen, wie Inhalte, Distribution und unterschiedliche Touchpoints zusammenspielen, wenn Aufmerksamkeit und Reichweite gezielt aufgebaut werden sollen.\n\nIm Mittelpunkt wird die Frage stehen, wie ein Medienhype nicht nur an einem einzelnen Ausspielweg entsteht, sondern über mehrere Kontaktpunkte hinweg entwickelt werden kann. Der Vortrag wird betrachten, wie redaktionelle Inhalte, Plattformen und die Ansprache verschiedener Nutzergruppen aufeinander abgestimmt werden müssen, damit ein Thema wahrgenommen und weitergetragen wird.\n\nAndreas Gerhard wird die Perspektive eines Sportmedienanbieters einbringen und erläutern, en hinter der gezielten Inszenierung und Verbreitung von Sportinhalten stehen. Er gibt einen Ausblick darauf, wie Medienmarken ihre Themen künftig kanalübergreifend führen können, ohne die jeweilige Nutzungssituation aus dem Blick zu verlieren. So entsteht eine praxisnahe Perspektive auf moderne Medienhypes und ihre Bedeutung für Content, Distribution und Publikum.\n\nKeywords: Sportmedien, Touchpoints, Contentstrategie, Distribution","status":"active","publishDate":"2026-10-23","validFrom":"2026-10-23","eventIds":["event-c5082f22-057b-44b4-8d50-8ccf3421f459","event-archive-63"],"updatedAt":"2026-09-28T08:03:02.931Z"},{"id":"topics-bc392b40-caf1-47b5-b858-7992b0b8fd86","longDescription":"Medien und Gema im Zeitalter von KI\n\nDie fortschreitende Integration Künstlicher Intelligenz (KI) in der Medienproduktion und -distribution stellt die Rechteverwertungsgesellschaft Gema und die gesamte Medienbranche vor neue Herausforderungen. KI-Technologien ermöglichen nicht nur die automatisierte Erstellung und Bearbeitung von Musik und audiovisuellen Inhalten, sondern verändern grundlegend, wie diese Werke genutzt und verbreitet werden. Vor diesem Hintergrund muss die Gema ihre Lizenzierungsmodelle an die technischen Neuerungen anpassen und gleichzeitig die Rechte der Urheber wirksam schützen.\n\nEin zentrales Thema ist die rechtliche Einordnung von KI-generierten Werken. Während bei klassischen Werken die Urheberschaft klar einem Menschen zugeordnet werden kann, ist bei von KI erstellten Inhalten die Frage nach dem Rechtsinhaber komplex und bislang nicht abschließend geklärt. Dies betrifft insbesondere die Vergütung und Lizenzierung durch die Gema. Zusätzlich sind Mechanismen erforderlich, um die Nutzung von KI-unterstützten Bearbeitungen und Remixen transparent und rechtssicher zu gestalten.\n\nFür die Medienbranche bedeutet dies eine Phase intensiver Anpassung. Unternehmen müssen ihre Verträge und Lizenzvereinbarungen überprüfen und gegebenenfalls neu gestalten, um den Einsatz von KI-Technologien rechtlich abzusichern. Gleichzeitig eröffnen sich neue Geschäftsmodelle, etwa durch personalisierte Musikangebote oder automatisierte Content-Erstellung, die durch angepasste Lizenzierungsstrukturen unterstützt werden müssen.\n\nMichael Schmittmann, erfahrener Rechtsanwalt mit Schwerpunkt IP, Media & Technology, beleuchtet in diesem Zusammenhang die rechtlichen Rahmenbedingungen und die praktischen Auswirkungen auf die Medienwirtschaft. Seine langjährige Expertise, unter anderem als Leiter der Praxisgruppe bei Heuking Kühn Lüer Wojtek und Lehrbeauftragter für europäisches Kommunikationsrecht, bietet wertvolle Einblicke in die Schnittstellen von Recht, Technologie und Medien.\n\nDie Auseinandersetzung mit den Folgen der KI für die Gema und die Medienbranche ist entscheidend, um Urheberrechte auch in einer zunehmend digitalen und automatisierten Welt wirksam zu schützen und zugleich Innovationspotenziale zu nutzen.\n\nKeywords: KünstlicheIntelligenz, Urheberrecht, Lizenzierung, Medienwirtschaft","thumbnail_media_asset_id":"media-asset-a2b2bc75-ae5d-421f-b452-8168702996b9","publishDate":"2026-10-22","description":"Medien und Gema im Zeitalter von KI\n\nDie fortschreitende Integration Künstlicher Intelligenz (KI) in der Medienproduktion und -distribution stellt die Rechteverwertungsgesellschaft Gema und die gesamte Medienbranche vor neue Herausforderungen. KI-Technologien ermöglichen nicht nur die automatisierte Erstellung und Bearbeitung von Musik und audiovisuellen Inhalten, sondern verändern grundlegend, wie diese Werke genutzt und verbreitet werden. Vor diesem Hintergrund muss die Gema ihre Lizenzierungsmodelle an die technischen Neuerungen anpassen und gleichzeitig die Rechte der Urheber wirksam schützen.\n\nEin zentrales Thema ist die rechtliche Einordnung von KI-generierten Werken. Während bei klassischen Werken die Urheberschaft klar einem Menschen zugeordnet werden kann, ist bei von KI erstellten Inhalten die Frage nach dem Rechtsinhaber r an der Juristischen Fakultät der Universität Hannover mit Schwerpunkt europäisches Kommunikationsrecht. Spezialisierung in Medien-, IT- und Glücksspielrecht.","company":"HEUKING","linkedIn":"https://de.linkedin.com/company/heuking-kuhn-luer-wojtek","position":"Rechtsanwalt / Partner","updatedAt":"2026-09-25T13:40:55.836Z"},{"id":"speakers-278f6d39-6322-4279-8a16-2f1b04109c22","lastName":"Gerhard","thumbnail_media_asset_id":"media-asset-a950582b-da68-492f-8eab-12956857edca","mediaAssetId":"media-asset-a950582b-da68-492f-8eab-12956857edca","photoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/speakers%2Fspeakers-278f6d39-6322-4279-8a16-2f1b04109c22%2F1789640457941-3556180d-a324-4239-8660-2f1a49883058.webp?alt=media&token=25add866-24de-4d1b-ab09-0510f82e5bcc","company":"Sport 1 GmbH","thumbnailMediaAssetId":"media-asset-a950582b-da68-492f-8eab-12956857edca","visibility":"public","firstName":"Andreas","name":"Andreas Gerhard","position":"Chief Content & Distribution Officer","status":"published","website":"https://www.sport1.de/","longBio":"Andreas Gerhardt ist seit 2016 bei SPORT1 tätig und seit Juni 2025 Chief Content & Distribution Officer. In dieser Funktion verantwortet er die Bereiche Content, Distribution, Produktion, Licensing sowie Regulatory und Public Affairs. Zuvor leitete er bei SPORT1 über mehrere Jahre die Distribution der TV- und digitalen Angebote.\n\nDer Rechtsanwalt verfügt über langjährige Erfahrung an der Schnittstelle von Medien, Sport, Recht und Distribution. Von 2023 bis 2025 war er zudem Geschäftsführer der Match IQ GmbH. Darüber hinaus ist er Lehrbeauftragter für Urheber- und Medienrecht an der Hochschule für angewandtes Management und engagiert sich in verschiedenen Branchen- und Fachgremien.","vita":"Andreas Gerhardt ist seit 2016 bei SPORT1 tätig und seit Juni 2025 Chief Content & Distribution Officer. In dieser Funktion verantwortet er die Bereiche Content, Distribution, Produktion, Licensing sowie Regulatory und Public Affairs. Zuvor leitete er bei SPORT1 über mehrere Jahre die Distribution der TV- und digitalen Angebote.\n\nDer Rechtsanwalt verfügt über langjährige Erfahrung an der Schnittstelle von Medien, Sport, Recht und Distribution. Von 2023 bis 2025 war er zudem Geschäftsführer der Match IQ GmbH. Darüber hinaus ist er Lehrbeauftragter für Urheber- und Medienrecht an der Hochschule für angewandtes Management und engagiert sich in verschiedenen Branchen- und Fachgremien.","shortBio":"Andreas Gerhardt ist seit 2016 bei SPORT1 tätig und seit Juni 2025 Chief Content & Distribution Officer. Er verantwortet unter anderem Content, Distribution, Produktion, Licensing sowie regulatorische und Public-Affairs-Themen. Zudem ist er Rechtsanwalt und Lehrbeauftragter für Urheber- und Medienrecht an der Hochschule für angewandtes Management.","linkedIn":"","topicId":"topics-527a7339-d174-4a41-9282-9f9190bac80d","topicIds":["topics-527a7339-d174-4a41-9282-9f9190bac80d"],"eventIds":["event-archive-63"],"updatedAt":"2026-09-28T08:03:02.613Z"}],"sponsors":[],"galleries":[],"mediaAssets":[{"id":"media-asset-602c969d-9a86-4aea-b114-347a243987da","file_path_original_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/events%2Fevent-c5082f22-057b-44b4-8d50-8ccf3421f459%2Fcover%2F1787046645356-c8c66078-bafd-403e-9187-f60de6853cf4.png?alt=media&token=4808bde9-4f69-458f-9427-6e6b17a75f87","image_height":1024,"media_type":"event","usage_preset":"event","slug":"von-den-besten-lernen-eqmr","updatedAt":"2026-08-18T09:50:47.164Z","visibility":"public","linked_collection":"events","source_type":"upload","image_width":1536,"target_field":"imageUrl","status":"active","created_at":"2026-08-18T09:50:47.161Z","linked_field":"imageUrl","title":"Von den Besten Lernen","updated_at":"2026-08-18T09:50:47.161Z","linked_record_id":"event-c5082f22-057b-44b4-8d50-8ccf3421f459","file_path_web_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/events%2Fevent-c5082f22-057b-44b4-8d50-8ccf3421f459%2Fcover%2F1787046645356-c8c66078-bafd-403e-9187-f60de6853cf4.png?alt=media&token=4808bde9-4f69-458f-9427-6e6b17a75f87","target_id":"event-c5082f22-057b-44b4-8d50-8ccf3421f459","file_path_thumb_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/events%2Fevent-c5082f22-057b-44b4-8d50-8ccf3421f459%2Fcover%2F1787046645356-c8c66078-bafd-403e-9187-f60de6853cf4.png?alt=media&token=4808bde9-4f69-458f-9427-6e6b17a75f87","target_collection":"events"}]},"event-leica-welt-2026":{"event":{"id":"event-leica-welt-2026","date":"2026-01-13","registrationEnabled":false,"city":"Wetzlar","postEventSummary":"Mit dem Medienfrühstück in der Leica-Welt setzte PROdigitalTV den Branchendialog am 13. Januar 2026 in Wetzlar fort. Das Ernst-Leitz Museum bildete den Rahmen fuer Austausch und persoenliche Vernetzung.","lifecyclePhase":"archive_published","description":"PROdigitalTV Medienfrühstück im Ernst-Leitz Museum in Wetzlar.","showPublicTeaser":true,"title":"Medienfrühstück in der Leica-Welt","accessType":"public","allowMemberRegistration":false,"startTime":"","allowPublicRegistration":false,"address":"","locationName":"Ernst-Leitz Museum","visibility":"public","hostId":"ernst-leitz-museum","sponsorIds":[],"subtitle":"PROdigitalTV in Wetzlar","endTime":"","status":"published","updated_at":"2026-06-12T09:40:56.472Z","thumbnail_media_asset_id":"media-asset-e1751af9-2377-4224-96fc-db557a74783a","mediaAssetId":"media-asset-e1751af9-2377-4224-96fc-db557a74783a","eventType":"Medienfrühstück","preStatus":"save_the_date","longDescription":"Am 13. Januar 2026 veranstaltete PROdigitalTV sein erstes Medienfrühstück des Jahres in der Leica-Welt in Wetzlar. Gastgeber des Branchentreffens war das Ernst Leitz Museum im Leitz-Park, einem Ort, der wie kaum ein anderer für Innovationskraft, Präzision und höchste Bildqualität steht.\n\nIm Mittelpunkt der Veranstaltung standen die Zukunft audiovisueller Medien, neue Technologien in Produktion und Vermarktung sowie die Auswirkungen Künstlicher Intelligenz auf die Medienbranche. Gleichzeitig bot die Veranstaltung Gelegenheit zum persönlichen Austausch zwischen Vertreterinnen und Vertretern aus Medienwirtschaft, Forschung, Vermarktung und Produktion.\n\n## Leica als Brücke zwischen Tradition und Zukunft\n\nZu Beginn wurde die besondere Bedeutung der Marke Leica für die internationale Medien- und Kreativbranche hervorgehoben. Das Unternehmen hatte 2025 das 100-jährige Jubiläum der legendären Leica I gefeiert – jener Kamera, die die moderne Fotografie nachhaltig geprägt hatte.\n\nDabei wurde deutlich, dass Leica heute nicht nur in der Fotografie eine herausragende Rolle spielt. Hochwertige Leica-Objektive kommen weltweit bei Filmproduktionen, TV-Serien und Streaming-Formaten zum Einsatz und stehen für höchste technische Qualität sowie besondere Bildästhetik. Die Leica-Welt bot damit den passenden Rahmen für die Diskussion aktueller Entwicklungen in der Medienbranche.\n\n## Vorträge und Diskussionen\n\nNach der Begrüßung durch den Vorstand von PROdigitalTV begann das Symposium mit einem abwechslungsreichen Programm.\n\nMola Adebisi sprach in einem persönlichen Interview über seine Erfahrungen in der Medienbranche und gab Einblicke in die Entwicklung des Fernsehens aus Sicht eines langjährigen Branchenkenners.\n\nBert Sahm von der M-COS Group erläuterte in seinem Vortrag, wie KI-gestützte Prozesse die klassische Content-Produktion verändern. Dabei zeigte er auf, wie sich Produktionsabläufe von analogen hin zu digitalen und zunehmend automatisierten Workflows entwickelt hatten.\n\nThomas Schneider-Trumpp, Gründer der Watch Movies GmbH, beschäftigte sich mit Strategien zur internationalen Vermarktung audiovisueller Inhalte und erläuterte, wie Produzenten heute globale Zielgruppen erreichen können.\n\nJan Isenbart, Geschäftsleiter Forschung & Service bei ARD Media, präsentierte aktuelle Erkenntnisse zur Wirkung von Werbung und zeigte auf, welche Erwartungen Werbetreibende realistisch an moderne Kommunikationsmaßnahmen stellen können.\n\nChristof Baron, Geschäftsführer der Nayoki Mediaplus GmbH & Co. KG, analysierte die zunehmende Konkurrenz internationaler Plattformen und diskutierte die Perspektiven lokaler Publisher in einem globalisierten Medienmarkt.\n\nDirk Engel, freiberuflicher Dozent, Fachautor sowie Markt- und Mediaforscher, widmete sich dem „Zeitalter des posthumanen Marketings“ und beleuchtete die Rolle von Daten, Automatisierung und Künstlicher Intelligenz in zukünftigen Marketingstrategien.\n\nZwischen den Vorträgen nutzten die Teilnehmerinnen und Teilnehmer die Gelegenheit zum Networking bei einem gemeinsamen Frühstück mit Kaffee und Snacks.\n\n## Blick hinter die Kulissen der Leica-Manufaktur\n\nIm Anschluss an das Symposium erhielten die Gäste im Rahmen einer Führung durch die Leica-Manufaktur einen Einblick in die Fertigung, Geschichte und Unternehmenskultur der Marke Leica.\n\nDie Besichtigung vermittelte eindrucksvoll, wie traditionelle Handwerkskunst, technologische Innovation und höchste Qualitätsansprüche bis heute miteinander verbunden werden.\n\n## Fazit\n\nDas Medienfrühstück in der Leica-Welt Wetzlar zeigte eindrucksvoll, wie eng technologische Innovation, hochwertige Medienproduktion und wirtschaftliche Zukunftsfragen miteinander verknüpft sind. Die Veranstaltung verband spannende Fachvorträge mit intensivem Austausch und bot den Teilnehmerinnen und Teilnehmern wertvolle Impulse für die Herausforderungen der digitalen Medienwelt.\n\nPROdigitalTV bedankte sich bei Leica, dem Ernst Leitz Museum sowie allen Referentinnen, Referenten und Gästen für eine erfolgreiche Veranstaltung und die zahlreichen anregenden Gespräche.\n","archiveText":"Am 13. Januar 2026 veranstaltete PROdigitalTV sein erstes Medienfrühstück des Jahres in der Leica-Welt in Wetzlar. Gastgeber des Branchentreffens war das Ernst Leitz Museum im Leitz-Park, einem Ort, der wie kaum ein ande a1ed-40a476f92cee.jpg?alt=media&token=faa7286a-85a8-4044-b97f-615a49a362bf","thumbnail_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fleica-2026-christof-baron-lokale-publisher%2F1787040260355-917ad6b1-9019-4e1f-a1ed-40a476f92cee.jpg?alt=media&token=faa7286a-85a8-4044-b97f-615a49a362bf","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fleica-2026-christof-baron-lokale-publisher%2F1787040260355-917ad6b1-9019-4e1f-a1ed-40a476f92cee.jpg?alt=media&token=faa7286a-85a8-4044-b97f-615a49a362bf","mediaAssetId":"media-asset-863a2745-dea0-4497-8a76-fc03ef061055","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fleica-2026-christof-baron-lokale-publisher%2F1787040260355-917ad6b1-9019-4e1f-a1ed-40a476f92cee.jpg?alt=media&token=faa7286a-85a8-4044-b97f-615a49a362bf","updatedAt":"2026-08-18T08:04:44.137Z"},{"id":"leica-2026-dirk-engel-posthumanes-marketing","visibility":"public","speakerIds":["speakers-dirk-engel"],"speakerId":"speakers-dirk-engel","title":"Marketing im posthumanen Zeitalter","status":"active","subtitle":"Der Markt- und Mediaforscher untersuchte, wie Daten, Automatisierung und Künstliche Intelligenz zukünftige Marketingstrategien prägen werden.","shortDescription":"Der Markt- und Mediaforscher untersuchte, wie Daten, Automatisierung und Künstliche Intelligenz zukünftige Marketingstrategien prägen werden.","eventIds":["event-leica-welt-2026"],"sortOrder":5,"companyLogoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fleica-2026-dirk-engel-posthumanes-marketing-company-logo%2F1787037815698-cda8f9c8-c2a9-4614-8421-3a5382d3e2c7.jpg?alt=media&token=d45b9372-6665-4920-ab58-026064caa293","imageUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fleica-2026-dirk-engel-posthumanes-marketing%2F1787037815084-a51da215-889c-42b8-9cc2-4a9ad83e37e9.jpg?alt=media&token=01683c00-45a0-4ee7-94f5-51b1a62197a8","longDescription":"**Marketing im posthumanen Zeitalter**  \n*Der Markt- und Mediaforscher untersuchte, wie Daten, Automatisierung und Künstliche Intelligenz zukünftige Marketingstrategien prägen werden.*\n\nIm Zeitalter des posthumanen Marketings verändern sich die Grundlagen der Werbe- und Kommunikationsstrategien grundlegend. Dirk Engel, erfahrener Markt- und Mediaforscher, analysiert, wie datengetriebene Modelle, Algorithmen und automatisierte Systeme zunehmend Entscheidungen im Marketingprozess übernehmen. Diese Entwicklung eröffnet neue Möglichkeiten, etwa durch präzisere Zielgruppenanalysen und hochgradig personalisierte Kommunikation, die auf individuellen Nutzerprofilen basieren. \n\nEngel hebt hervor, dass die Integration von Künstlicher Intelligenz und Automatisierung zwar Effizienz und Genauigkeit steigert, jedoch nicht die menschliche Komponente im Marketing ersetzt. Kreativität, Erfahrung und Urteilsvermögen bleiben unverzichtbar, um die gewonnenen Daten sinnvoll zu interpretieren und strategisch einzusetzen. Die Herausforderung für Unternehmen liegt darin, eine Balance zwischen technologischer Innovation und menschlicher Expertise zu finden.\n\nDarüber hinaus betont Engel die Verantwortung der Unternehmen im Umgang mit Daten und automatisierten Entscheidungsprozessen. Datenschutz, ethische Standards und Transparenz gewinnen an Bedeutung, um Vertrauen bei Kunden und Partnern zu sichern. Die zunehmende Automatisierung erfordert daher nicht nur technisches Know-how, sondern auch eine reflektierte Haltung gegenüber den gesellschaftlichen Auswirkungen.\n\nFür die digitale Medienwirtschaft bedeutet diese Entwicklung eine Verschiebung der Kompetenzen und Arbeitsweisen. Marketingfachleute müssen sich verstärkt mit datenwissenschaftlichen Methoden auseinandersetzen und zugleich ihre kreativen Fähigkeiten weiterentwickeln. Die Kombination aus algorithmischer Präzision und menschlicher Intuition wird zum entscheidenden Erfolgsfaktor.\n\nDirk Engels Beitrag liefert damit eine fundierte Einordnung der aktuellen Transformation im Marketing und zeigt auf, wie Unternehmen sich auf die Zukunft einstellen können. Seine langjährige Erfahrung in der Marktforschung und Medienanalyse verleiht seinen Einschätzungen dabei besondere Relevanz für die Branche.\n\n**Keywords:** Marketing, Automatisierung, Künstliche Intelligenz, Marktforschung","description":"**Marketing im posthumanen Zeitalter**  \n*Der Markt- und Mediaforscher untersuchte, wie Daten, Automatisierung und Künstliche Intelligenz zukünftige Marketingstrategien prägen werden.*\n\nIm Zeitalter des posthumanen Marketings verändern sich die Grundlagen der Werbe- und Kommunikationsstrategien grundlegend. Dirk Engel, erfahrener Markt- und Mediaforscher, analysiert, wie datengetriebene Modelle, Algorithmen und automatisierte Systeme zunehmend Entscheidungen im Marketingprozess übernehmen. Diese Entwicklung eröffnet neue Möglichkeiten, etwa durch präzisere Zielgruppenanalysen und hochgradig personalisierte Kommunikation, die auf individuellen Nutzerprofilen basieren. \n\nEngel hebt hervor, dass die Integration von Künstlicher Intelligenz und Automatisierung zwar Effizienz und Genauigkeit steigert, jedoch nicht die menschliche Komponente im Marketing ersetzt. Kreativität, Erfahrung und Urteilsvermögen bleiben unverzichtbar, um die gewonnenen Daten sinnvoll zu interpretieren und strategisch einzusetzen. Die Herausforderung für Unternehmen liegt darin, eine Balance zwischen technologischer Innovation und menschlicher Expertise zu finden.\n\nDarüber hinaus betont Engel die Verantwortung der Unternehmen im Umgang mit Daten und automatisierten Entscheidungsprozessen. Datenschutz, ethische Standards und Transparenz gewinnen an Bedeutung, um Vertrauen bei Kunden und Partnern zu sichern. Die zunehmende Automatisierung erfordert daher nicht nur technisches Know-how, sondern auch eine reflektierte Haltung gegenüber den gesellschaftlichen Auswirkungen.\n\nFür die digitale Medienwirtschaft bedeutet diese Entwicklung eine Verschiebung der Kompetenzen und Arbeitsweisen. Marketingfachleute müssen sich verstärkt mit datenwissenschaftlichen Methoden auseinandersetzen und zugleich ihre kreativen Fähigkeiten weiterentwickeln. Die Kombination aus algorithmischer Präzision und menschlicher Intuition wird zum entscheidenden Erfolgsfaktor.\n\nDirk Engels Beitrag liefert damit eine fundierte Einordnung der aktuellen Transformation im Marketing und zeigt auf, wie Unternehmen sich auf die Zukunft einstellen können. Seine langjährige Erfahrung in der Marktforschung und Medienanalyse verleiht seinen Einschätzungen dabei besondere Relevanz für die Branche.\n\n**Keywords:** Marketing, Automatisierung, Künstliche Intelligenz, Marktforschung","updatedAt":"2026-08-18T07:28:34.014Z"},{"id":"leica-2026-jan-isenbart-werbewirkung","visibility":"public","speakerIds":["speakers-jan-isenbart"],"speakerId":"speakers-jan-isenbart","status":"active","longDescription":"Jan Isenbart stellte aktuelle Forschungsergebnisse zur Wirkung von Werbung vor und ordnete ein, welche Ziele Werbetreibende mit ihren Kommunikationsmaßnahmen realistisch erreichen können. Dabei ging es unter anderem um Aufmerksamkeit, Markenwahrnehmung und die langfristige Wirkung unterschiedlicher Medienkontakte. Sein Vortrag machte deutlich, dass erfolgreiche Werbung nicht allein anhand kurzfristiger Reaktionen beurteilt werden sollte, sondern im Zusammenspiel verschiedener Faktoren und Kommunikationskanäle betrachtet werden muss.","subtitle":"Der Geschäftsleiter Forschung & Service bei ARD Media präsentierte aktuelle Erkenntnisse zur Werbewirkung und zu realistischen Erwartungen an moderne Kommunikation.","description":"Jan Isenbart stellte aktuelle Forschungsergebnisse zur Wirkung von Werbung vor und ordnete ein, welche Ziele Werbetreibende mit ihren Kommunikationsmaßnahmen realistisch erreichen können. Dabei ging es unter anderem um Aufmerksamkeit, Markenwahrnehmung und die langfristige Wirkung unterschiedlicher Medienkontakte. Sein Vortrag machte deutlich, dass erfolgreiche Werbung nicht allein anhand kurzfristiger Reaktionen beurteilt werden sollte, sondern im Zusammenspiel verschiedener Faktoren und Kommunikationskanäle betrachtet werden muss.","shortDescription":"Der Geschäftsleiter Forschung & Service bei ARD Media präsentierte aktuelle Erkenntnisse zur Werbewirkung und zu realistischen Erwartungen an moderne Kommunikation.","title":"Was Werbung heute tatsächlich leisten kann","eventIds":["event-leica-welt-2026"],"sortOrder":3,"companyLogoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fleica-2026-jan-isenbart-werbewirkung-company-logo%2F1787136863142-709ba8ad-5649-4d3a-97fb-b4e4be7d2981.webp?alt=media&token=7f95cf19-6a78-45eb-9aae-0d7c34926464","thumbnailMediaAssetId":"media-asset-02ea575c-21e6-4d94-8ab3-310cece9f5fd","thumbnail_media_asset_id":"media-asset-02ea575c-21e6-4d94-8ab3-310cece9f5fd","article_media_asset_id":"media-asset-02ea575c-21e6-4d94-8ab3-310cece9f5fd","imageUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fleica-2026-jan-isenbart-werbewirkung%2F1787136101671-3f838a06-a3ac-45d5-81fe-149747ec3240.webp?alt=media&token=c3e2e343-bf5c-4d4a-be75-dbc59c3b4caa","thumbnail_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fleica-2026-jan-isenbart-werbewirkung%2F1787136101671-3f838a06-a3ac-45d5-81fe-149747ec3240.webp?alt=media&token=c3e2e343-bf5c-4d4a-be75-dbc59c3b4caa","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fleica-2026-jan-isenbart-werbewirkung%2F1787136101671-3f838a06-a3ac-45d5-81fe-149747ec3240.webp?alt=media&token=c3e2e343-bf5c-4d4a-be75-dbc59c3b4caa","articleMediaAssetId":"media-asset-02ea575c-21e6-4d94-8ab3-310cece9f5fd","mediaAssetId":"media-asset-02ea575c-21e6-4d94-8ab3-310cece9f5fd","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fleica-2026-jan-isenbart-werbewirkung%2F1787136101671-3f838a06-a3ac-45d5-81fe-149747ec3240.webp?alt=media&token=c3e2e343-bf5c-4d4a-be75-dbc59c3b4caa","updatedAt":"2026-08-19T11:11:20.956Z"},{"id":"leica-2026-thomas-schneider-trumpp-international-vermarktung","visibility":"public","speakerIds":["speakers-thomas-schneider-trumpp"],"speakerId":"speakers-thomas-schneider-trumpp","title":"Audiovisuelle Inhalte erfolgreich international vermarkten","status":"active","longDescription":"Thomas Schneider-Trumpp beschäftigte sich mit den Herausforderungen und Chancen der internationalen Vermarktung audiovisueller Inhalte. Er erläuterte, welche Voraussetzungen Produktionen erfüllen müssen, um auf unterschiedlichen Märkten erfolgreich angeboten werden zu können. Neben der inhaltlichen Positionierung spielen dabei geeignete Vertriebswege, internationale Partnerschaften und ein gutes Verständnis der jeweiligen Zielgruppen eine entscheidende Rolle.","subtitle":"Der Gründer der Watch Movies GmbH stellte Strategien vor, mit denen Produzenten globale Märkte und neue Zielgruppen erreichen können.","description":"Thomas Schneider-Trumpp beschäftigte sich mit den Herausforderungen und Chancen der internationalen Vermarktung audiovisueller Inhalte. Er erläuterte, welche Voraussetzungen Produktionen erfüllen müssen, um auf unterschiedlichen Märkten erfolgreich angeboten werden zu können. Neben der inhaltlichen Positionierung spielen dabei geeignete Vertriebswege, internationale Partnerschaften und ein gutes Verständnis der jeweiligen Zielgruppen eine entscheidende Rolle.","shortDescription":"Der Gründer der Watch Movies GmbH stellte Strategien vor, mit denen Produzenten globale Märkte und neue Zielgruppen erreichen können.","thumbnail_media_asset_id":"media-asset-daf446e8-4c95-485d-b44b-6984a59eb6af","imageUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Farticles%2FQ0AJ%2Fki-audiovisuelle-inhalte-erfolgreich-international-vermarkten-variante-1_Q0AJ_topic_16x9_v1_thumb.webp?alt=media&token=4be56000-e3fe-4ee8-be7d-7f13e9085153","thumbnail_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Farticles%2FQ0AJ%2Fki-audiovisuelle-inhalte-erfolgreich-international-vermarkten-variante-1_Q0AJ_topic_16x9_v1_thumb.webp?alt=media&token=4be56000-e3fe-4ee8-be7d-7f13e9085153","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Farticles%2FQ0AJ%2Fki-audiovisuelle-inhalte-erfolgreich-international-vermarkten-variante-1_Q0AJ_topic_16x9_v1_thumb.webp?alt=media&token=4be56000-e3fe-4ee8-be7d-7f13e9085153","mediaAssetId":"media-asset-daf446e8-4c95-485d-b44b-6984a59eb6af","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Farticles%2FQ0AJ%2Fki-audiovisuelle-inhalte-erfolgreich-international-vermarkten-variante-1_Q0AJ_topic_16x9_v1_thumb.webp?alt=media&token=4be56000-e3fe-4ee8-be7d-7f13e9085153","eventIds":["event-leica-welt-2026"],"sortOrder":2,"updatedAt":"2026-08-18T07:10:58.372Z"}],"speakers":[{"id":"speakers-13a2a41d-82ad-49c6-ac91-c1873cd25ef2","lastName":"Sahm","visibility":"public","firstName":"Bert","topicId":"topics-f1bea931-71c0-4704-af18-6ab4565254d9","name":"Bert Sahm","status":"published","topicIds":["topics-f1bea931-71c0-4704-af18-6ab4565254d9","leica-2026-bert-sahm-ki-workflow"],"company":"M-COS Group","position":"Vertreter","website":"https://www.instagram.com/mcos.group/","longBio":"Bert Sahm ist seit mehr als 25 Jahren erfolgreich als Modedesigner, Trendberater und Marketingexperte tätig. Mit seinen Labels **BERT SAHM PARIS©** und **BERT SAHM Couture-à-porter** war er unter anderem bei renommierten internationalen Mode- und Kaufhäusern wie Saks Fifth Avenue, Bloomingdale’s, Harrods und Lillie Rubin vertreten.\n\nSeit den 1990er-Jahren arbeitet er eng mit führenden internationalen Handels- und Modeunternehmen zusammen. Zu seinen Partnern und Auftraggebern zählen unter anderem die **OTTO Group, C&A, Akzo Nobel und die Vendex Group**. Für verschiedene Unternehmen entwickelte er Kollektionen, Lizenzmarken, Trendkonzepte und Marketingstrategien. Zudem war er Designer, Trendberater und Markenbotschafter für **MADELEINE** und arbeitete für den Quelle-Katalog „Image“ parallel mit Karl Lagerfeld.\n\nSeine heutigen Schwerpunkte liegen in den Bereichen **Design, internationale Trendforschung, Marketing, Kommunikation sowie digitale und virtuelle 3D-Lifestylewelten**.\n\nBert Sahm ist Gründer, Mitgesellschafter und Geschäftsführer der 2005 gegründeten Hamburger **ICOS – international concepts of style GmbH**. Seit 2014 ist er zudem Initiator des Medienprojekts **NY-PAMILO TV** und entwickelte ab 2020 mit **NY-PAMILO Virtual Catwalks** innovative, fotorealistische 3D-Formate für virtuelle Fashion Shows.\n","vita":"Bert Sahm ist seit mehr als 25 Jahren erfolgreich als Modedesigner, Trendberater und Marketingexperte tätig. Mit seinen Labels **BERT SAHM PARIS©** und **BERT SAHM Couture-à-porter** war er unter anderem bei renommierten internationalen Mode- und Kaufhäusern wie Saks Fifth Avenue, Bloomingdale’s, Harrods und Lillie Rubin vertreten.\n\nSeit den 1990er-Jahren arbeitet er eng mit führenden internationalen Handels- und Modeunternehmen zusammen. Zu seinen Partnern und Auftraggebern zählen unter anderem die **OTTO Group, C&A, Akzo Nobel und die Vendex Group**. Für verschiedene Unternehmen entwickelte er Kollektionen, Lizenzmarken, Trendkonzepte und Marketingstrategien. Zudem war er Designer, Trendberater und Markenbotschafter für **MADELEINE** und arbeitete für den Quelle-Katalog „Image“ parallel mit Karl Lagerfeld.\n\nSeine heutigen Schwerpunkte liegen in den Bereichen **Design, internationale Trendforschung, Marketing, Kommunikation sowie digitale und virtuelle 3D-Lifestylewelten**.\n\nBert Sahm ist Gründer, Mitgesellschafter und Geschäftsführer der 2005 gegründeten Hamburger **ICOS – international concepts of style GmbH**. Seit 2014 ist er zudem Initiator des Medienprojekts **NY-PAMILO TV** und entwickelte ab 2020 mit **NY-PAMILO Virtual Catwalks** innovative, fotorealistische 3D-Formate für virtuelle Fashion Shows.\n","shortBio":"Bert Sahm ist seit mehr als 25 Jahren als Modedesigner, Trendberater und Marketingexperte tätig. Mit seinen Labels war er bei internationalen Modehäusern wie Saks Fifth Avenue, Bloomingdale’s und Harrods vertreten und arbeitete mit Unternehmen wie der OTTO Group, C&A und MADELEINE zusammen.\n\nHeute verbindet er Design, Trendforschung, Marketing und digitale 3D-Welten. Er ist Gründer und Geschäftsführer der Hamburger ICOS – international concepts of style GmbH sowie Initiator von NY-PAMILO TV und NY-PAMILO Virtual Catwalks.","companyLogoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/speakers%2Fspeakers-13a2a41d-82ad-49c6-ac91-c1873cd25ef2-company-logo%2F1787035952813-6c861140-0db7-4a15-a211-5681a6980ce0.jpg?alt=media&token=bc764253-66a2-449c-a34b-fed28e587819","photoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/speakers%2Fspeakers-13a2a41d-82ad-49c6-ac91-c1873cd25ef2%2F1787035968563-a444d9e6-c6cd-4fdc-8519-b99627314351.jpg?alt=media&token=cffd743d-9f74-4a3a-aa7b-5f05b2877c1d","eventIds":["event-leica-welt-2026"],"updatedAt":"2026-09-23T08:00:16.041Z"},{"id":"speakers-christof-baron","lastName":"Baron","visibility":"public","firstName":"Christof","topicId":"leica-2026-christof-baron-lokale-publisher","name":"Christof Baron","topicIds":["leica-2026-christof-baron-lokale-publisher"],"company":"Nayoki Mediaplus GmbH & Co. KG","status":"published","position":"Geschäftsführer","eventIds":["event-leica-welt-2026"],"website":"https://nayokimediaplus.com/","longBio":"Baron ist seit mehr als 35 Jahren im internationalen Media-Business tätig. Bei Mindshare bekleidete er führende Positionen bis hin zum CEO Germany und Joint-CEO EMEA, bevor er 2017 als Global Media Head zu Sanofi wechselte.\n\nSeit 2019 berät er mit seiner eigenen Consulting-Firma Media For Excellence Unternehmen in den Bereichen Mediastrategie und Aktivierung. Heute bringt er seine Erfahrung bei Nayoki Mediaplus ein und verbindet Markenstrategie konsequent mit Performance-Marketing.","vita":"Baron ist seit mehr als 35 Jahren im internationalen Media-Business tätig. Bei Mindshare bekleidete er führende Positionen bis hin zum CEO Germany und Joint-CEO EMEA, bevor er 2017 als Global Media Head zu Sanofi wechselte.\n\nSeit 2019 berät er mit seiner eigenen Consulting-Firma Media For Excellence Unternehmen in den Bereichen Mediastrategie und Aktivierung. Heute bringt er seine Erfahrung bei Nayoki Mediaplus ein und verbindet Markenstrategie konsequent mit Performance-Marketing.","shortBio":"Christof Baron ist seit mehr als 35 Jahren im internationalen Media-Business tätig. Bei Mindshare bekleidete er führende Positionen bis hin zum CEO Germany und Joint-CEO EMEA, bevor er 2017 als Global Media Head zu Sanofi wechselte.\n\nSeit 2019 berät er mit Media For Excellence Unternehmen in Mediastrategie und Aktivierung. Heute bringt er seine Erfahrung bei Nayoki Mediaplus ein und verbindet Markenstrategie mit Performance-Marketing.","thumbnailMediaAssetId":"media-asset-121c3d20-0f6b-4e85-80c2-a1a49e054ce1","thumbnail_media_asset_id":"media-asset-121c3d20-0f6b-4e85-80c2-a1a49e054ce1","photoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/speakers%2Fspeakers-christof-baron%2F1787136989478-680ddc10-9797-4d6f-b33c-7b30764ee67d.webp?alt=media&token=7958c032-3281-4aa6-932b-a00c6ab79b97","mediaAssetId":"media-asset-121c3d20-0f6b-4e85-80c2-a1a49e054ce1","companyLogoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/speakers%2Fspeakers-christof-baron-company-logo%2F1787137245833-30cd79c3-0eca-4ec8-af23-feb21471706f.webp?alt=media&token=74943242-104a-488d-b257-21f949cbfda2","updatedAt":"2026-09-23T08:00:16.041Z"},{"id":"speakers-dirk-engel","lastName":"Engel","visibility":"public","firstName":"Dirk","topicId":"leica-2026-dirk-engel-posthumanes-marketing","name":"Dirk Engel","topicIds":["leica-2026-dirk-engel-posthumanes-marketing"],"position":"Markt- und Mediaforscher","status":"published","eventIds":["event-leica-welt-2026"],"website":"https://kunden-wissen.de/ueber-dirk-engel/","longBio":"Geboren 1969 in Gießen, lebt Dirk Engel Frankfurt am Main und ist freiberuflicher Dozent, Fachautor, Markt- und Mediaforscher. Entsprechend seines Credos „Wissen, was Kunden wollen“  bietet er Seminare, Vorträge, Beratung und Marktforschung an. Seine Arbeit und sein Leistungsportfolio finden Sie auf der Website kundenwissen.com\n\nBei vielen deutschen und internationalen Branchen-Veranstaltungen und Kongressen trat Dirk Engel als Referent oder Keynote-Speaker auf. Eine Liste seiner Vorträge finden Sie hier…\n\nVon 1996 bis 2011 arbeitete er als Mediaforscher und Marktforscher bei der internationalen Media-Agentur Universal McCann. Dort betreute er Werbungtreibende bei Zielgruppenanalysen, Mediaforschung und Werbewirkungsforschung (u.a. Microsoft, Media Markt, BASF, Beck’s, MasterCard). Dabei kennt er sich mit allen Arten der Markt- und Sozialforschung aus – Desktop Research und Primärstudien, qualitative und quantitative Methoden, große Projekte und schnelle Ad-hoc-Studien, nationale und internationale Studien. Er betreute von 2001 bis 2002 internationale Studien bei UM Worldgroup in London und betreibt seit 1998 Online-Research.\n\nSeine berufliche Laufbahn begann als Lokaljournalist beim Wiesbadner Kurier. Dirk Engel studierte Kommunikationswissenschaft, Psychologie und Soziologie an der Johannes Gutenberg-Universität Mainz. Außerdem absolvierte er ein Nachdiplomstudiengang Betriebswirtschaft und Marketing (Universität Basel).\n\nDaneben ist und war er Dozent und Lehrbeauftragter an verschiedenen Hochschulen und Weiterbildungs-Instituten. Er unterrichtete zwei Jahrzehnte an der Akademie für Marketing-Kommunikation in Frankfurt am Main und mehrere Jahre am Institut für Publizistik der Johannes Gutenberg-Universität Mainz. Derzeit ist er Lehrbeauftragter für Medienwissenschaft und Kommunikationswissenschaft an der Media University of Applied Sciences in Frankfurt.\n\nEr ist Mitglied der Deutschen Gesellschaft für Publizistik und Kommunikationswissenschaft (DGPuK), der Werbewissenschaftlichen Gesellschaft (DWG) und der internationalen Marktforschungs-Organisation ESOMAR. Weitere Mitgliedschaften: Berufsverband der Markt- und Sozialforscher (BVM), Deutsche Gesellschaft für Online-Forschung (DGOF), Nürnberg Institut für Marktentscheidungen (NIM). Als Jury-Mitglied entscheidet er mit beim Real Impact Award (vergeben von der Fachzeitschrift HORIZONT) und dem Deutschen Prospekt Award (vergeben vom BVDA).\n\nDirk Engel ist Co-Autor (neben Holger Fischer) des Buches „Hybrides Arbeiten und Lernen in virtuellen Welten„. Zusammen mit Michael Hofsäss schrieb er das „Praxishandbuch Mediaplanung“. Außerdem verfasste er viele Buchbeiträge und veröffentlicht regelmäßig in verschiedenen Fachzeitschriften, allen voran dem führenden Magazin zum Thema Marktforschung, Planung & Analyse. Eine Liste seiner Veröffentlichungen findet sich hier…\n\nAußerdem ist Dirk Engel Mitglied im Frankfurter Debattier-Club „Vaevictis“ und Mitorganisator des Debatten-Duells in der Romanfabrik.","vita":"Geboren 1969 in Gießen, lebt Dirk Engel Frankfurt am Main und ist freiberuflicher Dozent, Fachautor, Markt- und Mediaforscher. Entsprechend seines Credos „Wissen, was Kunden wollen“  bietet er Seminare, Vorträge, Beratung und Marktforschung an. Seine Arbeit und sein Leistungsportfolio finden Sie auf der Website kundenwissen.com\n\nBei vielen deutschen und internationalen Branchen-Veranstaltungen und Kongressen trat Dirk Engel als Referent oder Keynote-Speake
