tionsbeispiele, wie sich klassische TV- und Sportproduktion verändert: Remote Production, softwarebasierte Regien, KI-gesteuerte Kameras und zunehmend automatisierte Produktionsabläufe. Im Mittelpunkt steht die Frage, wie künftig effizienter, flexibler und kostengünstiger produziert werden kann – und was diese Entwicklung für Technik, Arbeitsplätze und Produktionsmodelle bedeutet.","subtitle":"","status":"active","thumbnailMediaAssetId":"media-asset-34cffacb-84dd-4b66-b6b8-7888c9223613","thumbnail_media_asset_id":"media-asset-34cffacb-84dd-4b66-b6b8-7888c9223613","thumbnail_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-ca341066-3730-492b-ae9b-256f3acdc9ee%2F1789638503061-bf9862be-e04a-4d29-af93-289b33f035f9.webp?alt=media&token=713ea7c1-8e92-4e67-8e4f-aa4b80a5667b","mediaAssetId":"media-asset-34cffacb-84dd-4b66-b6b8-7888c9223613","article_media_asset_id":"media-asset-34cffacb-84dd-4b66-b6b8-7888c9223613","companyLogoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-ca341066-3730-492b-ae9b-256f3acdc9ee-company-logo%2F1789638525188-03971188-118a-4b1c-9d6b-61a063e872d4.webp?alt=media&token=fe091fac-3988-42ac-a9ff-53346672bbce","imageUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-ca341066-3730-492b-ae9b-256f3acdc9ee%2F1789638503061-bf9862be-e04a-4d29-af93-289b33f035f9.webp?alt=media&token=713ea7c1-8e92-4e67-8e4f-aa4b80a5667b","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-ca341066-3730-492b-ae9b-256f3acdc9ee%2F1789638503061-bf9862be-e04a-4d29-af93-289b33f035f9.webp?alt=media&token=713ea7c1-8e92-4e67-8e4f-aa4b80a5667b","articleMediaAssetId":"media-asset-34cffacb-84dd-4b66-b6b8-7888c9223613","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-ca341066-3730-492b-ae9b-256f3acdc9ee%2F1789638503061-bf9862be-e04a-4d29-af93-289b33f035f9.webp?alt=media&token=713ea7c1-8e92-4e67-8e4f-aa4b80a5667b","sortOrder":3,"longDescription":"Die TV-Produktion der Zukunft: Remote, softwarebasiert und KI-gestützt\n\nDie klassische TV- und Sportproduktion befindet sich in einem tiefgreifenden Wandel, der durch technologische Innovationen vorangetrieben wird. Das Digital Media Center (DMC) demonstriert anhand konkreter Beispiele, wie Remote Production, softwarebasierte Regien und KI-gesteuerte Kameras zunehmend Einzug in die Produktionsprozesse halten. Diese Entwicklungen ermöglichen eine effizientere, flexiblere und kostengünstigere Gestaltung von Abläufen, die bislang durch aufwendige Vor-Ort-Präsenz und manuelle Steuerung geprägt waren.\n\nRemote Production erlaubt es, Produktionen ortsunabhängig zu steuern, wodurch Ressourcen besser genutzt und logistische Herausforderungen minimiert werden können. Softwarebasierte Regien ersetzen traditionelle Hardware-Setups durch digitale Plattformen, die eine dynamische Anpassung und Automatisierung von Produktionsschritten erlauben. Künstliche Intelligenz unterstützt insbesondere bei der Kameraführung und Bildanalyse, indem sie Bewegungen und Szenen automatisch erkennt und entsprechend reagiert. Dies führt zu einer höheren Präzision und ermöglicht neue kreative Ansätze.\n\nFür die Medienbranche ergeben sich daraus weitreichende Konsequenzen: Technische Infrastruktur und Workflows müssen neu gedacht und angepasst werden, um die Potenziale dieser Technologien voll auszuschöpfen. Gleichzeitig verändern sich die Anforderungen an Fachkräfte, deren Aufgaben zunehmend von der Bedienung komplexer Software und der Überwachung automatisierter Systeme geprägt sind. Auch die Produktionsmodelle selbst wandeln sich, da flexiblere und skalierbare Lösungen gefragt sind, die sich schnell an wechselnde Bedingungen anpassen lassen.\n\nInsgesamt steht die Branche vor der Herausforderung, diese Transformation so zu gestalten, dass Effizienzgewinne und Kostensenkungen mit der Sicherung von Qualität und Arbeitsplätzen in Einklang gebracht werden. Die vorgestellten Beispiele des DMC bieten wertvolle Einblicke in die praktische Umsetzung und zeigen, wie die TV-Produktion der Zukunft aussehen kann.\n\nKeywords: Remote Production, Software, Künstliche Intelligenz, Automatisierung","bodyText":"Die TV-Produktion der Zukunft: Remote, softwarebasiert und KI-gestützt\n\nDie klassische TV- und Sportproduktion befindet sich in einem tiefgreifenden Wandel, der durch technologische Innovationen vorangetrieben wird. Das Digital Media Center (DMC) demonstriert anhand konkreter Beispiele, wie Remote Production, softwarebasierte Regien und KI-gesteuerte Kameras zunehmend Einzug in die Produktionsprozesse halten. Diese Entwicklungen ermöglichen eine effizientere, flexiblere und kostengünstigere Gestaltung von Abläufen, die bislang durch aufwendige Vor-Ort-Präsenz und manuelle Steuerung geprägt waren.\n\nRemote Production erlaubt es, Produktionen ortsunabhängig zu steuern, wodurch Ressourcen besser genutzt und logistische Herausforderungen minimiert werden können. Softwarebasierte Regien ersetzen traditionelle Hardware-Setups durch digitale Plattformen, die eine dynamische Anpassung und Automatisierung von Produktionsschritten erlauben. Künstliche Intelligenz unterstützt insbesondere bei der Kameraführung und Bildanalyse, indem sie Bewegungen und Szenen automatisch erkennt und entsprechend reagiert. Dies führt zu einer höheren Präzision und ermöglicht neue kreative Ansätze.\n\nFür die Medienbranche ergeben sich daraus weitreichende Konsequenzen: Technische Infrastruktur und Workflows müssen neu gedacht und angepasst werden, um die Potenziale dieser Technologien voll auszuschöpfen. Gleichzeitig verändern sich die Anforderungen an Fachkräfte, deren Aufgaben zunehmend von der Bedienung komplexer Software und der Überwachung automatisierter Systeme geprägt sind. Auch die Produktionsmodelle selbst wandeln sich, da flexiblere und skalierbare Lösungen gefragt sind, die sich schnell an wechselnde Bedingungen anpassen lassen.\n\nInsgesamt steht die Branche vor der Herausforderung, diese Transformation so zu gestalten, dass Effizienzgewinne und Kostensenkungen mit der Sicherung von Qualität und Arbeitsplätzen in Einklang gebracht werden. Die vorgestellten Beispiele des DMC bieten wertvolle Einblicke in die praktische Umsetzung und zeigen, wie die TV-Produktion der Zukunft aussehen kann.\n\nKeywords: Remote Production, Software, Künstliche Intelligenz, Automatisierung","articleText":"Die TV-Produktion der Zukunft: Remote, softwarebasiert und KI-gestützt\n\nDie klassische TV- und Sportproduktion befindet sich in einem tiefgreifenden Wandel, der durch technologische Innovationen vorangetrieben wird. Das Digital Media Center (DMC) demonstriert anhand konkreter Beispiele, wie Remote Production, softwarebasierte Regien und KI-gesteuerte Kameras zunehmend Einzug in die Produktionsprozesse halten. Diese Entwicklungen ermöglichen eine effizientere, flexiblere und kostengünstigere Gestaltung von Abläufen, die bislang durch aufwendige Vor-Ort-Präsenz und manuelle Steuerung geprägt waren.\n\nRemote Production erlaubt es, Produktionen ortsunabhängig zu steuern, wodurch Ressourcen besser genutzt und logistische Herausforderungen minimiert werden können. Softwarebasierte Regien ersetzen traditionelle Hardware-Setups durch digitale Plattformen, die eine dynamische Anpassung und Automatisierung von Produktionsschritten erlauben. Künstliche Intelligenz unterstützt insbesondere bei der Kameraführung und Bildanalyse, indem sie Bewegungen und Szenen automatisch erkennt und entsprechend reagiert. Dies führt zu einer höheren Präzision und ermöglicht neue kreative Ansätze.\n\nFür die Medienbranche ergeben sich daraus weitreichende Konsequenzen: Technische Infrastruktur und Workflows müssen neu gedacht und angepasst werden, um die Potenziale dieser Technologien voll auszuschöpfen. Gleichzeitig verändern sich die Anforderungen an Fachkräfte, deren Aufgaben zunehmend von der Bedienung komplexer Software und der Überwachung automatisierter Systeme geprägt sind. Auch die Produktionsmodelle selbst wandeln sich, da flexiblere und skalierbare Lösungen gefragt sind, die sich schnell an wechselnde Bedingungen anpassen lassen.\n\nInsgesamt steht die Branche vor der Herausforderung, diese Transformation so zu gestalten, dass Effizienzgewinne und Kostensenkungen mit der Sicherung von Qualität und Arbeitsplätzen in Einklang gebracht werden. Die vorgestellten Beispiele des DMC bieten wertvolle Einblicke in die praktische Umsetzung und zeigen, wie die TV-Produktion der Zukunft aussehen kann.\n\nKeywords: Remote Production, Software, Künstliche Intelligenz, Automatisierung","publishDate":"2026-10-23","validFrom":"2026-10-23","eventIds":["event-archive-63"],"updatedAt":"2026-09-23T16:43:14.716Z"},{"id":"topics-f0a8723e-d11b-4dc4-ace5-3cb37f1c62eb","publishDate":"2026-10-23","speakerId":"speakers-17eb66c1-444b-4e00-a9e9-2bd401f65523","validFrom":"2026-10-23","title":"Adressierbare Werbung ohne Third-Party-Cookies – der Utiq-Ansatz","companyLogoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-f0a8723e-d11b-4dc4-ace5-3cb37f1c62eb-company-logo%2F1790169509339-c3a0ab76-ce7c-4495-97c3-c4cab83287ee.webp?alt=media&token=a9a94117-73b2-42aa-a82f-29a285715312","visibility":"public","speakerIds":["speakers-17eb66c1-444b-4e00-a9e9-2bd401f65523"],"eventIds":["event-archive-63"],"subtitle":"","status":"active","thumbnailMediaAssetId":"media-asset-eeb8f6ec-a974-46b9-af27-332afd6823e5","thumbnail_media_asset_id":"media-asset-eeb8f6ec-a974-46b9-af27-332afd6823e5","article_media_asset_id":"media-asset-eeb8f6ec-a974-46b9-af27-332afd6823e5","imageUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-f0a8723e-d11b-4dc4-ace5-3cb37f1c62eb%2F1790169880723-d34e2288-43da-46ec-af8a-eeac3399d72c.webp?alt=media&token=a978e4a6-33c8-4e9e-9a4b-5c9cddf57ccb","thumbnail_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-f0a8723e-d11b-4dc4-ace5-3cb37f1c62eb%2F1790169880723-d34e2288-43da-46ec-af8a-eeac3399d72c.webp?alt=media&token=a978e4a6-33c8-4e9e-9a4b-5c9cddf57ccb","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-f0a8723e-d11b-4dc4-ace5-3cb37f1c62eb%2F1790169880723-d34e2288-43da-46ec-af8a-eeac3399d72c.webp?alt=media&token=a978e4a6-33c8-4e9e-9a4b-5c9cddf57ccb","mediaAssetId":"media-asset-eeb8f6ec-a974-46b9-af27-332afd6823e5","articleMediaAssetId":"media-asset-eeb8f6ec-a974-46b9-af27-332afd6823e5","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-f0a8723e-d11b-4dc4-ace5-3cb37f1c62eb%2F1790169880723-d34e2288-43da-46ec-af8a-eeac3399d72c.webp?alt=media&token=a978e4a6-33c8-4e9e-9a4b-5c9cddf57ccb","longDescription":"Utiq eröffnet mit einer telkobasierten Identitätslösung neue Möglichkeiten für adressierbare Werbung im europäischen Open Web. Im Mittelpunkt stehen Datenschutz, Einwilligung und pseudonyme Nutzererkennung sowie die Frage, wie Publisher und Werbetreibende auch ohne klassische Third-Party-Cookies relevante Zielgruppen erreichen und Kampagnen wirksam messen können.\n\nDer Utiq-Ansatz zeigt, welche Rolle Telekommunikationsanbieter künftig im digitalen Werbeökosystem übernehmen können und wie sich datenschutzkonforme Identitätslösungen mit den Anforderungen von Medienunternehmen, Publishern und Werbetreibenden verbinden lassen. Daraus ergeben sich neue Perspektiven für Reichweitenvermarktung, Zielgruppenansprache und Kampagnenmessung im europäischen digitalen Werbemarkt.","description":"Utiq eröffnet mit einer telkobasierten Identitätslösung neue Möglichkeiten für adressierbare Werbung im europäischen Open Web. Im Mittelpunkt stehen Datenschutz, Einwilligung und pseudonyme Nutzererkennung sowie die Frage, wie Publisher und Werbetreibende auch ohne klassische Third-Party-Cookies relevante Zielgruppen erreichen und Kampagnen wirksam messen können.\n\nDer Utiq-Ansatz zeigt, welche Rolle Telekommunikationsanbieter künftig im digitalen Werbeökosystem übernehmen können und wie sich datenschutzkonforme Identitätslösungen mit den Anforderungen von Medienunternehmen, Publishern und Werbetreibenden verbinden lassen. Daraus ergeben sich neue Perspektiven für Reichweitenvermarktung, Zielgruppenansprache und Kampagnenmessung im europäischen digitalen Werbemarkt.","shortDescription":"Utiq eröffnet mit einer telkobasierten Identitätslösung neue Möglichkeiten für adressierbare Werbung im europäischen Open Web. Im Mittelpunkt stehen Datenschutz, Einwilligung und pseudonyme Nutzererkennung sowie die Frage, wie Publisher und Werbetreibende auch ohne klassische Third-Party-Cookies relevante Zielgruppen erreichen und Kampagnen wirksam messen können.\n\nDer Utiq-Ansatz zeigt, welche Rolle Telekommunikationsanbieter künftig im digitalen Werbeökosystem übernehmen können und wie sich datenschutzkonforme Identitätslösungen mit den Anforderungen von Medienunternehmen, Publishern und Werbetreibenden verbinden lassen. Daraus ergeben sich neue Perspektiven für Reichweitenvermarktung, Zielgruppenansprache und Kampagnenmessung im europäischen digitalen Werbemarkt.","updatedAt":"2026-09-23T16:43:14.718Z"}],"speakers":[{"id":"speakers-17eb66c1-444b-4e00-a9e9-2bd401f65523","lastName":"Gloning","vita":"**Julia Gloning** ist Director Business Development DACH bei Utiq und verantwortet dort seit März 2026 den weiteren Ausbau der Geschäftsaktivitäten im deutschsprachigen Raum. Bereits seit 2023 ist sie für Utiq tätig und war zuvor als Head of Media Services für die Entwicklung und Betreuung von Medien- und Publisher-Partnerschaften zuständig.\n\nSie verfügt über langjährige Erfahrung in den Bereichen digitale Vermarktung, Programmatic Advertising, Publisher Services, CTV, Video, Display und Native Advertising. Vor ihrem Wechsel zu Utiq war Julia Gloning bei Yahoo tätig, zuletzt als Head of Yahoo Publisher Services Northern Europe. In dieser Funktion verantwortete sie das Programmatic Publisher Supply Management für Märkte wie Deutschland, Großbritannien und die nordischen Länder und arbeitete eng mit Premium-Publishern sowie Vermarktungspartnern zusammen.\n\nWeitere berufliche Stationen führten sie zu Verizon Media und Oath. Dort war sie unter anderem für den Aufbau und die Weiterentwicklung von Publisher- und Content-Partnerschaften sowie für die Monetarisierung digitaler Video-, Display- und Native-Angebote verantwortlich. Bereits bei Yahoo betreute sie zuvor als Senior Partner Manager die Gewinnung und technische Anbindung neuer Publisher und unterstützte deren digitale Vermarktungsstrategien.\n\nDurch ihre langjährige Tätigkeit an der Schnittstelle zwischen Medien, Technologie und digitaler Werbung verfügt Julia Gloning über umfassende Erfahrung im Aufbau nachhaltiger Publisher-Beziehungen, in der Entwicklung neuer Vermarktungsmodelle und in der Weiterentwicklung datenbasierter Werbelösungen.\n","company":"Utiq SA/NV","website":"https://utiq.com/","longBio":"**Julia Gloning** ist Director Business Development DACH bei Utiq und verantwortet dort seit März 2026 den weiteren Ausbau der Geschäftsaktivitäten im deutschsprachigen Raum. Bereits seit 2023 ist sie für Utiq tätig und war zuvor als Head of Media Services für die Entwicklung und Betreuung von Medien- und Publisher-Partnerschaften zuständig.\n\nSie verfügt über langjährige Erfahrung in den Bereichen digitale Vermarktung, Programmatic Advertising, Publisher Services, CTV, Video, Display und Native Advertising. Vor ihrem Wechsel zu Utiq war Julia Gloning bei Yahoo tätig, zuletzt als Head of Yahoo Publisher Services Northern Europe. In dieser Funktion verantwortete sie das Programmatic Publisher Supply Management für Märkte wie Deutschland, Großbritannien und die nordischen Länder und arbeitete eng mit Premium-Publishern sowie Vermarktungspartnern zusammen.\n\nWeitere berufliche Stationen führten sie zu Verizon Media und Oath. Dort war sie unter anderem für den Aufbau und die Weiterentwicklung von Publisher- und Content-Partnerschaften sowie für die Monetarisierung digitaler Video-, Display- und Native-Angebote verantwortlich. Bereits bei Yahoo betreute sie zuvor als Senior Partner Manager die Gewinnung und technische Anbindung neuer Publisher und unterstützte deren digitale Vermarktungsstrategien.\n\nDurch ihre langjährige Tätigkeit an der Schnittstelle zwischen Medien, Technologie und digitaler Werbung verfügt Julia Gloning über umfassende Erfahrung im Aufbau nachhaltiger Publisher-Beziehungen, in der Entwicklung neuer Vermarktungsmodelle und in der Weiterentwicklung datenbasierter Werbelösungen.\n","visibility":"public","eventIds":["event-archive-63"],"firstName":"Julia","topicId":"topics-f0a8723e-d11b-4dc4-ace5-3cb37f1c62eb","name":"Julia Gloning","shortBio":"**Julia Gloning** ist Director Business Development DACH bei Utiq und verantwortet dort seit März 2026 den Ausbau der Geschäftsaktivitäten im deutschsprachigen Markt. Zuvor war sie bei Utiq als Head of Media Services tätig.\n\nSie verfügt über langjährige Erfahrung in den Bereichen Programmatic Advertising, Publisher-Vermarktung, CTV, Video, Display und Native Advertising. Frühere Stationen führten sie unter anderem zu Yahoo, Verizon Media und Oath, wo sie verschiedene leitende Funktionen im Publisher- und Business-Development-Umfeld übernahm.\n","topicIds":["topics-f0a8723e-d11b-4dc4-ace5-3cb37f1c62eb"],"position":"Director Business Development DACH","status":"published","thumbnailMediaAssetId":"media-asset-9d4432d1-9398-454c-b29a-c6496d3a8eac","thumbnail_media_asset_id":"media-asset-9d4432d1-9398-454c-b29a-c6496d3a8eac","photoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/speakers%2Fspeakers-17eb66c1-444b-4e00-a9e9-2bd401f65523%2F1790169797817-19411 sität Hannover mit Schwerpunkt europäisches Kommunikationsrecht. Spezialisierung in Medien-, IT- und Glücksspielrecht.","company":"HEUKING","linkedIn":"https://de.linkedin.com/company/heuking-kuhn-luer-wojtek","position":"Rechtsanwalt / Partner","updatedAt":"2026-09-25T13:40:55.836Z"},{"id":"speakers-278f6d39-6322-4279-8a16-2f1b04109c22","lastName":"Gerhard","thumbnail_media_asset_id":"media-asset-a950582b-da68-492f-8eab-12956857edca","mediaAssetId":"media-asset-a950582b-da68-492f-8eab-12956857edca","photoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/speakers%2Fspeakers-278f6d39-6322-4279-8a16-2f1b04109c22%2F1789640457941-3556180d-a324-4239-8660-2f1a49883058.webp?alt=media&token=25add866-24de-4d1b-ab09-0510f82e5bcc","company":"Sport 1 GmbH","thumbnailMediaAssetId":"media-asset-a950582b-da68-492f-8eab-12956857edca","visibility":"public","firstName":"Andreas","name":"Andreas Gerhard","position":"Chief Content & Distribution Officer","status":"published","website":"https://www.sport1.de/","longBio":"Andreas Gerhardt ist seit 2016 bei SPORT1 tätig und seit Juni 2025 Chief Content & Distribution Officer. In dieser Funktion verantwortet er die Bereiche Content, Distribution, Produktion, Licensing sowie Regulatory und Public Affairs. Zuvor leitete er bei SPORT1 über mehrere Jahre die Distribution der TV- und digitalen Angebote.\n\nDer Rechtsanwalt verfügt über langjährige Erfahrung an der Schnittstelle von Medien, Sport, Recht und Distribution. Von 2023 bis 2025 war er zudem Geschäftsführer der Match IQ GmbH. Darüber hinaus ist er Lehrbeauftragter für Urheber- und Medienrecht an der Hochschule für angewandtes Management und engagiert sich in verschiedenen Branchen- und Fachgremien.","vita":"Andreas Gerhardt ist seit 2016 bei SPORT1 tätig und seit Juni 2025 Chief Content & Distribution Officer. In dieser Funktion verantwortet er die Bereiche Content, Distribution, Produktion, Licensing sowie Regulatory und Public Affairs. Zuvor leitete er bei SPORT1 über mehrere Jahre die Distribution der TV- und digitalen Angebote.\n\nDer Rechtsanwalt verfügt über langjährige Erfahrung an der Schnittstelle von Medien, Sport, Recht und Distribution. Von 2023 bis 2025 war er zudem Geschäftsführer der Match IQ GmbH. Darüber hinaus ist er Lehrbeauftragter für Urheber- und Medienrecht an der Hochschule für angewandtes Management und engagiert sich in verschiedenen Branchen- und Fachgremien.","shortBio":"Andreas Gerhardt ist seit 2016 bei SPORT1 tätig und seit Juni 2025 Chief Content & Distribution Officer. Er verantwortet unter anderem Content, Distribution, Produktion, Licensing sowie regulatorische und Public-Affairs-Themen. Zudem ist er Rechtsanwalt und Lehrbeauftragter für Urheber- und Medienrecht an der Hochschule für angewandtes Management.","linkedIn":"","topicId":"topics-527a7339-d174-4a41-9282-9f9190bac80d","topicIds":["topics-527a7339-d174-4a41-9282-9f9190bac80d"],"eventIds":["event-archive-63"],"updatedAt":"2026-09-28T08:03:02.613Z"},{"id":"speakers-497de429-fc6a-4969-89d1-af8a180be1c2","lastName":"Baumgartner","vita":"Hansjörg Baumgarzner verfügt über mehr als 30 Jahre Erfahrung in der Fernseh-, Broadcast- und Produktionsbranche. Seit Januar 2026 ist er bei DMC Production als Director Production Services and Customer Relations tätig.\n\nZuvor war er über 27 Jahre bei PLAZAMEDIA in verschiedenen leitenden Funktionen beschäftigt. Dort verantwortete er unter anderem die Bereiche Studioproduktion, Broadcast Operations, Project Management sowie Production Services und Customer Relations.\n\nSeine berufliche Laufbahn begann Anfang der 1990er-Jahre als Aufnahmeleiter bei Tele 5, PLAZAMEDIA und dem Deutschen SportFernsehen (DSF). Durch seine langjährige Tätigkeit verbindet er umfassende operative Produktionserfahrung mit Management-, Kunden- und Projektkompetenz im professionellen Broadcast- und Live-Produktionsumfeld.","company":"DMC Production Germany GmbH","website":"https://www.dmcproduction.com/","longBio":"Hansjörg Baumgarzner verfügt über mehr als 30 Jahre Erfahrung in der Fernseh-, Broadcast- und Produktionsbranche. Seit Januar 2026 ist er bei DMC Production als Director Production Services and Customer Relations tätig.\n\nZuvor war er über 27 Jahre bei PLAZAMEDIA in verschiedenen leitenden Funktionen beschäftigt. Dort verantwortete er unter anderem die Bereiche Studioproduktion, Broadcast Operations, Project Management sowie Production Services und Customer Relations.\n\nSeine berufliche Laufbahn begann Anfang der 1990er-Jahre als Aufnahmeleiter bei Tele 5, PLAZAMEDIA und dem Deutschen SportFernsehen (DSF). Durch seine langjährige Tätigkeit verbindet er umfassende operative Produktionserfahrung mit Management-, Kunden- und Projektkompetenz im professionellen Broadcast- und Live-Produktionsumfeld.","visibility":"public","eventIds":["event-archive-63"],"firstName":"Hansjörg","name":"Hansjörg Baumgartner","shortBio":"Hansjörg Baumgarzner verfügt über mehr als 30 Jahre Erfahrung in der TV-, Broadcast- und Produktionsbranche. Seit Januar 2026 ist er Director Production Services and Customer Relations bei DMC Production. Zuvor war er über 27 Jahre bei PLAZAMEDIA in leitenden Funktionen tätig.","position":"","status":"published","thumbnailMediaAssetId":"media-asset-a513902b-22c6-4653-88fc-821eccb6aba1","thumbnail_media_asset_id":"media-asset-a513902b-22c6-4653-88fc-821eccb6aba1","photoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/speakers%2Fspeakers-497de429-fc6a-4969-89d1-af8a180be1c2%2F1789638480597-1dfa27d8-9e8a-4113-9fee-261630d56bd0.webp?alt=media&token=0e1d6f7e-e311-4262-95e3-60b5fa9c69b5","mediaAssetId":"media-asset-a513902b-22c6-4653-88fc-821eccb6aba1","topicId":"","topicIds":[],"linkedIn":"","updatedAt":"2026-09-22T12:23:24.703Z"},{"id":"speakers-914d40aa-6b45-49b6-bd89-fd128cd9633b","lastName":"Grill","thumbnail_media_asset_id":"media-asset-dadf5b31-35b0-4d1f-989c-55ea5067eaed","mediaAssetId":"media-asset-dadf5b31-35b0-4d1f-989c-55ea5067eaed","photoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/speakers%2Fspeakers-914d40aa-6b45-49b6-bd89-fd128cd9633b%2F1789986385426-1aa68077-03bf-47d5-a433-d3666e7bb0da.webp?alt=media&token=9ad141fc-1ef7-4d57-830e-88622e764955","vita":"**Norbert Grill** ist ein erfahrener Medien- und Technologiemanager mit langjähriger Expertise in den Bereichen Broadcast, digitale Medien, OTT und technische Transformation.\n\nSeit September 2025 ist er **Chief Technology Officer der Big Blue Marble Group** in Wien. Darüber hinaus ist er **Geschäftsführer der ORS Group (Austrian Broadcasting Services) in Wien**, die er seit 2008 maßgeblich mitprägt. In dieser Funktion verantwortet er unter anderem strategische Technologieentwicklung, Broadcast-Infrastrukturen, digitale Medienlösungen und neue Distributionswege.\n\nSeine berufliche Laufbahn im Medienbereich begann beim **ORF**, wo er von 1999 bis 2004 als Projektmanager unter anderem am Aufbau des DVB-Satellitensystems mit Encoding, Multiplexing und Conditional-Access-Systemen beteiligt war. Zuvor arbeitete er als Projektmanager und Teamleiter für Elektrotechnik bei Andritz.\n\nNorbert Grill studierte **Automatisierungstechnik an der Technischen Universität Wien**. Seine fachlichen Schwerpunkte liegen insbesondere an der Schnittstelle von klassischem Broadcast, OTT, digitalen Plattformen, Innovation und strategischem Technologiemanagement.\n","thumbnailMediaAssetId":"media-asset-dadf5b31-35b0-4d1f-989c-55ea5067eaed","website":"https://www.bigbluemarble.com/","visibility":"public","eventIds":["event-archive-63"],"firstName":"Norbert","name":"Norbert Grill","position":"Geschäftsführer","topicId":"topics-0b780394-21e0-4d72-9f3e-b3e7b50ab3dc","topicIds":["topics-0b780394-21e0-4d72-9f3e-b3e7b50ab3dc"],"status":"published","longBio":"**Norbert Grill** ist ein erfahrener Medien- und Technologiemanager mit langjähriger Expertise in den Bereichen Broadcast, digitale Medien, OTT und technische Transformation.\n\nSeit September 2025 ist er **Chief Technology Officer der Big Blue Marble Group** in Wien. Darüber hinaus ist er **Geschäftsführer der ORS Group (Austrian Broadcasting Services) in Wien**, die er seit 2008 maßgeblich mitprägt. In dieser Funktion verantwortet er unter anderem strategische Technologieentwicklung, Broadcast-Infrastrukturen, digitale Medienlösungen und neue Distributionswege.\n\nSeine berufliche Laufbahn im Medienbereich begann beim **ORF**, wo er von 1999 bis 2004 als Projektmanager unter anderem am Aufbau des DVB-Satellitensystems mit Encoding, Multiplexing und Conditional-Access-Systemen beteiligt war. Zuvor arbeitete er als Projektmanager und Teamleiter für Elektrotechnik bei Andritz.\n\nNorbert Grill studierte **Automatisierungstechnik an der Technischen Universität Wien**. Seine fachlichen Schwerpunkte liegen insbesondere an der Schnittstelle von klassischem Broadcast, OTT, digitalen Plattformen, Innovation und strategischem Technologiemanagement.","shortBio":"**Norbert Grill** ist ein erfahrener Medien- und Technologiemanager mit Schwerpunkten in Broadcast, digitalen Medien und OTT.\n\nSeit September 2025 ist er **Chief Technology Officer der Big Blue Marble Group** in Wien. Zudem ist er **Geschäftsführer der ORS Group (Austrian Broadcasting Services)**, die er seit 2008 maßgeblich mitgestaltet.\n\nZuvor war er beim **ORF** als Projektmanager unter anderem am Aufbau des DVB-Satellitensystems beteiligt. Norbert Grill studierte **Automatisierungstechnik an der Technischen Universität Wien**.","company":"Big Blue Marble","linkedIn":"","updatedAt":"2026-09-23T13:40:20.011Z"},{"id":"speakers-b2f60ad4-4306-4e06-9ca8-98771d77435b","lastName":"Grundmann","vita":"Dr. Melanie Grundmann ist Teamlead Product Strategy & Partnerships bei FUNKE in Berlin. Sie verfügt über langjährige Erfahrung an der Schnittstelle von Medien, Technologie, Content und digitalen Plattformen. Seit 2022 ist sie bei FUNKE tätig und verantwortete zunächst als Senior Content Managerin den Aufbau und die Weiterentwicklung der FUNKE Channels. Anschließend betreute sie als Senior Partnership Managerin insbesondere die Distribution und Weiterentwicklung von FAST-Channels auf Plattformen wie Samsung TV Plus, Rakuten TV und LG Channels. Seit März 2026 leitet sie den Bereich Product Strategy & Partnerships und verbindet strategische Produktentwicklung, Plattformpartnerschaften und technologische Anforderungen mit dem Ziel, digitale Medienangebote erfolgreich weiterzuentwickeln.","website":"https://funkechannels.de/","visibility":"public","eventIds":["event-archive-63"],"firstName":"Dr. Melanie","name":"Dr. Melanie Grundmann","status":"published","thumbnailMediaAssetId":"media-asset-37e0d542-745c-4be2-91b7-7dcbfd04bc4a","thumbnail_media_asset_id":"media-asset-37e0d542-745c-4be2-91b7-7dcbfd04bc4a","photoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/speakers%2Fspeakers-b2f60ad4-4306-4e06-9ca8-98771d77435b%2F1788973421995-02a14c13-81aa-4afc-bf02-936187bc8bff.webp?alt=media&token=c7a62451-88cb-4585-8d20-6525a7b21b67","mediaAssetId":"media-asset-37e0d542-745c-4be2-91b7-7dcbfd04bc4a","topicId":"","topicIds":[],"longBio":"Dr. Melanie Grundmann ist Teamlead Distribution Partnerships bei FUNKE Digital in Berlin. Sie verfügt über langjährige Erfahrung an der Schnittstelle von Medien, Technologie, Content und digitalen Plattformen. Seit 2022 ist sie bei FUNKE Digital tätig und verantwortete zunächst als Senior Content Managerin die Weiterentwicklung der FUNKE Channels. Anschließend betreute sie als Senior Partnership Managerin insbesondere die Distribution und Weiterentwicklung von FAST-Channels auf Plattformen wie Samsung TV Plus, Rakuten TV und LG Channels. Seit März 2026 leitet sie als Teamlead den Bereich Distribution Partnerships und verbindet strategische Produktentwicklung, Plattformpartnerschaften und technologische Anforderungen mit dem Ziel, digitale Medienangebote erfolg ter Berufshaftung von Rechtsanwälten und Steuerberatern begleitet Unternehmen in zentralen wirtschaftsrechtlichen Fragestellungen und bringt umfassende Erfahrung aus der Medien-, Digital- und Technologiewirtschaft ein.\n\nAls Co-Gastgeber bietet HEUKING den passenden Rahmen für fachliche Impulse, persönliche Gespräche und den Austausch innerhalb des PROdigitalTV-Netzwerks.","status":"published","logoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fuploads%2FDY3I%2Fprodigitaltv-bild_DY3I_upload_16x9_v1_thumb.webp?alt=media&token=7fc1c415-639e-4541-a797-116b2419706f","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fuploads%2FDY3I%2Fprodigitaltv-bild_DY3I_upload_16x9_v1_thumb.webp?alt=media&token=7fc1c415-639e-4541-a797-116b2419706f","name":"Heuking Kühn Lüer Wojtek ","updatedAt":"2026-07-23T10:14:17.545Z"}],"galleries":[],"mediaAssets":[{"id":"media-asset-a9259db9-5590-4715-88a1-1cc2eec8e797","file_path_original_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fuploads%2FDY3I%2Fprodigitaltv-bild_DY3I_upload_16x9_v1.webp?alt=media&token=6d454c85-12f6-49e2-ac5a-16aa2fd8e4fd","image_height":366,"slug":"prodigitaltv-bild-16x9-somd","source_type":"edited","image_width":700,"status":"active","created_at":"2026-07-10T08:15:03.152Z","title":"PROdigitalTV Bild Variante","file_path_web_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fuploads%2FDY3I%2Fprodigitaltv-bild_DY3I_upload_16x9_v1.webp?alt=media&token=6d454c85-12f6-49e2-ac5a-16aa2fd8e4fd","file_path_thumb_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fuploads%2FDY3I%2Fprodigitaltv-bild_DY3I_upload_16x9_v1.webp?alt=media&token=6d454c85-12f6-49e2-ac5a-16aa2fd8e4fd","target_field":"imageUrl","linked_collection":"events","target_id":"event-archive-63","linked_field":"imageUrl","linked_record_id":"event-archive-63","target_collection":"events","updated_at":"2026-07-10T08:17:26.686Z","media_type":"event","usage_preset":"event","updatedAt":"2026-07-10T08:17:26.686Z"}]},"event-archive-75":{"event":{"id":"event-archive-75","date":"2025-02-18","registrationEnabled":false,"city":"Berlin","lifecyclePhase":"archive_published","showPublicTeaser":true,"title":"Medienfrühstück in Berlin: Die Agenda","accessType":"public","allowMemberRegistration":false,"allowPublicRegistration":false,"address":"","visibility":"public","speakerIds":[],"hostId":"heussen","sponsorIds":[],"displayDate":"18.02.2025","subtitle":"Mitteilung aus dem Veranstaltungsarchiv","topicIds":[],"status":"published","startTime":"09:30","endTime":"15:00","locationName":"Kurfürstendamm 31 Berlin 10719","postEventSummary":"PROdigitalTV Medienfrühstück am 18. Februar 2025 in Berlin, KANZLEI HEUSSEN: Die Agenda\n\nDie Location\n\nKurfürstendamm 31 Berlin 10719\n\nUnser Sponsor:\n\nVeranstaltungstag: 18.02.2025, Berlin\n\nPROdigitalTV Medienfrühstück am 18. Februar 2025 in Berlin, KANZLEI HEUSSEN: Die Agenda\n\nPROdigitalTV lädt am Dienstag, den 18. Februar 2025, von 09:30 bis15:00 Uhr zum ersten Medienfrühstück des neuen Jahres nach Berlin ein.\n\nWir freuen uns sehr, dass auch in diesem Jahr die Kanzlei HEUSSEN Rechtsanwaltsgesellschaft mbH unser Sponsor und Gastgeber ist!\n\nDie Veranstaltung beschäftigt sich mit aktuellen Fragen rund um die Medien- und Filmwirtschaft sowie um Aspekte der Medienpolitik und der technologischen Entwicklung.\n\nAGENDA\n\nLocation:\n\nHEUSSEN Rechtsanwaltsgesellschaft mbH\n\nKurfürstendamm 31 (Eingang Uhlandstraße)\n\n10719 Berlin\n\n09:30 Uhr Einlass, Kaffee & Networking\n\n10:25 Uhr Begrüßung:\n\nDr. Frank Grischa Feitsch, KANZLEI HEUSSEN\n\nBeate Busch, Vorstandsvorositzende, PROdigitalTV\n\nModerator der Veranstaltung:\n\nMichael Weber, Head Sales Marketing Communication, ORS\n\n10:30 Uhr\n\nJulia Maier-Hauff, Geschäftsführerin und Syndikusrechtsanwältin des Produzent*Innenverbandes:\n\n\"Filmförderung: Neue Wege, neue Chancen\"\n\nIm Dezember 2024 wurde das neue Filmförderungsgesetz (FFG) verabschiedet, der Deutsche Filmförderfonds (DFFF) auf 30 % erhöht und eine vorläufige Haushaltsführung für 2025 beschlossen. Doch viele zentrale Fragen sind noch offen: Die finalen Richtlinien der BKM zur kulturellen Filmförderung und die Besetzung der Jurys stehen aus. Julia Maier-Hauff appelliert an die künftige Regierung, die Vielfalt der Filmbranche zu stärken und ein international konkurrenzfähiges Fördersystem zu schaffen - mit einer gut ausgestatteten Talent- und BKM-Filmförderung, einer Investitionsverpflichtung mit Rechterückbehalt und einem modernen Steueranreizsystem.\n\n11:00 Uhr\n\nNorbert Grill, Geschäftsführer ORS-Österreichische Rundfunksender GmbH & Co KG, und\n\nMichael Wagenhofer, CEO ORS comm: „Broadcast-grade Streaming-Services“\n\nIn der dynamischen Welt der Medien wird die Auslieferung von Inhalten immer zentraler. Um den wachsenden Anforderungen gerecht zu werden und eine Vielzahl von gleichzeitigen Nutzern zu bedienen, müssen die Plattformen der Medienunternehmen nicht nur skalierbar, sondern auch äußerst leistungsfähig sein. Dieser Vortrag bietet eine tiefgehende Analyse und präsentiert innovative Ansätze, wie diese Herausforderungen erfolgreich gemeistert werden können. Lassen Sie sich inspirieren und entdecken Sie, wie zukunftsweisende Technologien und Strategien die Medienlandschaft revolutionieren können.\n\n11:30 Uhr\n\nRobert Weber, Geschäftsführer 80s80s Radio: \"Hörer = Wähler? Zielgruppensegmentierung im Radio als Impuls für die Politik\"\n\nRadiosender nutzen zunehmend psychometrische Daten und Methoden des maschinellen Lernens, um ihr Publikum detailliert zu profilieren. Diese Techniken ermöglichen eine gezielte Ansprache und tiefere Einblicke in die Interessen und Bedürfnisse der Hörer. Kurz vor der Bundestagswahl stellt sich die spannende Frage: Könnten diese Ansätze auch der Politik helfen, Zielgruppen (wieder) besser zu erreichen? Robert Weber bringt umfassende Erfahrung aus der Hörfunkbranche sowie aus den Bereichen Datenanalyse und KI-Implementierung mit. Als Geschäftsführer von 80s80s Radio und Beauftragter der REGIOCAST für Datenarchitektur und Governance verbindet er praxisnahe Einblicke mit fundierter Expertise in der Wertschöpfung aus Daten.\n\n12:00 Uhr Kaffeepause\n\n12:20 Uhr\n\nRobert Faußner, M.A, Partner der HEUSSEN Rechtsanwaltsgesellschaft mbH:\n\n\"Privacy or Cash - Wo drohen der Medien- und Filmwirtschaft datenschutzrechtliche Schadenersatzklagen und was ist zu tun?\"\n\nDigitalisierung und Datenschutz sind mitunter zwei Seiten einer Medaille. Ob Schludrigkeit oder schlichtes Unwissen - in digitalen Geschäftsmodellen drohen auch klassischen Unternehmen der Medien- und Filmwirtschaft neben Geldbußen von Aufsichtsbehörden oder Abmahnungen von Mitbewerbern datenschutzrechtliche Schadenersatzklagen. Der Europäische Gerichtshof hat den datenschutzrechtlichen Schadenersatzanspruch durch mittlerweile zehn Urteile konkretisiert. Auch bei immateriellen Schäden droht ein Schadenersatz, wenn personenbezogene Daten z.B. auf Websites, im Marketing oder bei Filmaufnahmen datenschutzwidrig verarbeitet werden oder wenn, was zunimmt, personenbezogene Daten durch Hacking-Angriffe abhandenkommen. Rechtsanwalt Robert Faußner, M.A. stellt die wesentlichen Feststellungen der EuGH-Urteile vor und erläutert, wie man Schadenersatzklagen vermeiden bzw. sich gegen diese verteidigen kann.\n\n12:50 Uhr\n\nKerstin Zorn - Head of Sales International / Streaming / CTV & FAST bei FUNKE Digital GmbH:\n\n„Die Zukunft gestalten: Wie Content-Produzenten und Werbetreibende den FAST Markt erobern.\n\nWelche Voraussetzung gibt es für einen eigenen FAST Channel, und wie funktioniert dessen Monetarisierung? Und: Erfolgsstories - was funktioniert am FAST Markt?\n\n13:20 Uhr Lunch und Networking\n\n15:00 Uhr Ende der Veranstaltung\n\nÄnderungen vorbehalten\n\nDownloads\n\nKontakt\n\nDatenschutz\n\nImpressum\n\nCookie Einstellungen\n\nLog-In\n\nProDigitalTV e.V. 2026","description":"PROdigitalTV Medienfrühstück am 18. Februar 2025 in Berlin, KANZLEI HEUSSEN: Die Agenda Die Location Kurfürstendamm 31 Berlin 10719 Unser Sponsor: Veranstaltungstag: 18.02.2025, Berlin PROdigitalTV Medienfrühstück am 18. Februar 2025 in Berlin, KANZLEI HEUSSEN: Die Agenda PROdigitalTV lädt am Dienstag, den 18. Februar 2025, von 09:30 bis15:00 Uhr zum ersten Medienfrühstück des neuen Jahres nach Berlin ein. Wir freuen uns sehr, dass auch in diesem Jahr die Kanzlei HEUSSEN Rechtsanwaltsgesellschaf","validFrom":"2025-02-18","longDescription":"PROdigitalTV Medienfrühstück am 18. Februar 2025 in Berlin – Rückblick\n\nAm 18. Februar 2025 lud PROdigitalTV zum ersten Medienfrühstück des Jahres in die Kanzlei HEUSSEN am Kurfürstendamm 31 in Berlin ein. Gastgeber und Sponsor der Veranstaltung war erneut die HEUSSEN Rechtsanwaltsgesellschaft mbH.\n\nDas Event bot eine Plattform für den Austausch zu aktuellen Themen der Medien- und Filmwirtschaft, der Medienpolitik sowie technologischen Entwicklungen. Die rund 09:30 Uhr beginnende Veranstaltung startete mit einem Networking-Kaffee, gefolgt von einer Begrüßung durch Dr. Frank Grischa Feitsch (KANZLEI HEUSSEN) und Beate Busch, Vorstandsvorsitzende von PROdigitalTV. Moderiert wurde die Veranstaltung von Michael Weber, Head Sales Marketing Communication bei ORS.\n\nIm Mittelpunkt standen Fachvorträge zu relevanten Branchenthemen:\n\n- Julia Maier-Hauff (Produzent*Innenverband) erläuterte die Neuerungen im Filmförderungsgesetz (FFG) und die Herausforderungen bei der Umsetzung der kulturellen Filmförderung. Sie betonte die Bedeutung eines international wettbewerbsfähigen Fördersystems mit Fokus auf Talentförderung und Steueranreize.\n\n- Norbert Grill und Michael Wagenhofer (ORS) präsentierten innovative Ansätze für skalierbare und leistungsfähige Broadcast-grade Streaming-Services, die den steigenden Anforderungen der Medienauslieferung gerecht werden.\n\n- Robert Weber (80s80s Radio) diskutierte die Nutzung psychometrischer Daten und maschinellen Lernens zur Zielgruppensegmentierung im Radio und deren Potenzial für die politische Ansprache vor der Bundestagswahl.\n\n- Robert Faußner (HEUSSEN) informierte über datenschutzrechtliche Risiken und Schadenersatzklagen in der Medien- und Filmwirtschaft. Er erläuterte die aktuelle Rechtsprechung des Europäischen Gerichtshofs und gab Handlungsempfehlungen zur Vermeidung und Abwehr solcher Klagen.\n\n- Kerstin Zorn (FUNKE Digital GmbH) gab Einblicke in den FAST-Markt (Free Ad-supported Streaming TV), erläuterte Voraussetzungen für eigene FAST-Channels und deren Monetarisierung sowie Erfolgsfaktoren.\n\nDas Medienfrühstück endete nach einem gemeinsamen Lunch und weiterem Networking um 15:00 Uhr. Die Veranstaltung bot den Teilnehmenden wertvolle Impulse und aktuelle Einblicke in die dynamischen Entwicklungen der digitalen Medienbranche.\n\nHinweis: Für weiterführende Informationen zu einzelnen Vorträgen und Materialien wenden Sie sich bitte an PROdigitalTV.","archiveText":"PROdigitalTV Medienfrühstück am 18. Februar 2025 in Berlin – Rückblick\n\nAm 18. Februar 2025 lud PROdigitalTV zum ersten Medienfrühstück des Jahres in die Kanzlei HEUSSEN am Kurfürstendamm 31 in Berlin ein. Gastgeber und Sponsor der Veranstaltung war erneut die HEUSSEN Rechtsanwaltsgesellschaft mbH.\n\nDas Event bot eine Plattform für den Austausch zu aktuellen Themen der Medien- und Filmwirtschaft, der Medienpolitik sowie technologischen Entwicklungen. Die rund 09:30 Uhr beginnende Veranstaltung startete mit einem Networking-Kaffee, gefolgt von einer Begrüßung durch Dr. Frank Grischa Feitsch (KANZLEI HEUSSEN) und Beate Busch, Vorstandsvorsitzende von PROdigitalTV. Moderiert wurde die Veranstaltung von Michael Weber, Head Sales Marketing Communication bei ORS.\n\nIm Mittelpunkt standen Fachvorträge zu relevanten Branchenthemen:\n\n- Julia Maier-Hauff (Produzent*Innenve iträge und frische Impulse aus der Medien- und Digitalbranche. Unser Gastgeber sorgt auch für den kulinarischen Rahmen des Medienfrühstücks und lädt dabei zu einem stilvollen Frühstück sowie einem Mittagsimbiss ein. Hier haben Sie ausreichend Gelegenheit für brancheninternen Austausch und Ihrem persönlichem Networking.\n\nAGENDA\n\nLocation:\n\nKanzlei Heuking Kühn Lüer Wojtek\n\nDonnerstag, 15. Mai 2025\n\nVeranstaltungsort:\n\nKanzlei Heuking Kühn Lüer Wojtek\n\nPrinzregentenstraße 48\n\n81675 München\n\nwww.heuking.de\n\n09:30 Uhr Einlass & Frühstück\n\n10:00 Uhr Veranstaltungsbeginn\n\n13:30 Uhr Lunch & Networking\n\n15:00 Uhr Veranstaltungsende\n\nReferenten:\n\n- Dr. Albrecht Bischoffshausen, VFF Verwertungsgesellschaft der Film- und Fernsehproduzenten mbH: „Rechte für Plattformen und Produktionen“\n\n- Angelo Morano, Insiderchina, CEO and Founder\n\n- Rechtsanwalt Michael Schmittmann, Heuking Düsseldorf/München: „Neue Märkte - Altes Recht und unpassende Regulierung? Eine Übersicht über neue Rechtsentwicklungen“\n\n- Tilman Rautenstrauch, Director, OneGate Media GmbH - Digital Distribution: „Content Distribution everywhere: How to get on Many Platforms“\n\n- Jonas Petersen, media-press.tv: \"Erfolgreicher Einsatz von Metadaten\"\n\n- Chistopher Schmidt Dsmc Entertainment: Vorstellung von zwei Special Interest Formaten und deren Erfolg.\n\nModeration:\n\nBeate Busch und Thorsten Lork\n\nWeitere Aktualisierungen erhalten Sie regelmäßig per Mail und auf unserer Website.\n\nDownloads\n\nKontakt\n\nDatenschutz\n\nImpressum\n\nCookie Einstellungen\n\nLog-In\n\nProDigitalTV e.V. 2026","description":"Die Location Kanzlei Heuking Kühn Lüer Wojtek Prinzregentenstraße 48 München 81675 Unser Sponsor: Veranstaltungstag: 15.05.2025, München Save The Date: Einladung zum Medienfrühstück in München am 15. Mai 2025 MEDIENFRÜHSTÜCK IN MÜNCHEN PROdigitalTV lädt Sie am Donnerstag, den 15. Mai 2025 zum Medienfrühstück in München ein. Die Veranstaltung findet in den Räumlichkeiten der renommierten Rechtsanwaltskanzlei Heuking Kühn Lüer Wojtek statt, die auf Medienrecht spezialisiert ist. Unter dem Thema „H","validFrom":"2025-05-15","preStatus":"save_the_date","longDescription":"Am 15. Mai 2025 fand in den Räumlichkeiten der renommierten Kanzlei Heuking Kühn Lüer Wojtek in München das PROdigitalTV Medienfrühstück statt. Unter dem Motto „Hochwertiger Zielgruppencontent, neue Märkte, neue Chancen“ bot die Veranstaltung aktuelle Einblicke und Impulse aus der Medien- und Digitalbranche.\n\nDie Teilnehmer nutzten den Vormittag für einen intensiven fachlichen Austausch. Hochkarätige Referenten beleuchteten verschiedene Aspekte der Branche: Dr. Albrecht Bischoffshausen (VFF) sprach über Rechte für Plattformen und Produktionen, Rechtsanwalt Michael Schmittmann gab einen Überblick zu neuen Rechtsentwicklungen in Bezug auf alte Regulierung, und Tilman Rautenstrauch (OneGate Media GmbH) erläuterte Strategien zur digitalen Content-Distribution. Weitere Beiträge kamen von Angelo Morano (Insiderchina), Jonas Petersen (media-press.tv) zum erfolgreichen Einsatz von Metadaten sowie Christopher Schmidt (Dsmc Entertainment) mit der Vorstellung erfolgreicher Special Interest Formate.\n\nDie Veranstaltung wurde von Beate Busch und Thorsten Lork moderiert. Für das leibliche Wohl sorgte der Gastgeber mit einem stilvollen Frühstück sowie einem Mittagsimbiss, die zugleich Raum für Networking und brancheninternen Austausch boten.\n\nDas Medienfrühstück in München bestätigte einmal mehr seine Rolle als Plattform für den Dialog und die Vernetzung innerhalb der digitalen Medienwirtschaft.  \n\nFür weiterführende Informationen zu den Referenten und Themen wenden Sie sich bitte an PROdigitalTV.","archiveText":"Am 15. Mai 2025 fand in den Räumlichkeiten der renommierten Kanzlei Heuking Kühn Lüer Wojtek in München das PROdigitalTV Medienfrühstück statt. Unter dem Motto „Hochwertiger Zielgruppencontent, neue Märkte, neue Chancen“ bot die Veranstaltung aktuelle Einblicke und Imp HEUSSEN Rechtsanwaltsgesellschaft mbH","visibility":"public","hostId":"heussen","eventType":"Medienfrühstück","sponsorIds":[],"subtitle":"Wie hat KI die Medienwirtschaft veraendert?","endTime":"","status":"published","allowMemberRegistration":false,"allowPublicRegistration":false,"updated_at":"2026-06-12T09:40:55.797Z","preStatus":"save_the_date","longDescription":"Am 17. Februar 2026 veranstaltete PROdigitalTV im Rahmen der Berlinale sein traditionelles Medienfrühstück in Berlin. Gastgeber und Sponsor war die HEUSSEN Rechtsanwaltsgesellschaft mbH am Kurfürstendamm 31.\n\nIm Mittelpunkt standen aktuelle Entwicklungen der Medien- und Filmwirtschaft, der Einsatz Künstlicher Intelligenz, medienrechtliche Fragen, digitale Souveränität im Videostreaming sowie neue Geschäfts- und Erlösmodelle.\n\nDie Gäste wurden von Dr. Frank Grischa Feitsch für HEUSSEN und Klaus Juli für PROdigitalTV begrüßt. Durch das Programm führte Dirk Martens, Geschäftsführer von House of Research und Vorstandsmitglied von PROdigitalTV.\n\nGregor C. Blach, Gründer und Geschäftsführer von WE DO communication sowie Vorstand des Marketing Club Berlin e.V., sprach über menschliche Kompetenz und Künstliche Intelligenz in kreativen Prozessen. Er zeigte, wie KI bereits Konzepte, Texte und Bilder unterstützte oder erzeugte, und machte deutlich, weshalb menschliche Erfahrung, Intuition und kreative Verantwortung weiterhin eine zentrale Rolle spielten.\n\nMichael Duderstädt, Direktor Politische Kommunikation der GEMA und Standortleiter Berlin, beleuchtete die Bedeutung von KI für die Musikwirtschaft. Er stellte die Frage nach dem Wert menschengemachter Musik in den Mittelpunkt und ordnete die rechtlichen Auseinandersetzungen der GEMA mit Anbietern wie OpenAI und Suno ein.\n\nMarcus Hotze und Lennart Rümmler von der HEUSSEN Rechtsanwaltsgesellschaft erläuterten den damaligen Rechtsstand zum Einsatz generativer KI in Film, TV und Marketing. Sie gingen auf rechtliche Entwicklungen, regulatorische Anforderungen, vertragliche Fragen und praktische Risiken für Medien- und Kreativproduktionen ein.\n\nNach der Kaffeepause stellte Björn Adamski, CCO der 3Q GmbH, cloudunabhängige Videostreaming-Infrastrukturen vor. Er zeigte, wie Medienunternehmen ihre digitale Souveränität stärken, Kosten senken und Abhängigkeiten von Hyperscalern reduzieren konnten.\n\nMarkus Vogelbacher und Chriz Merkl präsentierten mit Vertical Minds neue Erlöswege für Filmproduktionen. Im Mittelpunkt stand eine Micro-Drama-Plattform für den DACH-Markt, die Produzentinnen, Produzenten und Rechteinhabern zusätzliche Verwertungsmöglichkeiten eröffnete.\n\nStefan Uhl, Geschäftsführer D-A-CH der Advise Media Consulting GmbH, analysierte das von der AdAlliance angekündigte neue TV-Pricing-Modell. Er erläuterte, welche Chancen und Risiken eine künftige TKP-basierte Leistungsabrechnung im linearen Fernsehen für Sender, Vermarkter, Agenturen und Kunden mit sich brachte.\n\nBegleitend zur Veranstaltung fand eine Vernissage der Galerie „EMPORIUM by Jens August“ aus Millstatt am See in Österreich statt. In den Kanzleiräumen wurden Werke von Patrizia Casagrande, Anna Schellberg, M. Jank, Bettina Nuschei und Marion Rauter gezeigt. Vertreter der Galerie sowie mehrere Künstlerinnen waren anwesend.\n\nDas Medienfrühstück bot den Teilnehmenden Gelegenheit zum fachlichen Austausch und zur persönlichen Vernetzung. Die Veranstaltung zeigte, wie stark Künstliche Intelligenz, neue Infrastrukturmodelle, rechtliche Rahmenbedingungen und veränderte Erlöslogiken die Medienbranche prägten.\n\nPROdigitalTV bedankte sich bei der HEUSSEN Rechtsanwaltsgesellschaft mbH für die Gastfreundschaft sowie bei allen Referentinnen, Referenten und Gästen für ihre Beiträge und den intensiven Austausch.\n","archiveText":"Am 17. Februar 2026 veranstaltete PROdigitalTV im Rahmen der Berlinale sein traditionelles Medienfrühstück in Berlin. Gastgeber und Sponsor war die HEUSSEN Rechtsanwaltsgesellschaft mbH am Kurfürstendamm 31.\n\nIm Mittelpunkt standen produktionen ergeben.\n\nGleichzeitig machte er deutlich, dass kreative Qualität nicht allein durch technische Systeme entsteht. Erfahrung, Intuition, strategisches Denken und die Verantwortung für das Ergebnis bleiben zentrale menschliche Kompetenzen. Künstliche Intelligenz kann kreative Prozesse beschleunigen und erweitern, ersetzt jedoch nicht die Fähigkeit, Ideen einzuordnen, weiterzuentwickeln und zielgerichtet einzusetzen.","speakerId":"speakers-gregor-c-blach","shortDescription":"Der Gründer und Geschäftsführer von WE DO communication zeigte, wie KI kreative Prozesse unterstützt und weshalb menschliche Erfahrung weiterhin unverzichtbar bleibt.","title":"Kreativität zwischen menschlicher Kompetenz und Künstlicher Intelligenz","eventIds":["event-berlinale-2026"],"subtitle":"Der Gründer und Geschäftsführer von WE DO communication zeigte, wie KI kreative Prozesse unterstützt und weshalb menschliche Erfahrung weiterhin unverzichtbar bleibt.","status":"active","sortOrder":2,"thumbnail_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fberlinale-2026-gregor-blach-kreativitaet-ki%2F1787043154156-f3f06655-af76-4dec-bfd0-7e58124b8d4d.jpg?alt=media&token=f8b9a987-602d-4d05-9a14-039776c58574","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fberlinale-2026-gregor-blach-kreativitaet-ki%2F1787043154156-f3f06655-af76-4dec-bfd0-7e58124b8d4d.jpg?alt=media&token=f8b9a987-602d-4d05-9a14-039776c58574","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fberlinale-2026-gregor-blach-kreativitaet-ki%2F1787043154156-f3f06655-af76-4dec-bfd0-7e58124b8d4d.jpg?alt=media&token=f8b9a987-602d-4d05-9a14-039776c58574","thumbnailMediaAssetId":"","thumbnail_media_asset_id":"","imageUrl":"","mediaAssetId":"","updatedAt":"2026-08-18T09:19:30.515Z"},{"id":"berlinale-2026-hotze-ruemmler-generative-ki-recht","longDescription":"Marcus Hotze 6-hotze-ruemmler-generative-ki-recht%2F1789719110239-f4840d86-a4ad-44d5-be81-c3446a6f12c0.webp?alt=media&token=2d813cdb-1a8f-411a-997c-bd6131f164e1","status":"active","bodyText":"Marcus Hotze und Lennart Rümmler gaben einen Überblick über den damaligen Rechtsstand beim Einsatz generativer Künstlicher Intelligenz in Film, Fernsehen, Werbung und Marketing. Dabei gingen sie auf aktuelle gesetzliche Entwicklungen und die wachsenden regulatorischen Anforderungen an Unternehmen und Medienproduktionen ein.\n\nIm Mittelpunkt standen unter anderem Fragen zu Urheberrechten, Persönlichkeitsrechten, Trainingsdaten, Kennzeichnungspflichten und der vertraglichen Absicherung von KI-generierten Inhalten. Die Referenten machten deutlich, dass der Einsatz generativer KI nicht nur technische und kreative Chancen eröffnet, sondern auch neue Haftungs- und Verwertungsrisiken mit sich bringt.\n\nFür Medienunternehmen ist es daher entscheidend, klare interne Prozesse zu entwickeln, Verantwortlichkeiten festzulegen und den Einsatz von KI bereits bei der Vertragsgestaltung angemessen zu berücksichtigen.","articleText":"Marcus Hotze und Lennart Rümmler gaben einen Überblick über den damaligen Rechtsstand beim Einsatz generativer Künstlicher Intelligenz in Film, Fernsehen, Werbung und Marketing. Dabei gingen sie auf aktuelle gesetzliche Entwicklungen und die wachsenden regulatorischen Anforderungen an Unternehmen und Medienproduktionen ein.\n\nIm Mittelpunkt standen unter anderem Fragen zu Urheberrechten, Persönlichkeitsrechten, Trainingsdaten, Kennzeichnungspflichten und der vertraglichen Absicherung von KI-generierten Inhalten. Die Referenten machten deutlich, dass der Einsatz generativer KI nicht nur technische und kreative Chancen eröffnet, sondern auch neue Haftungs- und Verwertungsrisiken mit sich bringt.\n\nFür Medienunternehmen ist es daher entscheidend, klare interne Prozesse zu entwickeln, Verantwortlichkeiten festzulegen und den Einsatz von KI bereits bei der Vertragsgestaltung angemessen zu berücksichtigen.","publishDate":"","validFrom":"","updatedAt":"2026-09-22T08:12:08.904Z"},{"id":"berlinale-2026-michael-duderstaedt-musik-ki","longDescription":"Michael Duderstädt stellte die Frage nach dem zukünftigen Wert menschengemachter Musik in den Mittelpunkt seines Vortrags. Generative KI-Systeme sind zunehmend in der Lage, Musikstücke zu analysieren, nachzuahmen und neue Inhalte automatisiert zu erzeugen. Dadurch entstehen weitreichende Fragen für Komponistinnen, Komponisten, Textschaffende und weitere Rechteinhaber.\n\nEr ordnete die rechtlichen Auseinandersetzungen der GEMA mit Anbietern wie OpenAI und Suno ein und erläuterte, weshalb Transparenz, Lizenzierung und eine angemessene Vergütung für die Nutzung geschützter Werke erforderlich sind. Dabei wurde deutlich, dass die Musikwirtschaft neue Regeln benötigt, um Innovation zu ermöglichen und zugleich die Rechte kreativer Urheberinnen und Urheber zu schützen.","visibility":"public","speakerIds":["speakers-michael-duderstadt"],"description":"Michael Duderstädt stellte die Frage nach dem zukünftigen Wert menschengemachter Musik in den Mittelpunkt seines Vortrags. Generative KI-Systeme sind zunehmend in der Lage, Musikstücke zu analysieren, nachzuahmen und neue Inhalte automatisiert zu erzeugen. Dadurch entstehen weitreichende Fragen für Komponistinnen, Komponisten, Textschaffende und weitere Rechteinhaber.\n\nEr ordnete die rechtlichen Auseinandersetzungen der GEMA mit Anbietern wie OpenAI und Suno ein und erläuterte, weshalb Transparenz, Lizenzierung und eine angemessene Vergütung für die Nutzung geschützter Werke erforderlich sind. Dabei wurde deutlich, dass die Musikwirtschaft neue Regeln benötigt, um Innovation zu ermöglichen und zugleich die Rechte kreativer Urheberinnen und Urheber zu schützen.","speakerId":"speakers-michael-duderstadt","shortDescription":"Der Direktor Politische Kommunikation der GEMA beleuchtete die Auswirkungen generativer KI auf Musikschaffende, Urheberrechte und die wir terschiedlicher Medienangebote verbessern und neue Möglichkeiten für eine plattformübergreifende Mediaplanung schaffen.\n\nGleichzeitig entstehen Fragen hinsichtlich der Messbarkeit, der Preisentwicklung und der Bewertung unterschiedlicher Zielgruppen und Werbeumfelder. Der Vortrag zeigte, dass das neue Modell erhebliche Veränderungen für etablierte Planungs-, Einkaufs- und Abrechnungsprozesse im TV-Werbemarkt mit sich bringen kann.","visibility":"public","speakerIds":["speakers-stefan-uhl"],"description":"Stefan Uhl beschäftigte sich mit dem von der AdAlliance angekündigten neuen Pricing-Modell für lineare Fernsehwerbung. Im Mittelpunkt stand der geplante stärkere Übergang zu einer leistungsbezogenen Abrechnung auf Grundlage des Tausend-Kontakt-Preises.\n\nEr erläuterte, wie sich ein solches Modell auf Sender, Vermarkter, Mediaagenturen und werbungtreibende Unternehmen auswirken könnte. Eine stärker standardisierte und reichweitenbezogene Abrechnung kann die Vergleichbarkeit unterschiedlicher Medienangebote verbessern und neue Möglichkeiten für eine plattformübergreifende Mediaplanung schaffen.\n\nGleichzeitig entstehen Fragen hinsichtlich der Messbarkeit, der Preisentwicklung und der Bewertung unterschiedlicher Zielgruppen und Werbeumfelder. Der Vortrag zeigte, dass das neue Modell erhebliche Veränderungen für etablierte Planungs-, Einkaufs- und Abrechnungsprozesse im TV-Werbemarkt mit sich bringen kann.","speakerId":"speakers-stefan-uhl","shortDescription":"Der Geschäftsführer D-A-CH der Advise Media Consulting GmbH analysierte die Chancen und Risiken einer TKP-basierten Leistungsabrechnung im TV-Werbemarkt.","title":"Ein neues Pricing-Modell für das lineare Fernsehen","eventIds":["event-berlinale-2026"],"subtitle":"Der Geschäftsführer D-A-CH der Advise Media Consulting GmbH analysierte die Chancen und Risiken einer TKP-basierten Leistungsabrechnung im TV-Werbemarkt.","status":"active","sortOrder":5,"thumbnailMediaAssetId":"media-asset-4a66f743-1bb8-4ec9-999f-97e arstellung im Hochformat entwickelt werden.\n\nDie Plattform soll Produzentinnen, Produzenten und Rechteinhabern zusätzliche Möglichkeiten bieten, Inhalte zu entwickeln, bestehende Stoffe neu auszuwerten und mobile Zielgruppen zu erreichen. Durch kurze Episoden, fortlaufende Erzählstrukturen und digitale Erlösmodelle entstehen neue Formen der Produktion und Vermarktung.\n\nDer Beitrag zeigte, wie sich veränderte Nutzungsgewohnheiten auf die Entwicklung audiovisueller Inhalte auswirken und welche wirtschaftlichen Chancen daraus für unabhängige Produzenten und Rechteinhaber entstehen können.","visibility":"public","speakerIds":["speakers-markus-vogelbacher","speakers-chriz-merkl"],"description":"Markus Vogelbacher und Chriz Merkl stellten mit Vertical Minds ein neues Plattformmodell für sogenannte Micro-Dramas im DACH-Markt vor. Dabei handelt es sich um kurze, serielle Bewegtbildformate, die insbesondere für die mobile Nutzung und die Darstellung im Hochformat entwickelt werden.\n\nDie Plattform soll Produzentinnen, Produzenten und Rechteinhabern zusätzliche Möglichkeiten bieten, Inhalte zu entwickeln, bestehende Stoffe neu auszuwerten und mobile Zielgruppen zu erreichen. Durch kurze Episoden, fortlaufende Erzählstrukturen und digitale Erlösmodelle entstehen neue Formen der Produktion und Vermarktung.\n\nDer Beitrag zeigte, wie sich veränderte Nutzungsgewohnheiten auf die Entwicklung audiovisueller Inhalte auswirken und welche wirtschaftlichen Chancen daraus für unabhängige Produzenten und Rechteinhaber entstehen können.","speakerId":"speakers-markus-vogelbacher","shortDescription":"Mit Vertical Minds präsentierten die Referenten eine Plattform für kurze, vertikal produzierte Serienformate im deutschsprachigen Markt.","title":"Neue Erlöswege für Filmproduktionen durch Micro-Dramas","eventIds":["event-berlinale-2026"],"subtitle":"Mit Vertical Minds präsentierten die Referenten eine Plattform für kurze, vertikal produzierte Serienformate im deutschsprachigen Markt.","status":"active","sortOrder":4,"thumbnailMediaAssetId":"media-asset-3e7d5612-3f17-4b08-87d0-5de533789cce","thumbnail_media_asset_id":"media-asset-3e7d5612-3f17-4b08-87d0-5de533789cce","imageUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fberlinale-2026-vogelbacher-merkl-micro-dramas%2F1787039412332-25558340-ee6a-4618-9e07-ab13f871e54b.jpg?alt=media&token=7baa195b-97c9-45d9-8a37-0c85f356de26","media_asset_id":"media-asset-3e7d5612-3f17-4b08-87d0-5de533789cce","thumbnail_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fberlinale-2026-vogelbacher-merkl-micro-dramas%2F1787039412332-25558340-ee6a-4618-9e07-ab13f871e54b.jpg?alt=media&token=7baa195b-97c9-45d9-8a37-0c85f356de26","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fberlinale-2026-vogelbacher-merkl-micro-dramas%2F1787039412332-25558340-ee6a-4618-9e07-ab13f871e54b.jpg?alt=media&token=7baa195b-97c9-45d9-8a37-0c85f356de26","mediaAssetId":"media-asset-3e7d5612-3f17-4b08-87d0-5de533789cce","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fberlinale-2026-vogelbacher-merkl-micro-dramas%2F1787039412332-25558340-ee6a-4618-9e07-ab13f871e54b.jpg?alt=media&token=7baa195b-97c9-45d9-8a37-0c85f356de26","companyLogoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Fberlinale-2026-vogelbacher-merkl-micro-dramas-company-logo%2F1787039763847-a5523021-3bc2-4891-9740-1f4bcae9b591.jpg?alt=media&token=06d3e410-b27b-467f-9437-6e6e8ec567f5","updatedAt":"2026-08-18T07:56:10.343Z"}],"speakers":[{"id":"speakers-bjorn-adamski","lastName":"Adamski","visibility":"public","eventIds":["event-berlinale-2026"],"firstName":"Björn","topicId":"berlinale-2026-bjoern-adamski-cloudunabhaengiges-videostreaming","name":"Björn Adamski","topicIds":["berlinale-2026-bjoern-adamski-cloudunabhaengiges-videostreaming"],"company":"3Q GmbH","position":"CCO","status":"published","website":"https://www.3q.video","photoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/speakers%2Fspeakers-bjorn-adamski%2F1786966159815-60aad732-1ed6-45ce-8bc5-a0b971414aa0.png?alt=media&token=1de61f98-881c-4cd8-845e-dd95bc887712","longBio":"Björn Adamski stellte cloudunabhängige Videostreaming-Infrastrukturen als Alternative zu einer vollständigen Abhängigkeit von internationalen Hyperscalern vor. Er erläuterte, wie Medienunternehmen durch flexible technische Architekturen mehr Kontrolle über ihre Inhalte, Daten und Distributionswege gewinnen können.\n\nIm Mittelpunkt standen die digitale Souveränität, transparente Kostenstrukturen und die Möglichkeit, unterschiedliche Infrastrukturpartner miteinander zu kombinieren. Durch offene und anpassbare Systeme können Unternehmen ihre Streaming-Angebote gezielter skalieren und Abhängigkeiten von einzelnen Plattform- oder Cloudanbietern reduzieren.\n\nDer Vortrag machte deutlich, dass technologische Unabhängigkeit zunehmend auch zu einer strategischen und wirtschaftlichen Frage für Medienunternehmen wird.","vita":"Björn Adamski stellte cloudunabhängige Videostreaming-Infrastrukturen als Alternative zu einer vollständigen Abhängigkeit von internationalen Hyperscalern vor. Er erläuterte, wie Medienunternehmen durch flexible technische Architekturen mehr Kontrolle über ihre Inhalte, Daten und Distributionswege gewinnen können.\n\nIm Mittelpunkt standen die digitale Souveränität, transparente Kostenstrukturen und die Möglichkeit, unterschiedliche Infrastrukturpartner miteinander zu kombinieren. Durch offene und anpassbare Systeme können Unternehmen ihre Streaming-Angebote gezielter skalieren und Abhängigkeiten von einzelnen Plattform- oder Cloudanbietern reduzieren.\n\nDer Vortrag machte deutlich, dass technologische Unabhängigkeit zunehmend auch zu einer strategischen und wirtschaftlichen Frage für Medienunternehmen wird.","shortBio":"Der CCO der 3Q GmbH zeigte, wie Medienunternehmen ihre Streaming-Infrastruktur unabhängiger, kontrollierbarer und wirtschaftlicher gestalten können.","updatedAt":"2026-09-23T08:00:16.041Z"},{"id":"speakers-chriz-merkl","lastName":"Merkl","visibility":"public","eventIds":["event-berlinale-2026"],"firstName":"Chriz","topicId":"berlinale-2026-vogelbacher-merkl-micro-dramas","name":"Chriz Merkl","topicIds":["berlinale-2026-vogelbacher-merkl-micro-dramas"],"company":"Vertical Minds","position":"","status":"published","photoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/speakers%2Fspeakers-chriz-merkl%2F1786966608639-54edfc0f-ce8b-40d2-ac4b-c0dc7e32bc96.jpg?alt=media&token=221abe64-badf-461c-9601-d3c6e5e9184d","website":"https://verticalminds.de/","longBio":"Chriz Merkl ist ein kreativer Visionär an der Schnittstelle von Medien und Technologie. Seit den frühen 1990er-Jahren gestaltet er inspirierende Projekte vom Film über  Medienproduktion bis hin zu Games.\n\nAls Mitgründer der Vertical Minds gestaltet er mit unerschöpflicher Neugier, einem interdisziplinären Blick und der Fähigkeit, Trends in echte Lösungen zu verwandeln, das das Medium von morgen – dem Vertical Drama.","vita":"Chriz Merkl ist ein kreativer Visionär an der Schnittstelle von Medien und Technologie. Seit den frühen 1990er-Jahren gestaltet er inspirierende Projekte vom Film über  Medienproduktion bis hin zu Games.\n\nAls Mitgründer der Vertical Minds gestaltet er mit unerschöpflicher Neugier, einem interdisziplinären Blick und der Fähigkeit, Trends in echte Lösungen zu verwandeln, das das Medium von morgen – dem Vertical Drama.","shortBio":"Chriz Merkl ist ein kreativer Visionär an der Schnittstelle von Medien und Technologie. Seit den frühen 1990er-Jahren gestaltet er inspirierende Projekte vom Film über  Medienproduktion bis hin zu Games.\n\nAls Mitgründer der Vertical Minds gestaltet er mit unerschöpflicher Neugier, einem interdisziplinären Blick und der Fähigkeit, Trends in echte Lösungen zu verwandeln, das das Medium von morgen – dem Vertical Drama.","updatedAt":"2026-09-23T08:00:16.041Z"},{"id":"speakers-gregor-c-blach","lastName":"Blach","visibility":"public","eventIds":["event-berlinale-2026"],"firstName":"Gregor C.","topicId":"berlinale-2026-gregor-blach-kreativitaet-ki","name":"Gregor C. Blach","topicIds":["berlinale-2026-gregor-blach-kreativitaet-ki"],"company":"WE DO communication","position":"Gründer und Geschäftsführer","status":"published","website":"https://www.we-do.com/","photoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/speakers%2Fspeakers-gregor-c-blach%2F1786967964101-b7320a2a-dbfb-4cb7-9fdf-9815ed93f30c.jpg?alt=media&token=8154291e-91bd-4c14-96e0-6b59c1547e61","longBio":"Gregor C. Blach beschäftigte sich mit dem Zusammenspiel von menschlicher Kreativität und Künstlicher Intelligenz. Anhand aktueller Entwicklungen zeigte er, wie KI bereits bei der Erstellung von Konzepten, Texten und Bildern eingesetzt werden kann und welche neuen Möglichkeiten sich daraus für Agenturen, Unternehmen und Medienproduktionen ergeben.\n\nGleichzeitig machte er deutlich, dass kreative Qualität nicht allein durch technische Systeme entsteht. Erfahrung, Intuition, strategisches Denken und die Verantwortung für das Ergebnis bleiben zentrale menschliche Kompetenzen. Künstliche Intelligenz kann kreative Prozesse beschleunigen und erweitern, ersetzt jedoch nicht die Fähigkeit, Ideen einzuordnen, weiterzuentwickeln und zielgerichtet einzusetzen.","vita":"Gregor C. Blach beschäftigte sich mit dem Zusammenspiel von menschlicher Kreativität und Künstlicher Intelligenz. Anhand aktueller Entwicklungen zeigte er, wie KI bereits bei der Erstellung von Konzepten, Texten und Bildern eingesetzt werden kann und welche neuen Möglichkeiten sich daraus für Agenturen, Unternehmen und Medienproduktionen ergeben.\n\nGleichzeitig machte er deutlich, dass kreative Qualität nicht allein durch technische Systeme entsteht. Erfahrung, Intuition, strategisches Denken und die Verantwortung für das Ergebnis bleiben zentrale menschliche Kompetenzen. Künstliche Intelligenz kann kreative Prozesse beschleunigen und erweitern, ersetzt jedoch nicht die Fähigkeit, Ideen einzuordnen, weiterzuentwickeln und zielgerichtet einzusetzen.","shortBio":"Der Gründer und Geschäftsführer von WE DO communication zeigte, wie KI kreative Prozesse unterstützt und weshalb menschliche Erfahrung weiterhin unverzichtbar bleibt.","updatedAt":"2026-09-23T08:00:16.041Z"},{"id":"speakers-lennart-ruemmler","lastName":"Ruemmler","visibility":"public","eventIds":["event-berlinale-2026"],"firstName":"Lennart","name":"Lennart Ruemmler","company":"HEUSSEN","position":"Rechtsanwalt","status":"published","photoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/speakers%2Fspeakers-lennart-ruemmler%2F1786970542851-f5451573-300c-431c-8be6-272064d443cd.jpg?alt=media&token=da0692ce-f9dc-4b7e-ac9b-c77807da1f3a","longBio":"Lennart Rümmler ist Rechtsanwalt am Münchener Standort von HEUSSEN und dort bereits seit seiner Ausbildung in der Praxisgruppe IT, IP und Medienrecht tätig.\n\nAls LL.M. (Eur) im Europäischen und internationalen Wirtschaftsrecht konnte Herr Rümmler schon früh vertiefte Kenntnisse in den relevanten Bereichen des Rechts des geistigen Eigentums entwickeln.\n\nBesonderer Fokus liegt auf der Verbindung von urheberrechtlichen Rechtsproblemen mit der modernen Kommunikationstechnologie und dem Internet.","vita":"Lennart Rümmler ist Rechtsanwalt am Münchener Standort von HEUSSEN und dort bereits seit seiner Ausbildung in der Praxisgruppe IT, IP und Medienrecht tätig.\n\nAls LL.M. (Eur) im Europäischen und internationalen Wirtschaftsrecht konnte Herr Rümmler schon früh vertiefte Kenntnisse in den relevanten Bereichen des Rechts des geistigen Eigentums entwickeln.\n\nBesonderer Fokus liegt auf der Verbindung von urheberrechtlichen Rechtsprobl ,"name":"Stefan Uhl","topicIds":["berlinale-2026-stefan-uhl-tv-pricing-modell"],"company":"Advise Media Consulting GmbH","position":"Geschäftsführer D-A-CH","status":"published","photoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/speakers%2Fspeakers-stefan-uhl%2F1786969677894-0612bc33-31f1-417f-8bda-642d511194e9.jpg?alt=media&token=fccb00da-5569-444d-a0a6-6f008eb0d0bd","website":"","companyLogoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/speakers%2Fspeakers-stefan-uhl-company-logo%2F1786973950234-cc426e79-e9b0-4fd1-9bad-95183cc52464.jpg?alt=media&token=8ba48b67-8280-4608-8072-ed13e6aa50e3","longBio":"Stefan Uhl beschäftigte sich mit dem von der AdAlliance angekündigten neuen Pricing-Modell für lineare Fernsehwerbung. Im Mittelpunkt stand der geplante stärkere Übergang zu einer leistungsbezogenen Abrechnung auf Grundlage des Tausend-Kontakt-Preises.\n\nEr erläuterte, wie sich ein solches Modell auf Sender, Vermarkter, Mediaagenturen und werbungtreibende Unternehmen auswirken könnte. Eine stärker standardisierte und reichweitenbezogene Abrechnung kann die Vergleichbarkeit unterschiedlicher Medienangebote verbessern und neue Möglichkeiten für eine plattformübergreifende Mediaplanung schaffen.\n\nGleichzeitig entstehen Fragen hinsichtlich der Messbarkeit, der Preisentwicklung und der Bewertung unterschiedlicher Zielgruppen und Werbeumfelder. Der Vortrag zeigte, dass das neue Modell erhebliche Veränderungen für etablierte Planungs-, Einkaufs- und Abrechnungsprozesse im TV-Werbemarkt mit sich bringen kann.","vita":"Stefan Uhl beschäftigte sich mit dem von der AdAlliance angekündigten neuen Pricing-Modell für lineare Fernsehwerbung. Im Mittelpunkt stand der geplante stärkere Übergang zu einer leistungsbezogenen Abrechnung auf Grundlage des Tausend-Kontakt-Preises.\n\nEr erläuterte, wie sich ein solches Modell auf Sender, Vermarkter, Mediaagenturen und werbungtreibende Unternehmen auswirken könnte. Eine stärker standardisierte und reichweitenbezogene Abrechnung kann die Vergleichbarkeit unterschiedlicher Medienangebote verbessern und neue Möglichkeiten für eine plattformübergreifende Mediaplanung schaffen.\n\nGleichzeitig entstehen Fragen hinsichtlich der Messbarkeit, der Preisentwicklung und der Bewertung unterschiedlicher Zielgruppen und Werbeumfelder. Der Vortrag zeigte, dass das neue Modell erhebliche Veränderungen für etablierte Planungs-, Einkaufs- und Abrechnungsprozesse im TV-Werbemarkt mit sich bringen kann.","shortBio":"Der Geschäftsführer D-A-CH der Advise Media Consulting GmbH analysierte die Chancen und Risiken einer TKP-basierten Leistungsabrechnung im TV-Werbemarkt.","updatedAt":"2026-09-23T08:00:16.041Z"}],"sponsors":[{"id":"heussen","name":"HEUSSEN Rechtsanwaltsgesellschaft mbH","description":"","status":"published","website":"","visibility":"public","logoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fuploads%2FHEIE%2Fprodigitaltv-bild_HEIE_upload_1x1_v1.jpg?alt=media&token=3e624411-8778-4ac7-9d52-685437ce6e7b","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fuploads%2FHEIE%2Fprodigitaltv-bild_HEIE_upload_1x1_v1.jpg?alt=media&token=3e624411-8778-4ac7-9d52-685437ce6e7b","updatedAt":"2026-06-23T13:44:01.442Z"}],"galleries":[{"id":"galleries-d3ec8119-f610-432f-a1c3-69e5f601feb1","title":"heussen 2026","status":"published","visibility":"public","eventId":"","images":[{"url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/galleries%2Fgalleries-d3ec8119-f610-432f-a1c3-69e5f601feb1%2F1780048224040-c0a74f97-308b-496d-8c28-a630bf549d56.jpg?alt=media&token=70c1cfad-f826-4190-b0db-639b6f658359","imageUrl":"","thumbnailUrl":"","sortOrder":1},{"url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/galleries%2Fgalleries-d3ec8119-f610-432f-a1c3-69e5f601feb1%2F17 rnen - München","visible":true,"registrationEnabled":true,"registrationStatus":"open","lifecyclePhase":"registration_open","registration_state":"open","allowMemberRegistration":true,"preStatus":"invitation_published","status":"active","descriptionMode":"complete","description":"Am **Vorabend des Medienfrühstückes** bei der RA Kanzlei Heuking und Partner lädt PROdigitalTV seine Mitglieder und Referenten am 22. Oktober 2026 um 18:30 Uhr zu einem exklusiven Expertenabend in den **Münchner Hofbräukelle**r ein. Unter dem Motto „Von den Besten lernen“ präsentiert ein erfahrener Unternehmer und Fachmann aus Wirtschaft, Medien und Innovation seine erfolgreichen Strategien und teilen praxisnahe Erkenntnisse.\n\nDie Veranstaltung bietet den Mitgliedern die Möglichkeit, direkt von den Herausforderungen und Erfolgen der Referenten zu profitieren und neue Impulse für die digitale Medienwirtschaft zu gewinnen. Neben den Vorträgen steht der intensive Austausch im Mittelpunkt: In Gesprächen und Diskussionen können die Teilnehmer ihr Netzwerk erweitern und wertvolle Kontakte knüpfen.\n\nAls geschlossene Plattform fördert der Abend den Wissenstransfer innerhalb der Branche und unterstützt die Weiterentwicklung der digitalen Medienlandschaft in München und darüber hinaus. Die Kombination aus persönlichen Einblicken und konkreten Praxisbeispielen macht das Event zu einer bedeutenden Gelegenheit für Mitglieder von PROdigitalTV, aktuelle Trends und bewährte Methoden kennenzulernen.\n\nKeywords: Medienwirtschaft, Innovation, Netzwerk, Strategie\n\nDas Programm verbindet mehrere Perspektiven aus der digitalen Medienwirtschaft: Andreas Gerhard von Sport 1 GmbH stellt den Vortrag „Sport1 - All Access“ vor.\n\nWir freuen uns darauf, Sie in München persönlich zu begrüßen. Bitte melden Sie sich frühzeitig an, damit wir Ihre Teilnahme verbindlich einplanen können.","longDescription":"Von den Besten Lernen – München 2026  \nExklusive Einblicke in Content- und Distributionsstrategien bei Sport1  \n\nAm 22. Oktober 2026 fand im Münchner Hofbräukeller das exklusive PROdigitalTV-Event „Von den Besten Lernen“ statt. Die Veranstaltung richtete sich ausschließlich an die Mitglieder von PROdigitalTV sowie eingeladene Gäste und bot einen intensiven Austausch zu aktuellen Herausforderungen und erfolgreichen Strategien in der digitalen Medienwirtschaft. Im Fokus stand die praxisnahe Vermittlung von Wissen durch erfahrene Branchenexperten, die ihre Einblicke und Erfahrungen mit den Teilnehmern teilten.  \n\nDen Auftakt bildete die Begrüßung durch Beate Busch, die den Abend eröffnete und den Rahmen für den fachlichen Austausch setzte. Im Anschluss präsentierte Norman Schneider ein Interview mit Andreas Gerhard, Chief Content & Distribution Officer der Sport 1 GmbH. Unter dem Titel „Sport1 – All Access“ erläuterte Gerhard, wie aus einem Sportthema ein kanalübergreifendes Medienereignis entsteht. Dabei stand die Frage im Mittelpunkt, wie Inhalte, Distribution und verschiedene Touchpoints so orchestriert werden, dass Aufmerksamkeit und Reichweite gezielt aufgebaut werden können.  \n\nGerhard zeigte auf, wie eine koordinierte Content- und Distributionsstrategie essenziell ist, um Medienhypes nicht nur über einzelne Ausspielwege, sondern über mehrere Kontaktpunkte hinweg zu entwickeln. Er betonte die Bedeutung, redaktionelle Inhalte, Plattformen und Nutzeransprache aufeinander abzustimmen, um ein konsistentes Medienerlebnis zu schaffen. Für digitale Medienunternehmen eröffnen sich daraus neue Möglichkeiten, Reichweite, Engagement und Markenbindung ganzheitlich zu gestalten.  \n\nDer Vortrag bot den Mitgliedern von PROdigitalTV wertvolle Einblicke in die Mechanismen moderner Medieninszenierung und gab einen Ausblick darauf, wie Medienmarken ihre Themen künftig kanalübergreifend führen können, ohne die jeweilige Nutzungssituation aus dem Blick zu verlieren.  \n\nIm Anschluss an den Vortrag nutzten die Teilnehmer die Gelegenheit zum Abendessen und Networking. Der intensive persönliche Austausch förderte die Vernetzung innerhalb der Branche und ermöglichte es, neue Partnerschaften und Kooperationen anzustoßen.  \n\nMit diesem Abend setzte PROdigitalTV erneut einen wichtigen Impuls für die Weiterentwicklung der digitalen Medienlandschaft in München und darüber hinaus. Die Kombination aus fundierten Fachvorträgen und persönlichem Dialog stärkte den Wissenstransfer und die Innovationskraft der Mitglieder.  \n\nKeywords: Contentstrategie, Distribution, Medienhype, Netzwerk","archiveText":"Von den Besten Lernen – München 2026  \nExklusive Einblicke in Content- und Distributionsstrategien bei Sport1  \n\nAm 22. Oktober 2026 fand im Münchner Hofbräukeller das exklusive PROdigitalTV-Event „Von den Besten Lernen“ statt. Die Veranstaltung richtete sich ausschließlich an die Mitglieder von PROdigitalTV sowie eingeladene Gäste und bot einen intensiven Austausch zu aktuellen Herausforderungen und erfolgreichen Strategien in der digitalen Medienwirtschaft. Im Fokus stand die praxisnahe Vermittlung von Wissen durch erfahrene Branchenexperten, die ihre Einblicke und Erfahrungen mit den Teilnehmern teilten.  \n\nDen Auftakt bildete die Begrüßung durch Beate Busch, die den Abend eröffnete und den Rahmen für den fachlichen Austausch setzte. Im Anschluss präsentierte Norman Schneider ein Interview mit Andreas Gerhard, Chief Content & Distribution Officer der Sport 1 GmbH. Unter dem Titel „Sport1 – All Access“ erläuterte Gerhard, wie aus einem Sportthema ein kanalübergreifendes Medienereignis entsteht. Dabei stand die Frage im Mittelpunkt, wie Inhalte, Distribution und verschiedene Touchpoints so orchestriert werden, dass Aufmerksamkeit und Reichweite gezielt aufgebaut werden können.  \n\nGerhard zeigte auf, wie eine koordinierte Content- und Distributionsstrategie essenziell ist, um Medienhypes nicht nur über einzelne Ausspielwege, sondern über mehrere Kontaktpunkte hinweg zu entwickeln. Er betonte die Bedeutung, redaktionelle Inhalte, Plattformen und Nutzera
