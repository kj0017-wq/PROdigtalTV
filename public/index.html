"speakerIds":["speakers-17eb66c1-444b-4e00-a9e9-2bd401f65523"],"eventIds":["event-archive-63"],"subtitle":"","status":"active","thumbnailMediaAssetId":"media-asset-eeb8f6ec-a974-46b9-af27-332afd6823e5","thumbnail_media_asset_id":"media-asset-eeb8f6ec-a974-46b9-af27-332afd6823e5","article_media_asset_id":"media-asset-eeb8f6ec-a974-46b9-af27-332afd6823e5","imageUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-f0a8723e-d11b-4dc4-ace5-3cb37f1c62eb%2F1790169880723-d34e2288-43da-46ec-af8a-eeac3399d72c.webp?alt=media&token=a978e4a6-33c8-4e9e-9a4b-5c9cddf57ccb","thumbnail_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-f0a8723e-d11b-4dc4-ace5-3cb37f1c62eb%2F1790169880723-d34e2288-43da-46ec-af8a-eeac3399d72c.webp?alt=media&token=a978e4a6-33c8-4e9e-9a4b-5c9cddf57ccb","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-f0a8723e-d11b-4dc4-ace5-3cb37f1c62eb%2F1790169880723-d34e2288-43da-46ec-af8a-eeac3399d72c.webp?alt=media&token=a978e4a6-33c8-4e9e-9a4b-5c9cddf57ccb","mediaAssetId":"media-asset-eeb8f6ec-a974-46b9-af27-332afd6823e5","articleMediaAssetId":"media-asset-eeb8f6ec-a974-46b9-af27-332afd6823e5","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-f0a8723e-d11b-4dc4-ace5-3cb37f1c62eb%2F1790169880723-d34e2288-43da-46ec-af8a-eeac3399d72c.webp?alt=media&token=a978e4a6-33c8-4e9e-9a4b-5c9cddf57ccb","longDescription":"Utiq eröffnet mit einer telkobasierten Identitätslösung neue Möglichkeiten für adressierbare Werbung im europäischen Open Web. Im Mittelpunkt stehen Datenschutz, Einwilligung und pseudonyme Nutzererkennung sowie die Frage, wie Publisher und Werbetreibende auch ohne klassische Third-Party-Cookies relevante Zielgruppen erreichen und Kampagnen wirksam messen können.\n\nDer Utiq-Ansatz zeigt, welche Rolle Telekommunikationsanbieter künftig im digitalen Werbeökosystem übernehmen können und wie sich datenschutzkonforme Identitätslösungen mit den Anforderungen von Medienunternehmen, Publishern und Werbetreibenden verbinden lassen. Daraus ergeben sich neue Perspektiven für Reichweitenvermarktung, Zielgruppenansprache und Kampagnenmessung im europäischen digitalen Werbemarkt.","description":"Utiq eröffnet mit einer telkobasierten Identitätslösung neue Möglichkeiten für adressierbare Werbung im europäischen Open Web. Im Mittelpunkt stehen Datenschutz, Einwilligung und pseudonyme Nutzererkennung sowie die Frage, wie Publisher und Werbetreibende auch ohne klassische Third-Party-Cookies relevante Zielgruppen erreichen und Kampagnen wirksam messen können.\n\nDer Utiq-Ansatz zeigt, welche Rolle Telekommunikationsanbieter künftig im digitalen Werbeökosystem übernehmen können und wie sich datenschutzkonforme Identitätslösungen mit den Anforderungen von Medienunternehmen, Publishern und Werbetreibenden verbinden lassen. Daraus ergeben sich neue Perspektiven für Reichweitenvermarktung, Zielgruppenansprache und Kampagnenmessung im europäischen digitalen Werbemarkt.","shortDescription":"Utiq eröffnet mit einer telkobasierten Identitätslösung neue Möglichkeiten für adressierbare Werbung im europäischen Open Web. Im Mittelpunkt stehen Datenschutz, Einwilligung und pseudonyme Nutzererkennung sowie die Frage, wie Publisher und Werbetreibende auch ohne klassische Third-Party-Cookies relevante Zielgruppen erreichen und Kampagnen wirksam messen können.\n\nDer Utiq-Ansatz zeigt, welche Rolle Telekommunikationsanbieter künftig im digitalen Werbeökosystem übernehmen können und wie sich datenschutzkonforme Identitätslösungen mit den Anforderungen von Medienunternehmen, Publishern und Werbetreibenden verbinden lassen. Daraus ergeben sich neue Perspektiven für Reichweitenvermarktung, Zielgruppenansprache und Kampagnenmessung im europäischen digitalen Werbemarkt.","updatedAt":"2026-09-23T16:43:14.718Z"},{"id":"topics-f1bea931-71c0-4704-af18-6ab4565254d9","visibility":"public","status":"active","longDescription":"  Die Content-Produktion in der Medienwirtschaft erlebt durch den Einsatz Künstlicher Intelligenz (KI) einen tiefgreifenden Wandel. Bert Sahm von der M-COS Group verdeutlichte in seinem Vortrag, wie KI-gestützte Prozesse traditionelle Produktionsabläufe nachhaltig verändern. Dabei rückte er insbesondere die Entwicklung von analogen zu digitalen und zunehmend automatisierten Workflows in den Fokus.\n\nHistorisch basierte die Content-Erstellung auf manuellen und oft zeitintensiven Arbeitsschritten, die durch analoge Verfahren geprägt waren. Mit der Digitalisierung wurden viele dieser Prozesse bereits effizienter gestaltet. Nun ermöglicht KI eine weitere Automatisierung, die nicht nur die Geschwindigkeit, sondern auch die Qualität und Individualisierung von Inhalten verbessert. Sahm zeigte auf, wie Algorithmen und maschinelles Lernen in verschiedenen Phasen der Content-Produktion eingesetzt werden – von der Recherche und Texterstellung über Bild- und Videobearbeitung bis hin zur Distribution.\n\nFür die Medienbranche bedeutet diese Entwicklung eine grundlegende Umstrukturierung der Produktionsketten. Redaktionen und Produktionshäuser müssen ihre Arbeitsweisen anpassen, um die Potenziale der KI-Technologien optimal zu nutzen. Gleichzeitig stellt die Integration von KI neue Anforderungen an die Qualifikationen der Mitarbeitenden und an die technische Infrastruktur. Automatisierte Workflows können zwar Effizienzgewinne bringen, erfordern jedoch auch eine sorgfältige Steuerung, um Qualität und journalistische Integrität zu sichern.\n\nDie zunehmende Automatisierung durch KI eröffnet zudem neue Möglichkeiten für personalisierte und datengetriebene Inhalte, die auf individuelle Nutzerbedürfnisse zugeschnitten sind. Dies kann zu einer stärkeren Nutzerbindung und neuen Geschäftsmodellen führen. Gleichzeitig bleibt die Balance zwischen menschlicher Kreativität und maschineller Unterstützung eine zentrale Herausforderung.\n\nInsgesamt zeigt Sahms Vortrag, dass KI nicht nur ein technisches Werkzeug ist, sondern ein Treiber für tiefgreifende Veränderungen in der Content-Produktion. Medienunternehmen, die diese Entwicklung aktiv gestalten, können ihre Wettbewerbsfähigkeit langfristig sichern und neue Potenziale erschließen.\n\nKeywords:  \nKünstlicheIntelligenz, ContentProduktion, Automatisierung, Medienbranche","subtitle":"Bert Sahm von der M-COS Group erläutert die Entwicklung von analogen zu automatisierten Workflows und deren Auswirkungen auf die Medienbranche","description":"  Die Content-Produktion in der Medienwirtschaft erlebt durch den Einsatz Künstlicher Intelligenz (KI) einen tiefgreifenden Wandel. Bert Sahm von der M-COS Group verdeutlichte in seinem Vortrag, wie KI-gestützte Prozesse traditionelle Produktionsabläufe nachhaltig verändern. Dabei rückte er insbesondere die Entwicklung von analogen zu digitalen und zunehmend automatisierten Workflows in den Fokus.\n\nHistorisch basierte die Content-Erstellung auf manuellen und oft zeitintensiven Arbeitsschritten, die durch analoge Verfahren geprägt waren. Mit der Digitalisierung wurden viele dieser Prozesse bereits effizienter gestaltet. Nun ermöglicht KI eine weitere Automatisierung, die nicht nur die Geschwindigkeit, sondern auch die Qualität und Individualisierung von Inhalten verbessert. Sahm zeigte auf, wie Algorithmen und maschinelles Lernen in verschiedenen Phasen der Content-Produktion eingesetzt werden – von der Recherche und Texterstellung über Bild- und Videobearbeitung bis hin zur Distribution.\n\nFür die Medienbranche bedeutet diese Entwicklung eine grundlegende Umstrukturierung der Produktionsketten. Redaktionen und Produktionshäuser müssen ihre Arbeitsweisen anpassen, um die Potenziale der KI-Technologien optimal zu nutzen. Gleichzeitig stellt die Integration von KI neue Anforderungen an die Qualifikationen der Mitarbeitenden und an die technische Infrastruktur. Automatisierte Workflows können zwar Effizienzgewinne bringen, erfordern jedoch auch eine sorgfältige Steuerung, um Qualität und journalistische Integrität zu sichern.\n\nDie zunehmende Automatisierung durch KI eröffnet zudem neue Möglichkeiten für personalisierte und datengetriebene Inhalte, die auf individuelle Nutzerbedürfnisse zugeschnitten sind. Dies kann zu einer stärkeren Nutzerbindung und neuen Geschäftsmodellen führen. Gleichzeitig bleibt die Balance zwischen menschlicher Kreativität und maschineller Unterstützung eine zentrale Herausforderung.\n\nInsgesamt zeigt Sahms Vortrag, dass KI nicht nur ein technisches Werkzeug ist, sondern ein Treiber für tiefgreifende Veränderungen in der Content-Produktion. Medienunternehmen, die diese Entwicklung aktiv gestalten, können ihre Wettbewerbsfähigkeit langfristig sichern und neue Potenziale erschließen.\n\nKeywords:  \nKünstlicheIntelligenz, ContentProduktion, Automatisierung, Medienbranche","shortDescription":"Bert Sahm von der M-COS Group erläutert die Entwicklung von analogen zu automatisierten Workflows und deren Auswirkungen auf die Medienbranche","title":"KI transformiert klassische Content-Produktion grundlegend","thumbnail_media_asset_id":"media-asset-9b0956f3-5f89-4533-915c-ce5ad22f3ef6","imageUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Farticles%2FEBBO%2Ftopics-f1bea931-71c0-4704-af18-6ab4565254d9-ki-collage-1536x1024_news_desktop_1200x675.webp?alt=media&token=c5baeb9c-a58c-42ad-b1c7-8710a0e3b136","thumbnail_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Farticles%2FEBBO%2Ftopics-f1bea931-71c0-4704-af18-6ab4565254d9-ki-collage-1536x1024_news_desktop_1200x675.webp?alt=media&token=c5baeb9c-a58c-42ad-b1c7-8710a0e3b136","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Farticles%2FEBBO%2Ftopics-f1bea931-71c0-4704-af18-6ab4565254d9-ki-collage-1536x1024_news_desktop_1200x675.webp?alt=media&token=c5baeb9c-a58c-42ad-b1c7-8710a0e3b136","mediaAssetId":"media-asset-9b0956f3-5f89-4533-915c-ce5ad22f3ef6","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Farticles%2FEBBO%2Ftopics-f1bea931-71c0-4704-af18-6ab4565254d9-ki-collage-1536x1024_news_desktop_1200x675.webp?alt=media&token=c5baeb9c-a58c-42ad-b1c7-8710a0e3b136","updatedAt":"2026-07-27T13:24:43.080Z"}]},"pdtv-public-list-v8:topics:[[\"status\",\"==\",\"published\"],[\"visibility\",\"==\",\"public\"]]":{"createdAt":1790692911693,"records":[]},"pdtv-public-list-v8:topics:[[\"status\",\"==\",\"aktiv\"],[\"sichtbarkeit\",\"==\",\"oeffentlich\"]]":{"createdAt":1790692911693,"records":[]},"pdtv-public-list-v7:speakers:[[\"status\",\"==\",\"published\"]]":{"createdAt":1790692911693,"records":[{"id":"speakers-13a2a41d-82ad-49c6-ac91-c1873cd25ef2","lastName":"Sahm","visibility":"public","firstName":"Bert","topicId":"topics-f1bea931-71c0-4704-af18-6ab4565254d9","name":"Bert Sahm","status":"published","topicIds":["topics-f1bea931-71c0-4704-af18-6ab4565254d9","leica-2026-bert-sahm-ki-workflow"],"company":"M-COS Group","position":"Vertreter","website":"https://www.instagram.com/mcos.group/","longBio":"Bert Sahm ist seit mehr als 25 Jahren erfolgreich als Modedesigner, Trendberater und Marketingexperte tätig. Mit seinen Labels **BERT SAHM PARIS©** und **BERT SAHM Couture-à-porter** war er unter anderem bei renommierten internationalen Mode- und Kaufhäusern wie Saks Fifth Avenue, Bloomingdale’s, Harrods und Lillie Rubin vertreten.\n\nSeit den 1990er-Jahren arbeitet er eng mit führenden internationalen Handels- und Modeunternehmen zusammen. Zu seinen Partnern und Auftraggebern zählen unter anderem die **OTTO Group, C&A, Akzo Nobel und die Vendex Group**. Für verschiedene Unternehmen entwickelte er Kollektionen, Lizenzmarken, Trendkonzepte und Marketingstrategien. Zudem war er Designer, Trendberater und Markenbotschafter für **MADELEINE** und arbeitete für den Quelle-Katalog „Image“ parallel mit Karl Lagerfeld.\n\nSeine heutigen Schwerpunkte liegen in den Bereichen **Design, internationale Trendforschung, Marketing, Kommunikation sowie digitale und virtuelle 3D-Lifestylewelten**.\n\nBert Sahm ist Gründer, Mitgesellschafter und Geschäftsführer der 2005 gegründeten Hamburger **ICOS – international concepts of style GmbH**. Seit 2014 ist er zudem Initiator des Medienprojekts **NY-PAMILO TV** und entwickelte ab 2020 mit **NY-PAMILO Virtual Catwalks** innovative, fotorealistische 3D-Formate für virtuelle Fashion Shows.\n","vita":"Bert Sahm ist seit mehr als 25 Jahren erfolgreich als Modedesigner, Trendberater und Marketingexperte tätig. Mit seinen Labels **BERT SAHM PARIS©** und **BERT SAHM Couture-à-porter** war er unter anderem bei renommierten internationalen Mode- und Kaufhäusern wie Saks Fifth Avenue, Bloomingdale’s, Harrods und Lillie Rubin vertreten.\n\nSeit den 1990er-Jahren arbeitet er eng mit führenden internationalen Handels- und Modeunternehmen zusammen. Zu seinen Partnern und Auftraggebern zählen unter anderem die **OTTO Group, C&A, Akzo Nobel und die Vendex Group**. Für verschiedene Unternehmen entwickelte er Kollektionen, Lizenzmarken, Trendkonzepte und Marketingstrategien. Zudem war er Designer, Trendberater und Markenbotschafter für **MADELEINE** und arbeitete für den Quelle-Katalog „Image“ parallel mit Karl Lagerfeld.\n\nSeine heutigen Schwerpunkte liegen in den Bereichen **Design, internationale Trendforschung, Marketing, Kommunikation sowie digitale und virtuelle 3D-Lifestylewelten**.\n\nBert Sahm ist Gründer, Mitgesellschafter und Geschäftsführer der 2005 gegründeten Hamburger **ICOS – international concepts of style GmbH**. Seit 2014 ist er zudem Initiator des Medienprojekts **NY-PAMILO TV** und entwickelte ab 2020 mit **NY-PAMILO Virtual Catwalks** innovative, fotorealistische 3D-Formate für virtuelle Fashion Shows.\n","shortBio":"Bert Sahm ist seit mehr als 25 Jahren als Modedesigner, Trendberater und Marketingexperte tätig. Mit seinen Labels war er bei internationalen Modehäusern wie Saks Fifth Avenue, Bloomingdale’s und Harrods vertreten und arbeitete mit Unternehmen wie der OTTO Group, C&A und MADELEINE zusammen.\n\nHeute verbindet er Design, Trendforschung, Marketing und digitale 3D-Welten. Er ist Gründer und Geschäftsführer der Hamburger ICOS – international concepts of style GmbH sowie Initiator von NY-PAMILO TV und NY-PAMILO Virtual Catwalks.","companyLogoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/speakers%2Fspeakers-13a2a41d-82ad-49c6-ac91-c1873cd25ef2-company-logo%2F1787035952813-6c861140-0db7-4a15-a211-5681a6980ce0.jpg?alt=media&token=bc764253-66a2-449c-a34b-fed28e587819","photoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/speakers%2Fspeakers-13a2a41d-82ad-49c6-ac91-c1873cd25ef2%2F1787035968563-a444d9e6-c6cd-4fdc-8519-b99627314351.jpg?alt=media&token=cffd743d-9f74-4a3a-aa7b-5f05b2877c1d","eventIds":["event-leica-welt-2026"],"updatedAt":"2026-09-23T08:00:16.041Z"},{"id":"speakers-17eb66c1-444b-4e00-a9e9-2bd401f65523","lastName":"Gloning","vita":"**Julia Gloning** ist Director Business Development DACH bei Utiq und verantwortet dort seit März 2026 den weiteren Ausbau der Geschäftsaktivitäten im deutschsprachigen Raum. Bereits seit 2023 ist sie für Utiq tätig und war zuvor als Head of Media Services für die Entwicklung und Betreuung von Medien- und Publisher-Partnerschaften zuständig.\n\nSie verfügt über langjährige Erfahrung in den Bereichen digitale Vermarktung, Programmatic Advertising, Publisher Services, CTV, Video, Display und Native Advertising. Vor ihrem Wechsel zu Utiq war Julia Gloning bei Yahoo tätig, zuletzt als Head of Yahoo Publisher Services Northern Europe. In dieser Funktion verantwortete sie das Programmatic Publisher Supply Management für Märkte wie Deutschland, Großbritannien und die nordischen Länder und arbeitete eng mit Premium-Publishern sowie Vermarktungspartnern zusammen.\n\nWeitere berufliche Stationen führten sie zu Verizon Media und Oath. Dort war sie unter anderem für den Aufbau und die Weiterentwicklung von Publisher- und Content-Partnerschaften sowie für die Monetarisierung digitaler Video-, Display- und Native-Angebote verantwortlich. Bereits bei Yahoo betreute sie zuvor als Senior Partner Manager die Gewinnung und technische Anbindung neuer Publisher und unterstützte deren digitale Vermarktungsstrategien.\n\nDurch ihre langjährige Tätigkeit an der Schnittstelle zwischen Medien, Technologie und digitaler Werbung verfügt Julia Gloning über umfassende Erfahrung im Aufbau nachhaltiger Publisher-Beziehungen, in der Entwicklung neuer Vermarktungsmodelle und in der Weiterentwicklung datenbasierter Werbelösungen.\n","company":"Utiq SA/NV","website":"https://utiq.com/","longBio":"**Julia Gloning** ist Director Business Development DACH bei Utiq und verantwortet dort seit März 2026 den weiteren Ausbau der Geschäftsaktivitäten im deutschsprachigen Raum. Bereits seit 2023 ist sie für Utiq tätig und war zuvor als Head of Media Services für die Entwicklung und Betreuung von Medien- und Publisher-Partnerschaften zuständig.\n\nSie verfügt über langjährige Erfahrung in den Bereichen digitale Vermarktung, Programmatic Advertising, Publisher Services, CTV, Video, Display und Native Advertising. Vor ihrem Wechsel zu Utiq war Julia Gloning bei Yahoo tätig, zuletzt als Head of Yahoo Publisher Services Northern Europe. In dieser Funktion verantwortete sie das Programmatic Publisher Supply Management für Märkte wie Deutschland, Großbritannien und die nordischen Länder und arbeitete eng mit Premium-Publishern sowie Vermarktungspartnern zusammen.\n\nWeitere berufliche Stationen führten sie zu Verizon Media und Oath. Dort war sie unter anderem für den Aufbau und die Weiterentwicklung von Publisher- und Content-Partnerschaften sowie für die Monetarisierung digitaler Video-, Display- und Native-Angebote verantwortlich. Bereits bei Yahoo betreute sie zuvor als Senior Partner Manager die Gewinnung und technische Anbindung neuer Publisher und unterstützte deren digitale Vermarktungsstrategien.\n\nDurch ihre langjährige Tätigkeit an der Schnittstelle zwischen Medien, Technologie und digitaler Werbung verfügt Julia Gloning über umfassende Erfahrung im Aufbau nachhaltiger Publisher-Beziehungen, in der Entwicklung neuer Vermarktungsmodelle und in der Weiterentwicklung datenbasierter Werbelösungen.\n","visibility":"public","eventIds":["event-archive-63"],"firstName":"Julia","topicId":"topics-f0a8723e-d11b-4dc4-ace5-3cb37f1c62eb","name":"Julia Gloning","shortBio":"**Julia Gloning** ist Director Business Development DACH bei Utiq und verantwortet dort seit März 2026 den Ausbau der Geschäftsaktivitäten im deutschsprachigen Markt. Zuvor war sie bei Utiq als Head of Media Services tätig.\n\nSie verfügt über langjährige Erfahrung in den Bereichen Programmatic Advertising, Publisher-Vermarktung, CTV, Video, Display und Native Advertising. Frühere Stationen führten sie unter anderem zu Yahoo, Verizon Media und Oath, wo sie verschiedene leitende Funktionen im Publisher- und Business-Development-Umfeld übernahm.\n","topicIds":["topics-f0a8723e-d11b-4dc4-ace5-3cb37f1c62eb"],"position":"Director Business Development DACH","status":"published","thumbnailMediaAssetId":"media-asset-9d4432d1-9398-454c-b29a-c6496d3a8eac","thumbnail_media_asset_id":"media-asset-9d4432d1-9398-454c-b29a-c6496d3a8eac","photoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/speakers%2Fspeakers-17eb66c1-444b-4e00-a9e9-2bd401f65523%2F1790169797817-19411bef-eb5b-428a-b97d-f1426bbb7bf5.webp?alt=media&token=46b9c907-cdf5-4f79-bec6-ad787c7986dd","mediaAssetId":"media-asset-9d4432d1-9398-454c-b29a-c6496d3a8eac","updatedAt":"2026-09-23T16:41:47.162Z"},{"id":"speakers-258a7f87-007f-49e9-83a5-c5f71bccb033","lastName":"Schmittmann","longBio":"","visibility":"public","firstName":"Michael","topicId":"topics-63a7e03c-d2e5-42cb-b3e6-49daf4877ca3","vita":"","name":"Michael Schmittmann","status":"published","thumbnail_url":"/assets/official/board/michael-schmittmann.jpg","assetUrl":"/assets/official/board/michael-schmittmann.jpg","thumbnailUrl":"/assets/official/board/michael-schmittmann.jpg","thumbnailMediaAssetId":"media-asset-2fa77cd8-c159-40ae-8aa6-c71f6d862117","thumbnail_media_asset_id":"media-asset-2fa77cd8-c159-40ae-8aa6-c71f6d862117","photoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/speakers%2Fspeakers-258a7f87-007f-49e9-83a5-c5f71bccb033%2F1788167528473-5d06656c-42b0-4f1b-b50e-499ecf34644c.webp?alt=media&token=0ca78f1b-35d6-419b-bc81-84f8e8fca869","mediaAssetId":"media-asset-2fa77cd8-c159-40ae-8aa6-c71f6d862117","website":"https://www.heuking.de/de/home.html","topicIds":["topics-63a7e03c-d2e5-42cb-b3e6-49daf4877ca3","topics-bc392b40-caf1-47b5-b858-7992b0b8fd86"],"eventIds":["event-archive-63","event-c5082f22-057b-44b4-8d50-8ccf3421f459"],"shortBio":"Michael Schmittmann ist 1989 als Rechtsanwalt zugelassen und ist seit vielen Jahren Partner bei HEUKING in Düsseldorf. Von 2004 bis 2021 leitete er dort die Praxisgruppe IP, Media & Technology. Zuvor war er unter anderem bei PricewaterhouseCoopers Veltins als e-business Network Leader von Landwell tätig und arbeitete auch in Brüssel. Seine berufliche Laufbahn nach Studium in Köln, Genf, Washington und London und den beiden Staatsexamen in NRW und Baden-Württemberg als Consultant der EG-Kommission in Brüssel (Harmonisierung im Rundfunkrecht). Von 2001 bis 2016 war er zudem Lehrbeauftragter an der Juristischen Fakultät der Universität Hannover mit Schwerpunkt europäisches Kommunikationsrecht. Spezialisierung in Medien-, IT- und Glücksspielrecht.","company":"HEUKING","linkedIn":"https://de.linkedin.com/company/heuking-kuhn-luer-wojtek","position":"Rechtsanwalt / Partner","updatedAt":"2026-09-25T13:40:55.836Z"},{"id":"speakers-278f6d39-6322-4279-8a16-2f1b04109c22","lastName":"Gerhard","thumbnail_media_asset_id":"media-asset-a950582b-da68-492f-8eab-12956857edca","mediaAssetId":"media-asset-a950582b-da68-492f-8eab-12956857edca","photoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/speakers%2Fspeakers-278f6d39-6322-4279-8a16-2f1b04109c22%2F1789640457941-3556180d-a324-4239-8660-2f1a49883058.webp?alt=media&token=25add866-24de-4d1b-ab09-0510f82e5bcc","company":"Sport 1 GmbH","thumbnailMediaAssetId":"media-asset-a950582b-da68-492f-8eab-12956857edca","visibility":"public","firstName":"Andreas","name":"Andreas Gerhard","position":"Chief Content & Distribution Officer","status":"published","website":"https://www.sport1.de/","longBio":"Andreas Gerhardt ist seit 2016 bei SPORT1 tätig und seit Juni 2025 Chief Content & Distribution Officer. In dieser Funktion verantwortet er die Bereiche Content, Distribution, Produktion, Licensing sowie Regulatory und Public Affairs. Zuvor leitete er bei SPORT1 über mehrere Jahre die Distribution der TV- und digitalen Angebote.\n\nDer Rechtsanwalt verfügt über langjährige Erfahrung an der Schnittstelle von Medien, Sport, Recht und Distribution. Von 2023 bis 2025 war er zudem Geschäftsführer der Match IQ GmbH. Darüber hinaus ist er Lehrbeauftragter für Urheber- und Medienrecht an der Hochschule für angewandtes Management und engagiert sich in verschiedenen Branchen- und Fachgremien.","vita":"Andreas Gerhardt ist seit 2016 bei SPORT1 tätig und seit Juni 2025 Chief Content & Distribution Officer. In dieser Funktion verantwortet er die Bereiche Content, Distribution, Produktion, Licensing sowie Regulatory und Public Affairs. Zuvor leitete er bei SPORT1 über mehrere Jahre die Distribution der TV- und digitalen Angebote.\n\nDer Rechtsanwalt verfügt über langjährige Erfahrung an der Schnittstelle von Medien, Sport, Recht und Distribution. Von 2023 bis 2025 war er zudem Geschäftsführer der Match IQ GmbH. Darüber hinaus ist er Lehrbeauftragter für Urheber- und Medienrecht an der Hochschule für angewandtes Management und engagiert sich in verschiedenen Branchen- und Fachgremien.","shortBio":"Andreas Gerhardt ist seit 2016 bei SPORT1 tätig und seit Juni 2025 Chief Content & Distribution Officer. Er verantwortet unter anderem Content, Distribution, Produktion, Licensing sowie regulatorische und Public-Affairs-Themen. Zudem ist er Rechtsanwalt und Lehrbeauftragter für Urheber- und Medienrecht an der Hochschule für angewandtes Management.","linkedIn":"","topicId":"topics-527a7339-d174-4a41-9282-9f9190bac80d","topicIds":["topics-527a7339-d174-4a41-9282-9f9190bac80d"],"eventIds":["event-archive-63"],"updatedAt":"2026-09-28T08:03:02.613Z"},{"id":"speakers-497de429-fc6a-4969-89d1-af8a180be1c2","lastName":"Baumgartner","vita":"Hansjörg Baumgarzner verfügt über mehr als 30 Jahre Erfahrung in der Fernseh-, Broadcast- und Produktionsbranche. Seit Januar 2026 ist er bei DMC Production als Director Production Services and Customer Relations tätig.\n\nZuvor war er über 27 Jahre bei PLAZAMEDIA in verschiedenen leitenden Funktionen beschäftigt. Dort verantwortete er unter anderem die Bereiche Studioproduktion, Broadcast Operations, Project Management sowie Production Services und Customer Relations.\n\nSeine berufliche Laufbahn begann Anfang der 1990er-Jahre als Aufnahmeleiter bei Tele 5, PLAZAMEDIA und dem Deutschen SportFernsehen (DSF). Durch seine langjährige Tätigkeit verbindet er umfassende operative Produktionserfahrung mit Management-, Kunden- und Projektkompetenz im professionellen Broadcast- und Live-Produktionsumfeld.","company":"DMC Production Germany GmbH","website":"https://www.dmcproduction.com/","longBio":"Hansjörg Baumgarzner verfügt über mehr als 30 Jahre Erfahrung in der Fernseh-, Broadcast- und Produktionsbranche. Seit Januar 2026 ist er bei DMC Production als Director Production Services and Customer Relations tätig.\n\nZuvor war er über 27 Jahre bei PLAZAMEDIA in verschiedenen leitenden Funktionen beschäftigt. Dort verantwortete er unter anderem die Bereiche Studioproduktion, Broadcast Operations, Project Management sowie Production Services und Customer Relations.\n\nSeine berufliche Laufbahn begann Anfang der 1990er-Jahre als Aufnahmeleiter bei Tele 5, PLAZAMEDIA und dem Deutschen SportFernsehen (DSF). Durch seine langjährige Tätigkeit verbindet er umfassende operative Produktionserfahrung mit Management-, Kunden- und Projektkompetenz im professionellen Broadcast- und Live-Produktionsumfeld.","visibility":"public","eventIds":["event-archive-63"],"firstName":"Hansjörg","name":"Hansjörg Baumgartner","shortBio":"Hansjörg Baumgarzner verfügt über mehr als 30 Jahre Erfahrung in der TV-, Broadcast- und Produktionsbranche. Seit Januar 2026 ist er Director Production Services and Customer Relations bei DMC Production. Zuvor war er über 27 Jahre bei PLAZAMEDIA in leitenden Funktionen tätig.","position":"","status":"published","thumbnailMediaAssetId":"media-asset-a513902b-22c6-4653-88fc-821eccb6aba1","thumbnail_media_asset_id":"media-asset-a513902b-22c6-4653-88fc-821eccb6aba1","photoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/speakers%2Fspeakers-497de429-fc6a-4969-89d1-af8a180be1c2%2F1789638480597-1dfa27d8-9e8a-4113-9fee-261630d56bd0.webp?alt=media&token=0e1d6f7e-e311-4262-95e3-60b5fa9c69b5","mediaAssetId":"media-asset-a513902b-22c6-4653-88fc-821eccb6aba1","topicId":"","topicIds":[],"linkedIn":"","updatedAt":"2026-09-22T12:23:24.703Z"},{"id":"speakers-914d40aa-6b45-49b6-bd89-fd128cd9633b","lastName":"Grill","thumbnail_media_asset_id":"media-asset-dadf5b31-35b0-4d1f-989c-55ea5067eaed","mediaAssetId":"media-asset-dadf5b31-35b0-4d1f-989c-55ea5067eaed","photoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/speakers%2Fspeakers-914d40aa-6b45-49b6-bd89-fd128cd9633b%2F1789986385426-1aa68077-03bf-47d5-a433-d3666e7bb0da.webp?alt=media&token=9ad141fc-1ef7-4d57-830e-88622e764955","vita":"**Norbert Grill** ist ein erfahrener Medien- und Technologiemanager mit langjähriger Expertise in den Bereichen Broadcast, digitale Medien, OTT und technische Transformation.\n\nSeit September 2025 ist er **Chief Technology Officer der Big Blue Marble Group** in Wien. Darüber hinaus ist er **Geschäftsführer der ORS Group (Austrian Broadcasting Services) in Wien**, die er seit 2008 maßgeblich mitprägt. In dieser Funktion verantwortet er unter anderem strategische Technologieentwicklung, Broadcast-Infrastrukturen, digitale Medienlösungen und neue Distributionswege.\n\nSeine berufliche Laufbahn im Medienbereich begann beim **ORF**, wo er von 1999 bis 2004 als Projektmanager unter anderem am Aufbau des DVB-Satellitensystems mit Encoding, Multiplexing und Conditional-Access-Systemen beteiligt war. Zuvor arbeitete er als Projektmanager und Teamleiter für Elektrotechnik bei Andritz.\n\nNorbert Grill studierte **Automatisierungstechnik an der Technischen Universität Wien**. Seine fachlichen Schwerpunkte liegen insbesondere an der Schnittstelle von klassischem Broadcast, OTT, digitalen Plattformen, Innovation und strategischem Technologiemanagement.\n","thumbnailMediaAssetId":"media-asset-dadf5b31-35b0-4d1f-989c-55ea5067eaed","website":"https://www.bigbluemarble.com/","visibility":"public","eventIds":["event-archive-63"],"firstName":"Norbert","name":"Norbert Grill","position":"Geschäftsführer","topicId":"topics-0b780394-21e0-4d72-9f3e-b3e7b50ab3dc","topicIds":["topics-0b780394-21e0-4d72-9f3e-b3e7b50ab3dc"],"status":"published","longBio":"**Norbert Grill** ist ein erfahrener Medien- und Technologiemanager mit langjähriger Expertise in den Bereichen Broadcast, digitale Medien, OTT und technische Transformation.\n\nSeit September 2025 ist er **Chief Technology Officer der Big Blue Marble Group** in Wien. Darüber hinaus ist er **Geschäftsführer der ORS Group (Austrian Broadcasting Services) in Wien**, die er seit 2008 maßgeblich mitprägt. In dieser Funktion verantwortet er unter anderem strategische Technologieentwicklung, Broadcast-Infrastrukturen, digitale Medienlösungen und neue Distributionswege.\n\nSeine berufliche Laufbahn im Medienbereich begann beim **ORF**, wo er von 1999 bis 2004 als Projektmanager unter anderem am Aufbau des DVB-Satellitensystems mit Encoding, Multiplexing und Conditional-Access-Systemen beteiligt war. Zuvor arbeitete er als Projektmanager und Teamleiter für Elektrotechnik bei Andritz.\n\nNorbert Grill studierte **Automatisierungstechnik an der Technischen Universität Wien**. Seine fachlichen Schwerpunkte liegen insbesondere an der Schnittstelle von klassischem Broadcast, OTT, digitalen Plattformen, Innovation und strategischem Technologiemanagement.","shortBio":"**Norbert Grill** ist ein erfahrener Medien- und Technologiemanager mit Schwerpunkten in Broadcast, digitalen Medien und OTT.\n\nSeit September 2025 ist er **Chief Technology Officer der Big Blue Marble Group** in Wien. Zudem ist er **Geschäftsführer der ORS Group (Austrian Broadcasting Services)**, die er seit 2008 maßgeblich mitgestaltet.\n\nZuvor war er beim **ORF** als Projektmanager unter anderem am Aufbau des DVB-Satellitensystems beteiligt. Norbert Grill studierte **Automatisierungstechnik an der Technischen Universität Wien**.","company":"Big Blue Marble","linkedIn":"","updatedAt":"2026-09-23T13:40:20.011Z"},{"id":"speakers-b2f60ad4-4306-4e06-9ca8-98771d77435b","lastName":"Grundmann","vita":"Dr. Melanie Grundmann ist Teamlead Product Strategy & Partnerships bei FUNKE in Berlin. Sie verfügt über langjährige Erfahrung an der Schnittstelle von Medien, Technologie, Content und digitalen Plattformen. Seit 2022 ist sie bei FUNKE tätig und verantwortete zunächst als Senior Content Managerin den Aufbau und die Weiterentwicklung der FUNKE Channels. Anschließend betreute sie als Senior Partnership Managerin insbesondere die Distribution und Weiterentwicklung von FAST-Channels auf Plattformen wie Samsung TV Plus, Rakuten TV und LG Channels. Seit März 2026 leitet sie den Ber aming-Infrastrukturen als Alternative zu einer vollständigen Abhängigkeit von internationalen Hyperscalern vor. Er erläuterte, wie Medienunternehmen durch flexible technische Architekturen mehr Kontrolle über ihre Inhalte, Daten und Distributionswege gewinnen können.\n\nIm Mittelpunkt standen die digitale Souveränität, transparente Kostenstrukturen und die Möglichkeit, unterschiedliche Infrastrukturpartner miteinander zu kombinieren. Durch offene und anpassbare Systeme können Unternehmen ihre Streaming-Angebote gezielter skalieren und Abhängigkeiten von einzelnen Plattform- oder Cloudanbietern reduzieren.\n\nDer Vortrag machte deutlich, dass technologische Unabhängigkeit zunehmend auch zu einer strategischen und wirtschaftlichen Frage für Medienunternehmen wird.","shortBio":"Der CCO der 3Q GmbH zeigte, wie Medienunternehmen ihre Streaming-Infrastruktur unabhängiger, kontrollierbarer und wirtschaftlicher gestalten können.","updatedAt":"2026-09-23T08:00:16.041Z"},{"id":"speakers-c23e4d5d-2474-43bb-8426-d4f9ff0afcc9","firstName":"Dr. Albrecht","eventIds":["event-archive-63"],"lastName":"Bischoffshausen","name":"Dr. Albrecht Bischoffshausen","visibility":"public","topicId":"topics-63a7e03c-d2e5-42cb-b3e6-49daf4877ca3","topicIds":["topics-63a7e03c-d2e5-42cb-b3e6-49daf4877ca3"],"company":"VFF Verwertungsgesellschaft der Film- und Fernsehproduzenten mbH","position":"Geschäftsführer","longBio":"Albrecht Bischoffshausen ist seit April 2024 Geschäftsführer der VFF Verwertungsgesellschaft der Film- und Fernsehproduzenten mbH in München. Zuvor leitete er bei der ARD die Koordination Ausland und Festivals beziehungsweise International Relations. Weitere Stationen waren die WDR mediagroup, wo er für die internationale Kabelkoordination der ARD verantwortlich war, sowie die GEMA als Legal Counsel. Seit 2011 ist er zudem als Rechtsanwalt tätig. Seine Schwerpunkte liegen im Medien-, Urheber- und Verwertungsrecht sowie in internationalen Medienbeziehungen.","companyLogoUrl":"https:// ologie. Seit den frühen 1990er-Jahren gestaltet er inspirierende Projekte vom Film über  Medienproduktion bis hin zu Games.\n\nAls Mitgründer der Vertical Minds gestaltet er mit unerschöpflicher Neugier, einem interdisziplinären Blick und der Fähigkeit, Trends in echte Lösungen zu verwandeln, das das Medium von morgen – dem Vertical Drama.","vita":"Chriz Merkl ist ein kreativer Visionär an der Schnittstelle von Medien und Technologie. Seit den frühen 1990er-Jahren gestaltet er inspirierende Projekte vom Film über  Medienproduktion bis hin zu Games.\n\nAls Mitgründer der Vertical Minds gestaltet er mit unerschöpflicher Neugier, einem interdisziplinären Blick und der Fähigkeit, Trends in echte Lösungen zu verwandeln, das das Medium von morgen – dem Vertical Drama.","shortBio":"Chriz Merkl ist ein kreativer Visionär an der Schnittstelle von Medien und Technologie. Seit den frühen 1990er-Jahren gestaltet er inspirierende Projekte vom Film über  Medienproduktion bis hin zu Games.\n\nAls Mitgründer der Vertical Minds gestaltet er mit unerschöpflicher Neugier, einem interdisziplinären Blick und der Fähigkeit, Trends in echte Lösungen zu verwandeln, das das Medium von morgen – dem Vertical Drama.","updatedAt":"2026-09-23T08:00:16.041Z"},{"id":"speakers-dirk-engel","lastName":"Engel","visibility":"public","firstName":"Dirk","topicId":"leica-2026-dirk-engel-posthumanes-marketing","name":"Dirk Engel","topicIds":["leica-2026-dirk-engel-posthumanes-marketing"],"position":"Markt- und Mediaforscher","status":"published","eventIds":["event-leica-welt-2026"],"website":"https://kunden-wissen.de/ueber-dirk-engel/","longBio":"Geboren 1969 in Gießen, lebt Dirk Engel Frankfurt am Main und ist freiberuflicher Dozent, Fachautor, Markt- und Mediaforscher. Entsprechend seines Credos „Wissen, was Kunden wollen“  bietet er Seminare, Vorträge, Beratung und Marktforschung an. Seine Arbeit und sein Leistungsportfolio finden Sie auf der Website kundenwissen.com\n\nBei vielen deutschen und internationalen Branchen-Veranstaltungen und Kongressen trat Dirk Engel als Referent oder Keynote-Speaker auf. Eine Liste seiner Vorträge finden Sie hier…\n\nVon 1996 bis 2011 arbeitete er als Mediaforscher und Marktforscher bei der internationalen Media-Agentur Universal McCann. Dort betreute er Werbungtreibende bei Zielgruppenanalysen, Mediaforschung und Werbewirkungsforschung (u.a. Microsoft, Media Markt, BASF, Beck’s, MasterCard). Dabei kennt er sich mit allen Arten der Markt- und Sozialforschung aus – Desktop Research und Primärstudien, qualitative und quantitative Methoden, große Projekte und schnelle Ad-hoc-Studien, nationale und internationale Studien. Er betreute von 2001 bis 2002 internationale Studien bei UM Worldgroup in London und betreibt seit 1998 Online-Research.\n\nSeine berufliche Laufbahn begann als Lokaljournalist beim Wiesbadner Kurier. Dirk Engel studierte Kommunikationswissenschaft, Psychologie und Soziologie an der Johannes Gutenberg-Universität Mainz. Außerdem absolvierte er ein Nachdiplomstudiengang Betriebswirtschaft und Marketing (Universität Basel).\n\nDaneben ist und war er Dozent und Lehrbeauftragter an verschiedenen Hochschulen und Weiterbildungs-Instituten. Er unterrichtete zwei Jahrzehnte an der Akademie für Marketing-Kommunikation in Frankfurt am Main und mehrere Jahre am Institut für Publizistik der Johannes Gutenberg-Universität Mainz. Derzeit ist er Lehrbeauftragter für Medienwissenschaft und Kommunikationswissenschaft an der Media University of Applied Sciences in Frankfurt.\n\nEr ist Mitglied der Deutschen Gesellschaft für Publizistik und Kommunikationswissenschaft (DGPuK), der Werbewissenschaftlichen Gesellschaft (DWG) und der internationalen Marktforschungs-Organisation ESOMAR. Weitere Mitgliedschaften: Berufsverband der Markt- und Sozialforscher (BVM), Deutsche Gesellschaft für Online-Forschung (DGOF), Nürnberg Institut für Marktentscheidungen (NIM). Als Jury-Mitglied entscheidet er mit beim Real Impact Award (vergeben von der Fachzeitschrift HORIZONT) und dem Deutschen Prospekt Award (vergeben vom BVDA).\n\nDirk Engel ist Co-Autor (neben Holger Fischer) des Buches „Hybrides Arbeiten und Lernen in virtuellen Welten„. Zusammen mit Michael Hofsäss schrieb er das „Praxishandbuch Mediaplanung“. Außerdem verfasste er viele Buchbeiträge und veröffentlicht regelmäßig in verschiedenen Fachzeitschriften, allen voran dem führenden Magazin zum Thema Marktforschung, Planung & Analyse. Eine Liste seiner Veröffentlichungen findet sich hier…\n\nAußerdem ist Dirk Engel Mitglied im Frankfurter Debattier-Club „Vaevictis“ und Mitorganisator des Debatten-Duells in der Romanfabrik.","vita":"Geboren 1969 in Gießen, lebt Dirk Engel Frankfurt am Main und ist freiberuflicher Dozent, Fachautor, Markt- und Mediaforscher. Entsprechend seines Credos „Wissen, was Kunden wollen“  bietet er Seminare, Vorträge, Beratung und Marktforschung an. Seine Arbeit und sein Leistungsportfolio finden Sie auf der Website kundenwissen.com\n\nBei vielen deutschen und internationalen Branchen-Veranstaltungen und Kongressen trat Dirk Engel als Referent oder Keynote-Speaker auf. Eine Liste seiner Vorträge finden Sie hier…\n\nVon 1996 bis 2011 arbeitete er als Mediaforscher und Marktforscher bei der internationalen Media-Agentur Universal McCann. Dort betreute er Werbungtreibende bei Zielgruppenanalysen, Mediaforschung und Werbewirkungsforschung (u.a. Microsoft, Media Markt, BASF, Beck’s, MasterCard). Dabei kennt er sich mit allen Arten der Markt- und Sozialforschung aus – Desktop Research und Primärstudien, qualitative und quantitative Methoden, große Projekte und schnelle Ad-hoc-Studien, nationale und internationale Studien. Er betreute von 2001 bis 2002 internationale Studien bei UM Worldgroup in London und betreibt seit 1998 Online-Research.\n\nSeine berufliche Laufbahn begann als Lokaljournalist beim Wiesbadner Kurier. Dirk Engel studierte Kommunikationswissenschaft, Psychologie und Soziologie an der Johannes Gutenberg-Universität Mainz. Außerdem absolvierte er ein Nachdiplomstudiengang Betriebswirtschaft und Marketing (Universität Basel).\n\nDaneben ist und war er Dozent und Lehrbeauftragter an verschiedenen Hochschulen und Weiterbildungs-Instituten. Er unterrichtete zwei Jahrzehnte an der Akademie für Marketing-Kommunikation in Frankfurt am Main und mehrere Jahre am Institut für Publizistik der Johannes Gutenberg-Universität Mainz. Derzeit ist er Lehrbeauftragter für Medienwissenschaft und Kommunikationswissenschaft an der Media University of Applied Sciences in Frankfurt.\n\nEr ist Mitglied der Deutschen Gesellschaft für Publizistik und Kommunikationswissenschaft (DGPuK), der Werbewissenschaftlichen Gesellschaft (DWG) und der internationalen Marktforschungs-Organisation ESOMAR. Weitere Mitgliedschaften: Berufsverband der Markt- und Sozialforscher (BVM), Deutsche Gesellschaft für Online-Forschung (DGOF), Nürnberg Institut für Marktentscheidungen (NIM). Als Jury-Mitglied entscheidet er mit beim Real Impact Award (vergeben von der Fachzeitschrift HORIZONT) und dem Deutschen Prospekt Award (vergeben vom BVDA).\n\nDirk Engel ist Co-Autor (neben Holger Fischer) des Buches „Hybrides Arbeiten und Lernen in virtuellen Welten„. Zusammen mit Michael Hofsäss schrieb er das „Praxishandbuch Mediaplanung“. Außerdem verfasste er viele Buchbeiträge und veröffentlicht regelmäßig in verschiedenen Fachzeitschriften, allen voran dem führenden Magazin zum Thema Marktforschung, Planung & Analyse. Eine Liste seiner Veröffentlichungen findet sich hier…\n\nAußerdem ist Dirk Engel Mitglied im Frankfurter Debattier-Club „Vaevictis“ und Mitorganisator des Debatten-Duells in der Romanfabrik.","shortBio":"Dirk Engel, Jahrgang 1969, ist freiberuflicher Markt- und Mediaforscher, Dozent und Fachautor mit Sitz in Frankfurt am Main. Nach Stationen im Journalismus und bei der internationalen Mediaagentur Universal McCann berät er heute Unternehmen zu Zielgruppen, Markt- und Werbewirkungsforschung sowie Marketingfragen.\n\nEr ist regelmäßig als Referent und Keynote-Speaker tätig und lehrt Medien- und Kommunikationswissenschaft an der Media University of Applied Sciences in Frankfurt. Darüber hinaus ist Dirk Engel Autor und Co-Autor mehrerer Fachbücher und zahlreicher Veröffentlichungen zu Medien, Marketing und Marktforschung.","company":"Dirk Engel","thumbnailMediaAssetId":"media-asset-87f3d593-084c-477b-83d0-f775aa804b40","thumbnail_media_asset_id":"media-asset-87f3d593-084c-477b-83d0-f775aa804b40","photoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/speakers%2Fspeakers-dirk-engel%2F1787136798365-c890d201-f240-4ee4-85ca-f57091043389.webp?alt=media&token=133220ac-be1e-41d6-a458-aa1fc67c8bd7","mediaAssetId":"media-asset-87f3d593-084c-477b-83d0-f775aa804b40","companyLogoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/speakers%2Fspeakers-dirk-engel-company-logo%2F1787136823620-55ce9ee4-f1c8-4612-a73e-0cfab2bc40d7.webp?alt=media&token=481e7f0f-8a46-4179-ae64-9ac11ab9c23c","updatedAt":"2026-09-23T08:00:16.041Z"},{"id":"speakers-gregor-c-blach","lastName":"Blach","visibility":"public","eventIds":["event-berlinale-2026"],"firstName":"Gregor C.","topicId":"berlinale-2026-gregor-blach-kreativitaet-ki","name":"Gregor C. Blach","topicIds":["berlinale-2026-gregor-blach-kreativitaet-ki"],"company":"WE DO communication","position":"Gründer und Geschäftsführer","status":"published","website":"https://www.we-do.com/","photoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/speakers%2Fspeakers-gregor-c-blach%2F1786967964101-b7320a2a-dbfb-4cb7-9fdf-9815ed93f30c.jpg?alt=media&token=8154291e-91bd-4c14-96e0-6b59c1547e61","longBio":"Gregor C. Blach beschäftigte sich mit dem Zusammenspiel von menschlicher Kreativität und Künstlicher Intelligenz. Anhand aktueller Entwicklungen zeigte er, wie KI bereits bei der Erstellung von Konzepten, Texten und Bildern eingesetzt werden kann und welche neuen Möglichkeiten sich daraus für Agenturen, Unternehmen und Medienproduktionen ergeben.\n\nGleichzeitig machte er deutlich, dass kreative Qualität nicht allein durch technische Systeme entsteht. Erfahrung, Intuition, strategisches Denken und die Verantwortung für das Ergebnis bleiben zentrale menschliche Kompetenzen. Künstliche Intelligenz kann kreative Prozesse beschleunigen und erweitern, ersetzt jedoch nicht die Fähigkeit, Ideen einzuordnen, weiterzuentwickeln und zielgerichtet einzusetzen.","vita":"Gregor C. Blach beschäftigte sich mit dem Zusammenspiel von menschlicher Kreativität und Künstlicher Intelligenz. Anhand aktueller Entwicklungen zeigte er, wie KI bereits bei der Erstellung von Konzepten, Texten und Bildern eingesetzt werden kann und welche neuen Möglichkeiten sich daraus für Agenturen, Unternehmen und Medienproduktionen ergeben.\n\nGleichzeitig machte er deutlich, dass kreative Qualität nicht allein durch technische Systeme entsteht. Erfahrung, Intuition, strategisches Denken und die Verantwortung für das Ergebnis bleiben zentrale menschliche Kompetenzen. Künstliche Intelligenz kann kreative Prozesse beschleunigen und erweitern, ersetzt jedoch nicht die Fähigkeit, Ideen einzuordnen, weiterzuentwickeln und zielgerichtet einzusetzen.","shortBio":"Der Gründer und Geschäftsführer von WE DO communication zeigte, wie KI kreative Prozesse unterstützt und weshalb menschliche Erfahrung weiterhin unverzichtbar bleibt.","updatedAt":"2026-09-23T08:00:16.041Z"},{"id":"speakers-jan-bertil-dahms","lastName":"Dahms","visibility":"public","eventIds":["event-salzburg-2025"],"firstName":"Jan Bertil","topicId":"salzburg-2025-jan-bertil-dahms-go-big-or-go-small","name":"Jan Bertil Dahms","topicIds":["salzburg-2025-jan-bertil-dahms-go-big-or-go-small"],"company":"Magine Pro AB","position":"SVP Strategy & Sales","status":"published","website":"https://www.maginepro.com/","companyLogoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/s t=media&token=da0692ce-f9dc-4b7e-ac9b-c77807da1f3a","longBio":"Lennart Rümmler ist Rechtsanwalt am Münchener Standort von HEUSSEN und dort bereits seit seiner Ausbildung in der Praxisgruppe IT, IP und Medienrecht tätig.\n\nAls LL.M. (Eur) im Europäischen und internationalen Wirtschaftsrecht konnte Herr Rümmler schon früh vertiefte Kenntnisse in den relevanten Bereichen des Rechts des geistigen Eigentums entwickeln.\n\nBesonderer Fokus liegt auf der Verbindung von urheberrechtlichen Rechtsproblemen mit der modernen Kommunikationstechnologie und dem Internet.","vita":"Lennart Rümmler ist Rechtsanwalt am Münchener Standort von HEUSSEN und dort bereits seit seiner Ausbildung in der Praxisgruppe IT, IP und Medienrecht tätig.\n\nAls LL.M. (Eur) im Europäischen und internationalen Wirtschaftsrecht konnte Herr Rümmler schon früh vertiefte Kenntnisse in den relevanten Bereichen des Rechts des geistigen Eigentums entwickeln.\n\nBesonderer Fokus liegt auf der Verbindung von urheberrechtlichen Rechtsproblemen mit der modernen Kommunikationstechnologie und dem Internet.","shortBio":"Lennart Rümmler ist Rechtsanwalt am Münchener Standort von HEUSSEN und dort bereits seit seiner Ausbildung in der Praxisgruppe IT, IP und Medienrecht tätig.\n\nAls LL.M. (Eur) im Europäischen und internationalen Wirtschaftsrecht konnte Herr Rümmler schon früh vertiefte Kenntnisse in den relevanten Bereichen des Rechts des geistigen Eigentums entwickeln.\n\nBesonderer Fokus liegt auf der Verbindung von urheberrechtlichen Rechtsproblemen mit der modernen Kommunikationstechnologie und dem Internet.","website":"https://www.heussen-law.de/de/team/lennart-ruemmler","companyLogoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/speakers%2Fspeakers-lennart-ruemmler-company-logo%2F1787136636975-17b53478-8e29-4e0d-8e3d-4125a3bc0382.webp?alt=media&token=e581935c-e2c8-44a8-82fc-e31547c19e7d","topicId":"","topicIds":[],"updatedAt":"2026-09-23T08:00:16.041Z"},{"id":"speakers-marcus-hotze","lastName":"Hotze","visibility":"public","eventIds":["event-berlinale-2026"],"firstName":"Marcus","name":"Marcus Hotze","company":"HEUSSEN","position":"Rechtsanwalt","status":"published","photoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/speakers%2Fspeakers-marcus-hotze%2F1786968972581-77741a94-77ff-4cdc-8ceb-498938ce4db2.jpg?alt=media&token=c419619d-6da7-42c4-8ff9-fe7d0bb4c23d","longBio":"Fachanwalt für Urheber- und Medienrecht\n\nHerr Marcus M. Hotze ist im Berliner Büro unserer Kanzlei tätig und Mitglied der Practice Group „IT, IP & Media“.\n\nMarcus Hotze ist schwerpunktmäßig für Medien-, Entertainment- und IT-Unternehmen tätig. Er verfügt als Fachanwalt für Urheber- und Medienrecht über umfangreiche Projekterfahrung bei der Beratung national und international agierender Mandanten. Neben der wirtschaftsrechtlichen Beratung von Unternehmen bei Transaktionen sowie in lizenzrechtlichen und regulatorischen Fragestellungen ist Marcus M. Hotze Experte für das Werbe- und Vermarktungsrecht. Er berät Agenturen, werbetreibende Unternehmen, Sponsoren und namhafte Personen der Zeitgeschichte bei der Ausgestaltung ihrer Vermarktungskooperationen sowie im Äußerungsrecht. Zugleich begleitet er mittelständische Unternehmen und Start-Ups bei IT-Projekten und strukturiert Outsourcing-Aktivitäten.\n\nMarcus M. Hotze ist vielfach als Dozent in der Fort- und Weiterbildung tätig, so etwa für die Akademie der deutschen Medien, München, und die BBA - Akademie der Immobilienwirtschaft e. V., Berlin.","vita":"Fachanwalt für Urheber- und Medienrecht\n\nHerr Marcus M. Hotze ist im Berliner Büro unserer Kanzlei tätig und Mitglied der Practice Group „IT, IP & Media“.\n\nMarcus Hotze ist schwerpunktmäßig für Medien-, Entertainment- und IT-Unternehmen tätig. Er verfügt als Fachanwalt für Urheber- und Medienrecht über umfangreiche Projekterfahrung bei der Beratung national und international agierender Mandanten. Neben der wirtschaftsr odell auf Sender, Vermarkter, Mediaagenturen und werbungtreibende Unternehmen auswirken könnte. Eine stärker standardisierte und reichweitenbezogene Abrechnung kann die Vergleichbarkeit unterschiedlicher Medienangebote verbessern und neue Möglichkeiten für eine plattformübergreifende Mediaplanung schaffen.\n\nGleichzeitig entstehen Fragen hinsichtlich der Messbarkeit, der Preisentwicklung und der Bewertung unterschiedlicher Zielgruppen und Werbeumfelder. Der Vortrag zeigte, dass das neue Modell erhebliche Veränderungen für etablierte Planungs-, Einkaufs- und Abrechnungsprozesse im TV-Werbemarkt mit sich bringen kann.","vita":"Stefan Uhl beschäftigte sich mit dem von der AdAlliance angekündigten neuen Pricing-Modell für lineare Fernsehwerbung. Im Mittelpunkt stand der geplante stärkere Übergang zu einer leistungsbezogenen Abrechnung auf Grundlage des Tausend-Kontakt-Preises.\n\nEr erläuterte, wie sich ein solches Modell auf Sender, Vermarkter, Mediaagenturen und werbungtreibende Unternehmen auswirken könnte. Eine stärker standardisierte und reichweitenbezogene Abrechnung kann die Vergleichbarkeit unterschiedlicher Medienangebote verbessern und neue Möglichkeiten für eine plattformübergreifende Mediaplanung schaffen.\n\nGleichzeitig entstehen Fragen hinsichtlich der Messbarkeit, der Preisentwicklung und der Bewertung unterschiedlicher Zielgruppen und Werbeumfelder. Der Vortrag zeigte, dass das neue Modell erhebliche Veränderungen für etablierte Planungs-, Einkaufs- und Abrechnungsprozesse im TV-Werbemarkt mit sich bringen kann.","shortBio":"Der Geschäftsführer D-A-CH der Advise Media Consulting GmbH analysierte die Chancen und Risiken einer TKP-basierten Leistungsabrechnung im TV-Werbemarkt.","updatedAt":"2026-09-23T08:00:16.041Z"},{"id":"speakers-thomas-schneider-trumpp","lastName":"Schneider-Trumpp","visibility":"public","firstName":"Thomas","topicId":"leica-2026-thomas-schneider-trumpp-international-vermarktung","name":"Thomas Schneider-Trumpp","topicIds":["leica-2 ":true,"accessType":"public","allowMemberRegistration":false,"visibility":"public","displayDate":"Keine Datumsangabe im Quellarchiv","updated_at":"2026-06-23T08:11:57.876Z","locationName":"Heuking Rechtsanwalt Kanzlei","city":"München","eventType":"Medienfrühstück","title":"Medienfrühstück bei HEUKING in München","subtitle":"","sponsorIds":["sponsors-3757c291-f273-4c13-866c-59d6e0abd9ac"],"hostId":"sponsors-3757c291-f273-4c13-866c-59d6e0abd9ac","imageUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fuploads%2FQERO%2Fprodigitaltv-bild_QERO_upload_4x3_v1.png?alt=media&token=537ddbc0-f42b-4785-8160-6795793be617","thumbnail_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fuploads%2FQERO%2Fprodigitaltv-bild_QERO_upload_4x3_v1.png?alt=media&token=537ddbc0-f42b-4785-8160-6795793be617","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fuploads%2FQERO%2Fprodigitaltv-bild_QERO_upload_4x3_v1.png?alt=media&token=537ddbc0-f42b-4785-8160-6795793be617","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fuploads%2FQERO%2Fprodigitaltv-bild_QERO_upload_4x3_v1.png?alt=media&token=537ddbc0-f42b-4785-8160-6795793be617","startTime":"09:30","endTime":"15:00","thumbnailMediaAssetId":"asset-events-event-archive-63","thumbnail_media_asset_id":"asset-events-event-archive-63","mediaAssetId":"asset-events-event-archive-63","date":"2026-10-23","address":"Prinzregentenstraße 48","postalCode":"80538","longDescription":"","archiveText":"","bodyText":"","postEventSummary":"","articleText":"","postEventummary":"","descriptionMode":"complete","visible":true,"registrationEnabled":true,"registrationStatus":"open","lifecyclePhase":"registration_open","registration_state":"open","preStatus":"invitation_published","allowPublicRegistration":true,"status":"active","description":"Am 23. Oktober 2026 lädt PROdigitalTV von 9:30 bis 15:00 Uhr zum Medienfrühstück in die Kanzlei HEUKING in München ein. Die Veranstaltung richtet sich an Fach- und Führungskräfte der digitalen Medienwirtschaft und bietet eine Plattform, um aktuelle Entwicklungen in den Bereichen Medienrecht, Streaming, TV-Produktion und Content-Distribution zu erörtern. Gastgeber HEUKING schafft den Rahmen für einen intensiven Austausch, der Chancen und Herausforderungen der sich wandelnden Medienlandschaft in den Mittelpunkt stellt.\n\nMichael Schmittmann von Ra Heuking thematisiert in seinem Vortrag „Der neue Tarif der Münchner Gruppe für Direkteinspeisung von Fast Channels nach §20d UrhG“ die rechtlichen Rahmenbedingungen, die für Sender und Plattformbetreiber zunehmend an Bedeutung gewinnen. Dabei wird er von Nikolaus Sommer von der Gema als Co-Referent unterstützt, der die Diskussion mit fachlicher Expertise ergänzt.\n\nDr. Melanie Grundmann von FUNKE Digital GmbH beleuchtet unter dem Titel „Vom Playout auf die Plattform: Was einen FAST Channel wirklich distributionsfähig macht“, wie sich klassische Distributionsstrukturen verändern und welche Potenziale plattformbasierte Modelle für die effiziente Verbreitung von Inhalten eröffnen.\n\nInnovative Produktionsansätze stellt Hansjörg Baumgartner von DMC Production Germany GmbH vor. In „Die TV-Produktion der Zukunft: Remote, softwarebasiert und KI-gestützt“ zeigt er auf, wie technologische Fortschritte Produktionsprozesse flexibler und effizienter gestalten.\n\nNorbert Grill von Big Blue Marble widmet sich dem Thema „C2PA – Vertrauen in digitale Inhalte stärken“ und erläutert, wie der C2PA-Standard Manipulationen entgegenwirken und die Authentizität digitaler Medieninhalte sichern kann.\n\nAbschließend präsentiert Julia Gloning von Utiq SA/NV mit „Adressierbare Werbung ohne Third-Party-Cookies – der Utiq-Ansatz“ neue Möglichkeiten für zielgerichtete Werbung in einer zunehmend datenschutzbewussten Medienwelt.\n\nDas Medienfrühstück bei HEUKING verspricht somit vielfältige Einblicke in aktuelle Trends und Herausforderungen der digitalen Medienbranche. Interessierte sind eingeladen, sich frühzeitig anzumelden, um an diesem wichtigen Branchentreffen in München teilzunehmen.\n\nKeywords: Medienrecht, Streaming, TV-Produktion, Content-Distribution","topicIds":["topics-63a7e03c-d2e5-42cb-b3e6-49daf4877ca3","topics-1fc49fa9-483f-4961-a281-a0104716dcec","topics-ca341066-3730-492b-ae9b-256f3acdc9ee","topics-0b780394-21e0-4d72-9f3e-b3e7b50ab3dc","topics-f0a8723e-d11b-4dc4-ace5-3cb37f1c62eb","topics-527a7339-d174-4a41-9282-9f9190bac80d"],"speakerIds":["speakers-258a7f87-007f-49e9-83a5-c5f71bccb033","speakers-b2f60ad4-4306-4e06-9ca8-98771d77435b","speakers-497de429-fc6a-4969-89d1-af8a180be1c2","speakers-914d40aa-6b45-49b6-bd89-fd128cd9633b","speakers-b427d653-d473-4e8f-b00f-904e3afc1214","speakers-17eb66c1-444b-4e00-a9e9-2bd401f65523","speakers-278f6d39-6322-4279-8a16-2f1b04109c22","speakers-c23e4d5d-2474-43bb-8426-d4f9ff0afcc9"],"scheduleText":"09:00 | Einlass | Empfang, Registrierung und Ankommen\n09:30 | Beate Busch / M. Schmidtmann | Begruessung durch PROdigitalTV und organisatorische Hinweise\n09:40 | Norbert Grill | C2PA – Vertrauen in digitale Inhalte stärken\n10:00 | Dr. Albrecht Bischoffshausen | Der neue Tarif der Münchner Gruppe für Direkteinspeisung von Fast Channels nach §20d UrhG\n10:30 | Pause | Austausch und Networking\n10:50 | Dr. Melanie Grundmann | Vom Playout auf die Plattform:\n11:20 | Hansjörg Baumgartner | Die TV-Produktion der Zukunft: Remote, softwarebasiert und KI-gestützt\n11:50 | Pause | Laengere Pause, Lunch oder Networking\n12:50 | Julia Gloning | Adressierbare Werbung ohne Third-Party-Cookies – der Utiq-Ansatz\n13:20 | Andreas Gerhard | Sport1 - All Access\n13:50 | Beate Busch | Fazit, Danksagung und Vortragsende\n14:00 | Networking | Networking und informeller Austausch\n15:00 | Ende der Veranstaltung |","agendaText":"09:00 | Einlass | Empfang, Registrierung und Ankommen\n09:30 | Beate Busch der Falschinformationen gewinnt die technische Nachvollziehbarkeit von Inhalten an Relevanz.  \n\nKeywords: Authentizität, Desinformation, Streaming, Medienbranche","bodyText":"C2PA ist ein offener technischer Standard, der darauf abzielt, das Vertrauen in digitale Medieninhalte zu stärken. Entwickelt von Big Blue Marble, einem Zusammenschluss der ORF-Tochter ORS Group und dem Streaming-Spezialisten Insys Video Technologies, ermöglicht C2PA die automatische Erkennung von Manipulationen an gestreamten Inhalten. Dabei werden Ursprung und Bearbeitungen transparent nachvollziehbar gemacht. Dieses Verfahren ist ein wirksames Mittel gegen Desinformation, da es die Authentizität digitaler Inhalte offenlegt und somit Nutzer vor Falschinformationen schützt. Für Contentanbieter bietet C2PA zudem einen Schutz vor unbegründeten Manipulationsvorwürfen. Die Einführung dieses Standards ist ein bedeutender Schritt für die Medienbranche, da sie die Glaubwürdigkeit digital verbreiteter Inhalte erhöht und die Integrität von Medienproduktionen sichert. Insbesondere in Zeiten wachsender digitaler Verbreitung und zunehmender Falschinformationen gewinnt die technische Nachvollziehbarkeit von Inhalten an Relevanz.  \n\nKeywords: Authentizität, Desinformation, Streaming, Medienbranche","publishDate":"2026-10-23","validFrom":"2026-10-23","eventIds":["event-archive-63"],"longDescription":"C2PA ist ein offener technischer Standard, der darauf abzielt, das Vertrauen in digitale Medieninhalte zu stärken. Ein weltweiter Standard, der von Big Blue Marble umgesetzt und integriert wird, ermöglicht die automatische Erkennung von Manipulationen an gestreamten Inhalten. Dabei werden Ursprung und Bearbeitungen transparent nachvollziehbar gemacht. Dieses Verfahren ist ein wirksames Mittel gegen Desinformation, da es die Authentizität digitaler Inhalte offenlegt und somit Nutzer vor Falschinformationen schützt. Für Contentanbieter bietet C2PA zudem einen Schutz vor unbegründeten Manipulationsvorwürfen. Di set-430bdc05-f58e-4386-bcf4-67a4fe91199e","thumbnail_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-1fc49fa9-483f-4961-a281-a0104716dcec%2F1788973444392-9ba41600-df73-41b8-aa49-d393423edd7b.webp?alt=media&token=085c8abc-977e-421d-ad94-0b1d7333cddb","mediaAssetId":"media-asset-430bdc05-f58e-4386-bcf4-67a4fe91199e","article_media_asset_id":"media-asset-430bdc05-f58e-4386-bcf4-67a4fe91199e","imageUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-1fc49fa9-483f-4961-a281-a0104716dcec%2F1788973444392-9ba41600-df73-41b8-aa49-d393423edd7b.webp?alt=media&token=085c8abc-977e-421d-ad94-0b1d7333cddb","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-1fc49fa9-483f-4961-a281-a0104716dcec%2F1788973444392-9ba41600-df73-41b8-aa49-d393423edd7b.webp?alt=media&token=085c8abc-977e-421d-ad94-0b1d7333cddb","articleMediaAssetId":"media-asset-430bdc05-f58e-4386-bcf4-67a4fe91199e","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-1fc49fa9-483f-4961-a281-a0104716dcec%2F1788973444392-9ba41600-df73-41b8-aa49-d393423edd7b.webp?alt=media&token=085c8abc-977e-421d-ad94-0b1d7333cddb","companyLogoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-1fc49fa9-483f-4961-a281-a0104716dcec-company-logo%2F1789718525344-21c7832b-c222-4e6b-9d11-a6105b4e7094.webp?alt=media&token=5362b8b0-1a77-49fe-a27b-6c0b3adba256","sortOrder":2,"articleText":"Wie wird aus einem linearen Programm ein Fast Channel, der auf digitalen Plattformen zuverlässig angeboten und gefunden werden kann? Dr. Melanie Grundmann, Senior Content Managerin der Funke Mediagruppe, wird in ihrem Vortrag „Vom Playout auf die Plattform: Was einen Fast Channel wirklich distributionsfähig macht“ die entscheidenden Schritte zwischen Programmbereitstellung und Plattformdistribution einordnen.\n\nIm Mittelpunkt werden die technischen und redaktionellen Voraussetzungen stehen, die ein Fast Channel für die Verbreitung über Plattformen wie Samsung TV Plus, Rakuten TV oder LG Channels erfüllen muss. Der Vortrag wird zeigen, dass ein funktionierendes Playout allein noch keine erfolgreiche Distribution garantiert. Ebenso wichtig sind auf die jeweilige Plattform abgestimmte Inhalte, verlässliche Abläufe und ein Verständnis der Mechanismen, mit denen Reichweite und Nutzung entstehen.\n\nDr. Melanie Grundmann wird außerdem erläutern, welche Bedeutung die Zusammenarbeit mit Plattformbetreibern für Medienunternehmen gewinnt. Dabei wird es um die Verbindung von Content-Strategie, technischer Bereitstellung und Vermarktung gehen. Für Anbieter stellt sich die Frage, wie bestehende Inhalte so strukturiert und positioniert werden können, dass daraus ein tragfähiges digitales Angebot entsteht.\n\nDer Beitrag richtet den Blick damit auf die gesamte Strecke vom Playout bis zur sichtbaren Präsenz auf der Plattform. Er wird konkrete Orientierung dazu geben, welche Faktoren bei Planung, Betrieb und Weiterentwicklung eines Fast Channels zusammenspielen und warum Distributionsfähigkeit zu einer zentralen Voraussetzung für neue lineare Streamingangebote wird.\n\nKeywords: Fastchannel, Distribution, Plattformökonomie, Medienstrategie","bodyText":"Wie wird aus einem linearen Programm ein Fast Channel, der auf digitalen Plattformen zuverlässig angeboten und gefunden werden kann? Dr. Melanie Grundmann, Senior Content Managerin der Funke Mediagruppe, wird in ihrem Vortrag „Vom Playout auf die Plattform: Was einen Fast Channel wirklich distributionsfähig macht“ die entscheidenden Schritte zwischen Programmbereitstellung und Plattformdistribution einordnen.\n\nIm Mittelpunkt werden die technischen und redaktionellen Voraussetzungen stehen, die ein Fast Channel für die Verbreitung über Plattformen wie Samsung TV Plus, Rakuten TV oder LG Channels erfüllen muss. Der Vortrag wird zeigen, dass ein funktionierendes Playout allein noch keine erfolgreiche Distribution garantiert. Ebenso wichtig sind auf die jeweilige Plattform abgestimmte Inhalte, verlässliche Abläufe und ein Verständnis der Mechanismen, mit denen Reichweite und Nutzung entstehen.\n\nDr. Melanie Grundmann wird außerdem erläutern, welche Bedeutung die Zusammenarbeit mit Plattformbetreibern für Medienunternehmen gewinnt. Dabei wird es um die Verbindung von Content-Strategie, technischer Bereitstellung und Vermarktung gehen. Für Anbieter stellt sich die Frage, wie bestehende Inhalte so strukturiert und positioniert werden können, dass daraus ein tragfähiges digitales Angebot entsteht.\n\nDer Beitrag richtet den Blick damit auf die gesamte Strecke vom Playout bis zur sichtbaren Präsenz auf der Plattform. Er wird konkrete Orientierung dazu geben, welche Faktoren bei Planung, Betrieb und Weiterentwicklung eines Fast Channels zusammenspielen und warum Distributionsfähigkeit zu einer zentralen Voraussetzung für neue lineare Streamingangebote wird.\n\nKeywords: Fastchannel, Distribution, Plattformökonomie, Medienstrategie","longDescription":"Wie wird aus separaten Video-Inhalten, Archivprogramm oder Creator Content ein FAST Channel, der auf digitalen Plattformen zuverlässig angeboten und gefunden werden kann? Dr. Melanie Grundmann, Teamlead Distribution Partnerships bei FUNKE Digital, wird in ihrem Vortrag „Vom Playout auf die Plattform: Was einen Fast Channel wirklich distributionsfähig macht“ die entscheidenden Schritte zwischen Programmbereitstellung und Plattformdistribution einordnen.\n\nIm Mittelpunkt werden die komplexen Anforderungen stehen, die ein FAST Channel für die Verbreitung auf  Plattformen wie Samsung TV Plus, O2 TV oder LG Channels erfüllen muss. Der Vortrag wird zeigen, dass ein gut konzipierter Kanal allein noch keine erfolgreiche Distribution garantiert. Ebenso wichtig sind auf die jeweilige Plattform abgestimmte Anlieferungen, verlässliche f-32a7-4733-a456-da331a0a3601","articleMediaAssetId":"media-asset-03cca416-7bcd-42f8-91d6-fb12603f2fd1","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-527a7339-d174-4a41-9282-9f9190bac80d%2F1789640484490-71ef31c0-60ef-419b-b55d-a42425f70689.webp?alt=media&token=9fc5ab8f-32a7-4733-a456-da331a0a3601","thumbnailMediaAssetId":"media-asset-03cca416-7bcd-42f8-91d6-fb12603f2fd1","visibility":"public","speakerIds":["speakers-278f6d39-6322-4279-8a16-2f1b04109c22"],"shortDescription":"Wie man Medienhypes über verschiedene Touchpoints kreiert","article_media_asset_id":"media-asset-03cca416-7bcd-42f8-91d6-fb12603f2fd1","subtitle":"Wie man Medienhypes über verschiedene Touchpoints kreiert","companyLogoUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/topics%2Ftopics-527a7339-d174-4a41-9282-9f9190bac80d-company-logo%2F1789718876753-b89d89d7-9c0e-47d8-b464-a0273837c3a2.webp?alt=media&token=889cbeb3-6191-4dd6-8c12-ebdf5f0b8236","longDescription":"Wie entsteht aus einem Sportthema ein Medienereignis, das Menschen über mehrere Kanäle hinweg erreicht? Andreas Gerhard, Chief Content & Distribution Officer der Sport 1 GmbH, wird in seinem Vortrag „Sport1 - All Access“ zeigen, wie Inhalte, Distribution und unterschiedliche Touchpoints zusammenspielen, wenn Aufmerksamkeit und Reichweite gezielt aufgebaut werden sollen.\n\nIm Mittelpunkt wird die Frage stehen, wie ein Medienhype nicht nur an einem einzelnen Ausspielweg entsteht, sondern über mehrere Kontaktpunkte hinweg entwickelt werden kann. Der Vortrag wird betrachten, wie redaktionelle Inhalte, Plattformen und die Ansprache verschiedener Nutzergruppen aufeinander abgestimmt werden müssen, damit ein Thema wahrgenommen und weitergetragen wird.\n\nAndreas Gerhard wird die Perspektive eines Sportmedienanbieters einbringen und erläutern, welche Rolle eine koordinierte Content- und Distributionsstrategie dabei spielt. „All Access“ beschreibt in diesem Zusammenhang den Anspruch, Inhalte über unterschiedliche Wege zugänglich zu machen und die einzelnen Berührungspunkte zu einem konsistenten Medienerlebnis zu verbinden. Für digitale Medienunternehmen wird damit relevant, wie Reichweite, Engagement und Markenbindung gemeinsam gedacht werden können.\n\nDer Beitrag wird einordnen, welche Mechanismen hinter der gezielten Inszenierung und Verbreitung von Sportinhalten stehen. Er gibt einen Ausblick darauf, wie Medienmarken ihre Themen künftig kanalübergreifend führen können, ohne die jeweilige Nutzungssituation aus dem Blick zu verlieren. So entsteht eine praxisnahe Perspektive auf moderne Medienhypes und ihre Bedeutung für Content, Distribution und Publikum.\n\nKeywords: Sportmedien, Touchpoints, Contentstrategie, Distribution","description":"Wie entsteht aus einem Sportthema ein Medienereignis, das Menschen über mehrere Kanäle hinweg erreicht? Andreas Gerhard, Chief Content & Distribution Officer der Sport 1 GmbH, wird in seinem Vortrag „Sport1 - All Access“ zeigen, wie Inhalte, Distribution und unterschiedliche Touchpoints zusammenspielen, wenn Aufmerksamkeit und Reichweite gezielt aufgebaut werden sollen.\n\nIm Mittelpunkt wird die Frage stehen, wie ein Medienhype nicht nur an einem einzelnen Ausspielweg entsteht, sondern über mehrere Kontaktpunkte hinweg entwickelt werden kann. Der Vortrag wird betrachten, wie redaktionelle Inhalte, Plattformen und die Ansprache verschiedener Nutzergruppen aufeinander abgestimmt werden müssen, damit ein Thema wahrgenommen und weitergetragen wird.\n\nAndreas Gerhard wird die Perspektive eines Sportmedienanbieters einbringen und erläutern, welche Rolle eine koordinierte Content- und Distributionsstrategie dabei spielt. „All Access“ beschreibt in diesem Zusammenhang den Anspruch, Inhalte über unterschiedliche Wege zugänglich zu machen und die einzelnen Berührungspunkte zu einem konsistenten Medienerlebnis zu verbinden. Für digitale Medienunternehmen wird damit relev
