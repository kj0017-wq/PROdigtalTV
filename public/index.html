    <script>window.__PDT_PUBLIC_SNAPSHOT={"version":"v2","generatedAt":"2026-09-29T14:41:51.707Z","caches":{"pdtv-public-list-v7:events:[[\"status\",\"==\",\"published\"],[\"visibility\",\"==\",\"public\"]]":{"createdAt":1790692911690,"records":[{"id":"event-archive-75","date":"2025-02-18","registrationEnabled":false,"city":"Berlin","lifecyclePhase":"archive_published","showPublicTeaser":true,"title":"Medienfrühstück in Berlin: Die Agenda","accessType":"public","allowMemberRegistration":false,"allowPublicRegistration":false,"address":"","visibility":"public","speakerIds":[],"hostId":"heussen","sponsorIds":[],"displayDate":"18.02.2025","subtitle":"Mitteilung aus dem Veranstaltungsarchiv","topicIds":[],"status":"published","startTime":"09:30","endTime":"15:00","locationName":"Kurfürstendamm 31 Berlin 10719","postEventSummary":"PROdigitalTV Medienfrühstück am 18. Februar 2025 in Berlin, KANZLEI HEUSSEN: Die Agenda\n\nDie Location\n\nKurfürstendamm 31 Berlin 10719\n\nUnser Sponsor:\n\nVeranstaltungstag: 18.02.2025, Berlin\n\nPROdigitalTV Medienfrühstück am 18. Februar 2025 in Berlin, KANZLEI HEUSSEN: Die Agenda\n\nPROdigitalTV lädt am Dienstag, den 18. Februar 2025, von 09:30 bis15:00 Uhr zum ersten Medienfrühstück des neuen Jahres nach Berlin ein.\n\nWir freuen uns sehr, dass auch in diesem Jahr die Kanzlei HEUSSEN Rechtsanwaltsgesellschaft mbH unser Sponsor und Gastgeber ist!\n\nDie Veranstaltung beschäftigt sich mit aktuellen Fragen rund um die Medien- und Filmwirtschaft sowie um Aspekte der Medienpolitik und der technologischen Entwicklung.\n\nAGENDA\n\nLocation:\n\nHEUSSEN Rechtsanwaltsgesellschaft mbH\n\nKurfürstendamm 31 (Eingang Uhlandstraße)\n\n10719 Berlin\n\n09:30 Uhr Einlass, Kaffee & Networking\n\n10:25 Uhr Begrüßung:\n\nDr. Frank Grischa Feitsch, KANZLEI HEUSSEN\n\nBeate Busch, Vorstandsvorositzende, PROdigitalTV\n\nModerator der Veranstaltung:\n\nMichael Weber, Head Sales Marketing Communication, ORS\n\n10:30 Uhr\n\nJulia Maier-Hauff, Geschäftsführerin und Syndikusrechtsanwältin des Produzent*Innenverbandes:\n\n\"Filmförderung: Neue Wege, neue Chancen\"\n\nIm Dezember 2024 wurde das neue Filmförderungsgesetz (FFG) verabschiedet, der Deutsche Filmförderfonds (DFFF) auf 30 % erhöht und eine vorläufige Haushaltsführung für 2025 beschlossen. Doch viele zentrale Fragen sind noch offen: Die finalen Richtlinien der BKM zur kulturellen Filmförderung und die Besetzung der Jurys stehen aus. Julia Maier-Hauff appelliert an die künftige Regierung, die Vielfalt der Filmbranche zu stärken und ein international konkurrenzfähiges Fördersystem zu schaffen - mit einer gut ausgestatteten Talent- und BKM-Filmförderung, einer Investitionsverpflichtung mit Rechterückbehalt und einem modernen Steueranreizsystem.\n\n11:00 Uhr\n\nNorbert Grill, Geschäftsführer ORS-Österreichische Rundfunksender GmbH & Co KG, und\n\nMichael Wagenhofer, CEO ORS comm: „Broadcast-grade Streaming-Services“\n\nIn der dynamischen Welt der Medien wird die Auslieferung von Inhalten immer zentraler. Um den wachsenden Anforderungen gerecht zu werden und eine Vielzahl von gleichzeitigen Nutzern zu bedienen, müssen die Plattformen der Medienunternehmen nicht nur skalierbar, sondern auch äußerst leistungsfähig sein. Dieser Vortrag bietet eine tiefgehende Analyse und präsentiert innovative Ansätze, wie diese Herausforderungen erfolgreich gemeistert werden können. Lassen Sie sich inspirieren und entdecken Sie, wie zukunftsweisende Technologien und Strategien die Medienlandschaft revolutionieren können.\n\n11:30 Uhr\n\nRobert Weber, Geschäftsführer 80s80s Radio: \"Hörer = Wähler? Zielgruppensegmentierung im Radio als Impuls für die Politik\"\n\nRadiosender nutzen zunehmend psychometrische Daten und Methoden des maschinellen Lernens, um ihr Publikum detailliert zu profilieren. Diese Techniken ermöglichen eine gezielte Ansprache und tiefere Einblicke in die Interessen und Bedürfnisse der Hörer. Kurz vor der Bundestagswahl stellt sich die spannende Frage: Könnten diese Ansätze auch der Politik helfen, Zielgruppen (wieder) besser zu erreichen? Robert Weber bringt umfassende Erfahrung aus der Hörfunkbranche sowie aus den Bereichen Datenanalyse und KI-Implementierung mit. Als Geschäftsführer von 80s80s Radio und Beauftragter der REGIOCAST für Datenarchitektur und Governance verbindet er praxisnahe Einblicke mit fundierter Expertise in der Wertschöpfung aus Daten.\n\n12:00 Uhr Kaffeepause\n\n12:20 Uhr\n\nRobert Faußner, M.A, Partner der HEUSSEN Rechtsanwaltsgesellschaft mbH:\n\n\"Privacy or Cash - Wo drohen der Medien- und Filmwirtschaft datenschutzrechtliche Schadenersatzklagen und was ist zu tun?\"\n\nDigitalisierung und Datenschutz sind mitunter zwei Seiten einer Medaille. Ob Schludrigkeit oder schlichtes Unwissen - in digitalen Geschäftsmodellen drohen auch klassischen Unternehmen der Medien- und Filmwirtschaft neben Geldbußen von Aufsichtsbehörden oder Abmahnungen von Mitbewerbern datenschutzrechtliche Schadenersatzklagen. Der Europäische Gerichtshof hat den datenschutzrechtlichen Schadenersatzanspruch durch mittlerweile zehn Urteile konkretisiert. Auch bei immateriellen Schäden droht ein Schadenersatz, wenn personenbezogene Daten z.B. auf Websites, im Marketing oder bei Filmaufnahmen datenschutzwidrig verarbeitet werden oder wenn, was zunimmt, personenbezogene Daten durch Hacking-Angriffe abhandenkommen. Rechtsanwalt Robert Faußner, M.A. stellt die wesentlichen Feststellungen der EuGH-Urteile vor und erläutert, wie man Schadenersatzklagen vermeiden bzw. sich gegen diese verteidigen kann.\n\n12:50 Uhr\n\nKerstin Zorn - Head of Sales International / Streaming / CTV & FAST bei FUNKE Digital GmbH:\n\n„Die Zukunft gestalten: Wie Content-Produzenten und Werbetreibende den FAST Markt erobern.\n\nWelche Voraussetzung gibt es für einen eigenen FAST Channel, und wie funktioniert dessen Monetarisierung? Und: Erfolgsstories - was funktioniert am FAST Markt?\n\n13:20 Uhr Lunch und Networking\n\n15:00 Uhr Ende der Veranstaltung\n\nÄnderungen vorbehalten\n\nDownloads\n\nKontakt\n\nDatenschutz\n\nImpressum\n\nCookie Einstellungen\n\nLog-In\n\nProDigitalTV e.V. 2026","description":"PROdigitalTV Medienfrühstück am 18. Februar 2025 in Berlin, KANZLEI HEUSSEN: Die Agenda Die Location Kurfürstendamm 31 Berlin 10719 Unser Sponsor: Veranstaltungstag: 18.02.2025, Berlin PROdigitalTV Medienfrühstück am 18. Februar 2025 in Berlin, KANZLEI HEUSSEN: Die Agenda PROdigitalTV lädt am Dienstag, den 18. Februar 2025, von 09:30 bis15:00 Uhr zum ersten Medienfrühstück des neuen Jahres nach Berlin ein. Wir freuen uns sehr, dass auch in diesem Jahr die Kanzlei HEUSSEN Rechtsanwaltsgesellschaf","validFrom":"2025-02-18","longDescription":"PROdigitalTV Medienfrühstück am 18. Februar 2025 in Berlin – Rückblick\n\nAm 18. Februar 2025 lud PROdigitalTV zum ersten Medienfrühstück des Jahres in die Kanzlei HEUSSEN am Kurfürstendamm 31 in Berlin ein. Gastgeber und Sponsor der Veranstaltung war erneut die HEUSSEN Rechtsanwaltsgesellschaft mbH.\n\nDas Event bot eine Plattform für den Austausch zu aktuellen Themen der Medien- und Filmwirtschaft, der Medienpolitik sowie technologischen Entwicklungen. Die rund 09:30 Uhr beginnende Veranstaltung startete mit einem Networking-Kaffee, gefolgt von einer Begrüßung durch Dr. Frank Grischa Feitsch (KANZLEI HEUSSEN) und Beate Busch, Vorstandsvorsitzende von PROdigitalTV. Moderiert wurde die Veranstaltung von Michael Weber, Head Sales Marketing Communication bei ORS.\n\nIm Mittelpunkt standen Fachvorträge zu relevanten Branchenthemen:\n\n- Julia Maier-Hauff (Produzent*Innenverband) erläuterte die Neuerungen im Filmförderungsgesetz (FFG) und die Herausforderungen bei der Umsetzung der kulturellen Filmförderung. Sie betonte die Bedeutung eines international wettbewerbsfähigen Fördersystems mit Fokus auf Talentförderung und Steueranreize.\n\n- Norbert Grill und Michael Wagenhofer (ORS) präsentierten innovative Ansätze für skalierbare und leistungsfähige Broadcast-grade Streaming-Services, die den steigenden Anforderungen der Medienauslieferung gerecht werden.\n\n- Robert Weber (80s80s Radio) diskutierte die Nutzung psychometrischer Daten und maschinellen Lernens zur Zielgruppensegmentierung im Radio und deren Potenzial für die politische Ansprache vor der Bundestagswahl.\n\n- Robert Faußner (HEUSSEN) informierte über datenschutzrechtliche Risiken und Schadenersatzklagen in der Medien- und Filmwirtschaft. Er erläuterte die aktuelle Rechtsprechung des Europäischen Gerichtshofs und gab Handlungsempfehlungen zur Vermeidung und Abwehr solcher Klagen.\n\n- Kerstin Zorn (FUNKE Digital GmbH) gab Einblicke in den FAST-Markt (Free Ad-supported Streaming TV), erläuterte Voraussetzungen für eigene FAST-Channels und deren Monetarisierung sowie Erfolgsfaktoren.\n\nDas Medienfrühstück endete nach einem gemeinsamen Lunch und weiterem Networking um 15:00 Uhr. Die Veranstaltung bot den Teilnehmenden wertvolle Impulse und aktuelle Einblicke in die dynamischen Entwicklungen der digitalen Medienbranche.\n\nHinweis: Für weiterführende Informationen zu einzelnen Vorträgen und Materialien wenden Sie sich bitte an PROdigitalTV.","archiveText":"PROdigitalTV Medienfrühstück am 18. Februar 2025 in Berlin – Rückblick\n\nAm 18. Februar 2025 lud PROdigitalTV zum ersten Medienfrühstück des Jahres in die Kanzlei HEUSSEN am Kurfürstendamm 31 in Berlin ein. Gastgeber und Sponsor der Veranstaltung war erneut die HEUSSEN Rechtsanwaltsgesellschaft mbH.\n\nDas Event bot eine Plattform für den Austausch zu aktuellen Themen der Medien- und Filmwirtschaft, der Medienpolitik sowie technologischen Entwicklungen. Die rund 09:30 Uhr beginnende Veranstaltung startete mit einem Networking-Kaffee, gefolgt von einer Begrüßung durch Dr. Frank Grischa Feitsch (KANZLEI HEUSSEN) und Beate Busch, Vorstandsvorsitzende von PROdigitalTV. Moderiert wurde die Veranstaltung von Michael Weber, Head Sales Marketing Communication bei ORS.\n\nIm Mittelpunkt standen Fachvorträge zu relevanten Branchenthemen:\n\n- Julia Maier-Hauff (Pr eaming TV), erläuterte Voraussetzungen für eigene FAST-Channels und deren Monetarisierung sowie Erfolgsfaktoren.\n\nDas Medienfrühstück endete nach einem gemeinsamen Lunch und weiterem Networking um 15:00 Uhr. Die Veranstaltung bot den Teilnehmenden wertvolle Impulse und aktuelle Einblicke in die dynamischen Entwicklungen der digitalen Medienbranche.\n\nHinweis: Für weiterführende Informationen zu einzelnen Vorträgen und Materialien wenden Sie sich bitte an PROdigitalTV.","eventType":"Medienfrühstück","updated_at":"2026-06-23T08:11:55.151Z","thumbnailMediaAssetId":"asset-events-event-archive-75","thumbnail_media_asset_id":"asset-events-event-archive-75","imageUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fevents%2Fevent-archive-75%2Fmigrated%2F1784450610107-asset-events-event-archive-75.webp?alt=media&token=f88ab9c6-801b-48c7-ad69-f33296f453ff","thumbnail_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fevents%2Fevent-archive-75%2Fmigrated%2F1784450610107-asset-events-event-archive-75.webp?alt=media&token=f88ab9c6-801b-48c7-ad69-f33296f453ff","mediaAssetId":"asset-events-event-archive-75","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fevents%2Fevent-archive-75%2Fmigrated%2F1784450610107-asset-events-event-archive-75.webp?alt=media&token=f88ab9c6-801b-48c7-ad69-f33296f453ff","updatedAt":"2026-09-23T06:42:33.512Z"},{"id":"event-archive-76","date":"2025-05-15","registrationEnabled":false,"lifecyclePhase":"archive_published","showPublicTeaser":true,"title":"Medienfrühstück in Muenchen","accessType":"public","allowMemberRegistration":false,"allowPublicRegistration":false,"address":"","visibility":"public","speakerIds":[],"hostId":"","eventType":"Medienfrühstück","sponsorIds":[],"displayDate":"15.05.2025","subtitle":"Mitteilung aus dem Veranstaltungsarchiv","topicIds":[],"endTime":"","status":"published","startTime":"09:30","locationName":"Kanzlei Heuking Kühn Lüer Wojtek Prinzregentenstraße 48 München 81675","city":"München","postEventSummary":"Die Location\n\nKanzlei Heuking Kühn Lüer Wojtek Prinzregentenstraße 48 München 81675\n\nUnser Sponsor:\n\nVeranstaltungstag: 15.05.2025, München\n\nSave The Date: Einladung zum Medienfrühstück in München am 15. Mai 2025\n\nMEDIENFRÜHSTÜCK IN MÜNCHEN\n\nPROdigitalTV lädt Sie am Donnerstag, den 15. Mai 2025 zum Medienfrühstück in München ein. Die Veranstaltung findet in den Räumlichkeiten der renommierten Rechtsanwaltskanzlei Heuking Kühn Lüer Wojtek statt, die auf Medienrecht spezialisiert ist.\n\nUnter dem Thema „Hochwertiger Zielgruppencontent, neue Märkte, neue Chancen “ freuen wir uns auf aktuelle Beiträge und frische Impulse aus der Medien- und Digitalbranche. Unser Gastgeber sorgt auch für den kulinarischen Rahmen des Medienfrühstücks und lädt dabei zu einem stilvollen Frühstück sowie einem Mittagsimbiss ein. Hier haben Sie ausreichend Gelegenheit für brancheninternen Austausch und Ihrem persönlichem Networking.\n\nAGENDA\n\nLocation:\n\nKanzlei Heuking Kühn Lüer Wojtek\n\nDonnerstag, 15. Mai 2025\n\nVeranstaltungsort:\n\nKanzlei Heuking Kühn Lüer Wojtek\n\nPrinzregentenstraße 48\n\n81675 München\n\nwww.heuking.de\n\n09:30 Uhr Einlass & Frühstück\n\n10:00 Uhr Veranstaltungsbeginn\n\n13:30 Uhr Lunch & Networking\n\n15:00 Uhr Veranstaltungsende\n\nReferenten:\n\n- Dr. Albrecht Bischoffshausen, VFF Verwertungsgesellschaft der Film- und Fernsehproduzenten mbH: „Rechte für Plattformen und Produktionen“\n\n- Angelo Morano, Insiderchina, CEO and Founder\n\n- Rechtsanwalt Michael Schmittmann, Heuking Düsseldorf/München: „Neue Märkte - Altes Recht und unpassende Regulierung? Eine Übersicht über neue Rechtsentwicklungen“\n\n- Tilman Rautenstrauch, Director, OneGate Media GmbH - Digital Distribution: „Content Distribution everywhere: How to get on Many Platforms“\n\n- Jonas Petersen, media-press.tv: \"Erfolgreicher Einsatz von Metadaten\"\n\n- Chistopher Schmidt Dsmc Entertainment: Vorstellung von zwei Special Interest Formaten und deren Erfolg.\n\nModeration:\n\nBeate Busch und Thorsten Lork\n\nWeitere Aktualisierungen erhalten Sie regelmäßig per Mail und auf unserer Website.\n\nDownloads\n\nKontakt\n\nDatenschutz\n\nImpressum\n\nCookie Einstellungen\n\nLog-In\n\nProDigitalTV e.V. 2026","description":"Die Location Kanzlei Heuking Kühn Lüer Wojtek Prinzregentenstraße 48 München 81675 Unser Sponsor: Veranstaltungstag: 15.05.2025, München Save The Date: Einladung zum Medienfrühstück in München am 15. Mai 2025 MEDIENFRÜHSTÜCK IN MÜNCHEN PROdigitalTV lädt Sie am Donnerstag, den 15. Mai 2025 zum Medienfrühstück in München ein. Die Veranstaltung findet in den Räumlichkeiten der renommierten Rechtsanwaltskanzlei Heuking Kühn Lüer Wojtek statt, die auf Medienrecht spezialisiert ist. Unter dem Thema „H","validFrom":"2025-05-15","preStatus":"save_the_date","longDescription":"Am 15. Mai 2025 fand in den Räumlichkeiten der renommierten Kanzlei Heuking Kühn Lüer Wojtek in München das PROdigitalTV Medienfrühstück statt. Unter dem Motto „Hochwertiger Zielgruppencontent, neue Märkte, neue Chancen“ bot die Veranstaltung aktuelle Einblicke und Impulse aus der Medien- und Digitalbranche.\n\nDie Teilnehmer nutzten den Vormittag für einen intensiven fachlichen Austausch. Hochkarätige Referenten beleuchteten verschiedene Aspekte der Branche: Dr. Albrecht Bischoffshausen (VFF) sprach über Rechte für Plattformen und Produktionen, Rechtsanwalt Michael Schmittmann gab einen Überblick zu neuen Rechtsentwicklungen in Bezug auf alte Regulierung, und Tilman Rautenstrauch (OneGate Media GmbH) erläuterte Strategien zur digitalen Content-Distribution. Weitere Beiträge kamen von Angelo Morano (Insiderchina), Jonas Petersen (media-press.tv) zum erfolgreichen Einsatz von Metadaten sowie Christopher Schmidt (Dsmc Entertainment) mit der Vorstellung erfolgreicher Special Interest Formate.\n\nDie Veranstaltung wurde von Beate Busch nche: Dr. Albrecht Bischoffshausen (VFF) sprach über Rechte für Plattformen und Produktionen, Rechtsanwalt Michael Schmittmann gab einen Überblick zu neuen Rechtsentwicklungen in Bezug auf alte Regulierung, und Tilman Rautenstrauch (OneGate Media GmbH) erläuterte Strategien zur digitalen Content-Distribution. Weitere Beiträge kamen von Angelo Morano (Insiderchina), Jonas Petersen (media-press.tv) zum erfolgreichen Einsatz von Metadaten sowie Christopher Schmidt (Dsmc Entertainment) mit der Vorstellung erfolgreicher Special Interest Formate.\n\nDie Veranstaltung wurde von Beate Busch und Thorsten Lork moderiert. Für das leibliche Wohl sorgte der Gastgeber mit einem stilvollen Frühstück sowie einem Mittagsimbiss, die zugleich Raum für Networking und brancheninternen Austausch boten.\n\nDas Medienfrühstück in München bestätigte einmal mehr seine Rolle als Plattform für den Dialog und die Vernetzung innerhalb der digitalen Medienwirtschaft.  \n\nFür weiterführende Informationen zu den Referenten und Themen wenden Sie sich bitte an PROdigitalTV.","updated_at":"2026-06-23T08:11:55.081Z","thumbnailMediaAssetId":"asset-events-event-archive-76","thumbnail_media_asset_id":"asset-events-event-archive-76","imageUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fevents%2Fevent-archive-76%2Fmigrated%2F1784450613044-asset-events-event-archive-76.webp?alt=media&token=6fb04acd-f1f8-4b67-8934-602e13e5dad9","thumbnail_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fevents%2Fevent-archive-76%2Fmigrated%2F1784450613044-asset-events-event-archive-76.webp?alt=media&token=6fb04acd-f1f8-4b67-8934-602e13e5dad9","mediaAssetId":"asset-events-event-archive-76","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fevents%2Fevent-archive-76%2Fmigrated%2F1784450613044-asset-events-event-archive-76.webp?alt=media&token=6fb04acd-f1f8-4b67-8934-602e13e5dad9","updatedAt":"2026-09-23T06:42:33.513Z"},{"id":"event-berlinale-2026","date":"2026-02-17","registrationEnabled":false,"city":"Berlin","postEventSummary":"Zum Auftakt des Veranstaltungsjahres in Berlin lud PROdigitalTV am 17. Februar 2026 in die Kanzlei HEUSSEN ein. Im Mittelpunkt des Medienfrühstücks stand die Frage, wie kuenstliche Intelligenz Arbeitsweisen, Inhalte und Verantwortung in der Medienwirtschaft veraendert.","description":"PROdigitalTV Medienfrühstück in Berlin im Rahmen der Berlinale.","showPublicTeaser":true,"title":"Medienfrühstück zur Berlinale","accessType":"public","startTime":"","address":"","locationName":"HEUSSEN Rechtsanwaltsgesellschaft mbH","visibility":"public","hostId":"heussen","eventType":"Medienfrühstück","sponsorIds":[],"subtitle":"Wie hat KI die Medienwirtschaft veraendert?","endTime":"","status":"published","allowMemberRegistration":false,"allowPublicRegistration":false,"updated_at":"2026-06-12T09:40:55.797Z","preStatus":"save_the_date","longDescription":"Am 17. Februar 2026 veranstaltete PROdigitalTV im Rahmen der Berlinale sein traditionelles Medienfrühstück in Berlin. Gastgeber und Sponsor war die HEUSSEN Rechtsanwaltsgesellschaft mbH am Kurfürstendamm 31.\n\nIm Mittelpunkt standen aktuelle Entwicklungen der Medien- und Filmwirtschaft, der Einsatz Künstlicher Intelligenz, medienrechtliche Fragen, digitale Souveränität im Videostreaming sowie neue Geschäfts- und Erlösmodelle.\n\nDie Gäste wurden von Dr. Frank Grischa Feitsch für HEUSSEN und Klaus Juli für PROdigitalTV begrüßt. Durch das Programm führte Dirk Martens, Geschäftsführer von House of Research und Vorstandsmitglied von PROdigitalTV.\n\nGregor C. Blach, Gründer und Geschäftsführer von WE DO communication sowie Vorstand des Marketing Club Berlin e.V., sprach über menschliche Kompetenz und Künstliche Intelligenz in kreativen Prozessen. Er zeigte, wie KI bereits Konzepte, Texte und Bilder unterstützte oder erzeugte, und machte deutlich, weshalb menschliche Erfahrung, Intuition und kreative Verantwortung weiterhin eine zentrale Rolle spielten.\n\nMichael Duderstädt, Direktor Politische Kommunikation der GEMA und Standortleiter Berlin, beleuchtete die Bedeutung von KI für die Musikwirtschaft. Er stellte die Frage nach dem Wert menschengemachter Musik in den Mittelpunkt und ordnete die rechtlichen Auseinandersetzungen der GEMA mit Anbietern wie OpenAI und Suno ein.\n\nMarcus Hotze und Lennart Rümmler von der HEUSSEN Rechtsanwaltsgesellschaft erläuterten den damaligen Rechtsstand zum Einsatz generativer KI in Film, TV und Marketing. Sie gingen auf rechtliche Entwicklungen, regulatorische Anforderungen, vertragliche Fragen und praktische Risiken für Medien- und Kreativproduktionen ein.\n\nNach der Kaffeepause stellte Björn Adamski, CCO der 3Q GmbH, cloudunabhängige Videostreaming-Infrastrukturen vor. Er zeigte, wie Medienunternehmen ihre digitale Souveränität stärken, Kosten senken und Abhängigkeiten von Hyperscalern reduzieren konnten.\n\nMarkus Vogelbacher und Chriz Merkl präsentierten mit Vertical Minds neue Erlöswege für Filmproduktionen. Im Mittelpunkt stand eine Micro-Drama-Plattform für den DACH-Markt, die Produzentinnen, Produzenten und Rechteinhabern zusätzliche Verwertungsmöglichkeiten eröffnete.\n\nStefan Uhl, Geschäftsführer D-A-CH der Advise Media Consulting GmbH, analysierte das von der AdAlliance angekündigte neue TV-Pricing-Modell. Er erläuterte, welche Chancen und Risiken eine künftige TKP-basierte Leistungsabrechnung im linearen Fernsehen für Sender, Vermarkter, Agenturen und Kunden mit sich brachte.\n\nBegleitend zur Veranstaltung fand eine Vernissage der Galerie „EMPORIUM by Jens August“ aus Millstatt am See in Österreich statt. In den Kanzleiräumen wurden Werke von Patrizia Casagrande, Anna Schellberg, M. Jank, Bettina Nuschei und Marion Rauter gezeigt. Vertreter der Galerie sowie mehrere Künstlerinnen waren anwesend.\n\nDas Medienfrühstück bot den Teilnehmenden Gelegenheit zum fachlichen Austausch und zur persönlichen Vernetzung. Die Veranstaltung zeigte, wie stark Künstliche Intelligenz, neue Infrastrukturmodelle, rechtliche Rahmenbedingungen und veränderte Erlöslogiken die Medienbranche prägten.\n\nPROdigitalTV bedankte sich bei der HEUSSEN Rechtsanwaltsgesellschaft mbH für die Gastfreundschaft sowie bei allen Referentinnen, Referenten und Gästen für ihre Beiträge und den intensiven Austausch.\n","archiveText":"Am 17. Februar 2026 veranstaltete PROdigitalTV im Rahmen der Berlinale sein traditionelles Medienfrühstück in Berlin. Gastgeber und Sponsor war die HEUSSEN Rechtsanwaltsgesellschaft mbH am Kurfürstendamm 31.\n\nIm Mittelpunkt standen aktuelle Entwicklungen der Medien- und Filmwirtschaft, der Einsatz Künstlicher Intelligenz, medienrechtliche Fragen, digitale Souveränität im Videostreaming sowie neue Geschäfts- und Erlösmodelle.\n\nDie Gäste wurden von Dr. Frank Grischa Feitsch für HEUSSEN und Klaus Juli für PROdigitalTV begrüßt. Durch das Programm führte Dirk Martens, Geschäftsführer von House of Research und Vorstandsmitglied von PROdigitalTV.\n\nGregor C. Blach, Gründer und Geschäftsführer von WE DO communication sowie Vorstand des Marketing Club Berlin e.V., sprach über menschliche Kompetenz und Künstliche Intelligenz in kreativen Prozessen. Er zeigte, wie KI bereits Konzepte, Texte und Bilder unterstützte oder erzeugte, und machte deutlich, weshalb menschliche Erfahrung, Intuition und kreative Verantwortung weiterhin eine zentrale Rolle spielten.\n\nMichael Duderstädt, Direktor Politische Kommunikation der GEMA und Standortleiter Berlin, beleuchtete die Bedeutung von KI für die Musikwirtschaft. Er stellte die Frage nach dem Wert menschengemachter Musik in den Mittelpunkt und ordnete die rechtlichen Auseinandersetzungen der GEMA mit Anbietern wie OpenAI und Suno ein.\n\nMarcus Hotze und Lennart Rümmler von der HEUSSEN Rechtsanwaltsgesellschaft erläuterten den damaligen Rechtsstand zum Einsatz generativer KI in Film, TV und Marketing. Sie gingen auf rechtliche Entwicklungen, regulatorische Anforderungen, vertragliche Fragen und praktische Risiken für Medien- und Kreativproduktionen ein.\n\nNach der Kaffeepause stellte Björn Adamski, CCO der 3Q GmbH, cloudunabhängige Videostreaming-Infrastrukturen vor. Er zeigte, wie Medienunternehmen ihre digitale Souveränität stärken, Kosten senken und Abhängigkeiten von Hyperscalern reduzieren konnten.\n\nMarkus Vogelbacher und Chriz Merkl präsentierten mit Vertical Minds neue Erlöswege für Filmproduktionen. Im Mittelpunkt stand eine Micro-Drama-Plattform für den DACH-Markt, die Produzentinnen, Produzenten und Rechteinhabern zusätzliche Verwertungsmöglichkeiten eröffnete.\n\nStefan Uhl, Geschäftsführer D-A-CH der Advise Media Consulting GmbH, analysierte das von der AdAlliance angekündigte neue TV-Pricing-Modell. Er erläuterte, welche Chancen und Risiken eine künftige TKP-basierte Leistungsabrechnung im linearen Fernsehen für Sender, Vermarkter, Agenturen und Kunden mit sich brachte.\n\nBegleitend zur Veranstaltung fand eine Vernissage der Galerie „EMPORIUM by Jens August“ aus Millstatt am See in Österreich statt. In den Kanzleiräumen wurden Werke von Patrizia Casagrande, Anna Schellberg, M. Jank, Bettina Nuschei und Marion Rauter gezeigt. Vertreter der Galerie sowie mehrere Künstlerinnen waren anwesend.\n\nDas Medienfrühstück bot den Teilnehmenden Gelegenheit zum fachlichen Austausch und zur persönlichen Vernetzung. Die Veranstaltung zeigte, wie stark Künstliche Intelligenz, neue Infrastrukturmodelle, rechtliche Rahmenbedingungen und veränderte Erlöslogiken die Medienbranche prägten.\n\nPROdigitalTV bedankte sich bei der HEUSSEN Rechtsanwaltsgesellschaft mbH für die Gastfreundschaft sowie bei allen Referentinnen, Referenten und Gästen für ihre Beiträge und den intensiven Austausch.\n","bodyText":"Am 17. Februar 2026 veranstaltete PROdigitalTV im Rahmen der Berlinale sein traditionelles Medienfrühstück in Berlin. Gastgeber und Sponsor war die HEUSSEN Rechtsanwaltsgesellschaft mbH am K  Nuschei und Marion Rauter gezeigt. Vertreter der Galerie sowie mehrere Künstlerinnen waren anwesend.\n\nDas Medienfrühstück bot den Teilnehmenden Gelegenheit zum fachlichen Austausch und zur persönlichen Vernetzung. Die Veranstaltung zeigte, wie stark Künstliche Intelligenz, neue Infrastrukturmodelle, rechtliche Rahmenbedingungen und veränderte Erlöslogiken die Medienbranche prägten.\n\nPROdigitalTV bedankte sich bei der HEUSSEN Rechtsanwaltsgesellschaft mbH für die Gastfreundschaft sowie bei allen Referentinnen, Referenten und Gästen für ihre Beiträge und den intensiven Austausch.\n","thumbnailMediaAssetId":"media-asset-b6a0854f-8cde-4b61-b57b-f5c3613c63bc","thumbnail_media_asset_id":"media-asset-b6a0854f-8cde-4b61-b57b-f5c3613c63bc","imageUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fevents%2Fevent-berlinale-2026%2Fmigrated%2F1784451836137-5e50f187-08e9-405a-861b-6d4ac3883272.webp?alt=media&token=0be39f4a-0cce-4bdf-b4db-70ba79c1e638","thumbnail_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fevents%2Fevent-berlinale-2026%2Fmigrated%2F1784451836137-5e50f187-08e9-405a-861b-6d4ac3883272.webp?alt=media&token=0be39f4a-0cce-4bdf-b4db-70ba79c1e638","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fevents%2Fevent-berlinale-2026%2Fmigrated%2F1784451836137-5e50f187-08e9-405a-861b-6d4ac3883272.webp?alt=media&token=0be39f4a-0cce-4bdf-b4db-70ba79c1e638","mediaAssetId":"media-asset-b6a0854f-8cde-4b61-b57b-f5c3613c63bc","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fevents%2Fevent-berlinale-2026%2Fmigrated%2F1784451836137-5e50f187-08e9-405a-861b-6d4ac3883272.webp?alt=media&token=0be39f4a-0cce-4bdf-b4db-70ba79c1e638","lifecyclePhase":"archived","topicIds":["berlinale-2026-hotze-ruemmler-generative-ki-recht","berlinale-2026-gregor-blach-kreativitaet-ki","berlinale-2026-michael-duderstaedt-musik-ki","berlinale-2026-vogelbacher-merkl-micro-dramas","berlinale-2026-stefan-uhl-tv-pricing-modell","berlinale-2026-bjoern-adamski-cloudunabhaengiges-videostreaming"],"speakerIds":["speakers-michael-duderstadt","speakers-marcus-hotze","speakers-bjorn-adamski","speakers-markus-vogelbacher","speakers-chriz-merkl","speakers-stefan-uhl","speakers-lennart-ruemmler","speakers-gregor-c-blach"],"scheduleText":"09:30 | Einlass | Empfang, Registrierung und Ankommen\n10:00 | Moderation | Begruessung durch PROdigitalTV und organisatorische Hinweise\n10:15 | Lennart Ruemmler | Generative KI in Film, Fernsehen und Marketing rechtssicher einsetzen\n10:45 | Referent wird ergaenzt | Vortrag 2 wird ergaenzt\n11:15 | Pause | Kurze Pause und Austausch\n11:30 | Referent wird ergaenzt | Vortrag 3 wird ergaenzt\n12:00 | Referent wird ergaenzt | Vortrag 4 wird ergaenzt\n12:30 | Pause | Laengere Pause, Lunch oder Networking\n13:00 | Referent wird ergaenzt | Vortrag 5 wird ergaenzt\n13:30 | Referent wird ergaenzt | Vortrag 6 wird ergaenzt\n14:00 | Networking | Networking und informeller Austausch\n15:15 | Moderation | Ende der Veranstaltung","agendaText":"09:30 | Einlass | Empfang, Registrierung und Ankommen\n10:00 | Moderation | Begruessung durch PROdigitalTV und organisatorische Hinweise\n10:15 | Lennart Ruemmler | Generative KI in Film, Fernsehen und Marketing rechtssicher einsetzen\n10:45 | Referent wird ergaenzt | Vortrag 2 wird ergaenzt\n11:15 | Pause | Kurze Pause und Austausch\n11:30 | Referent wird ergaenzt | Vortrag 3 wird ergaenzt\n12:00 | Referent wird ergaenzt | Vortrag 4 wird ergaenzt\n12:30 | Pause | Laengere Pause, Lunch oder Networking\n13:00 | Referent wird ergaenzt | Vortrag 5 wird ergaenzt\n13:30 | Referent wird ergaenzt | Vortrag 6 wird ergaenzt\n14:00 | Networking | Networking und informeller Austausch\n15:15 | Moderation | Ende der Veranstaltung","updatedAt":"2026-09-23T06:42:33.514Z"},{"id":"event-leica-welt-2026","date":"2026-01-13","registrationEnabled":false,"city":"Wetzlar","postEventSummary":"Mit dem Medienfrühstück in der Leica-Welt setzte PROdigitalTV den Branchendialog am 13. Januar 2026 in Wetzlar fort. Das Ernst-Leitz Museum bildete den Rahmen fuer Austausch und persoenliche Vernetzung.","lifecyclePhase":"archive_published","description":"PROdigitalTV Medienfrühstück im Ernst-Leitz Museum in Wetzlar.","showPublicTeaser":true,"title":"Medienfrühstück in der Leica-Welt","accessType":"public","allowMemberRegistration":false,"startTime":"","allowPublicRegistration":false,"address":"","locationName":"Ernst-Leitz Museum","visibility":"public","hostId":"ernst-leitz-museum","sponsorIds":[],"subtitle":"PROdigitalTV in Wetzlar","endTime":"","status":"published","updated_at":"2026-06-12T09:40:56.472Z","thumbnail_media_asset_id":"media-asset-e1751af9-2377-4224-96fc-db557a74783a","mediaAssetId":"media-asset-e1751af9-2377-4224-96fc-db557a74783a","eventType":"Medienfrühstück","preStatus":"save_the_date","longDescription":"Am 13. Januar 2026 veranstaltete PROdigitalTV sein erstes Medienfrühstück des Jahres in der Leica-Welt in Wetzlar. Gastgeber des Branchentreffens war das Ernst Leitz Museum im Leitz-Park, einem Ort, der wie kaum ein anderer für Innovationskraft, Präzision und höchste Bildqualität steht.\n\nIm Mittelpunkt der Veranstaltung standen die Zukunft audiovisueller Medien, neue Technologien in Produktion und Vermarktung sowie die Auswirkungen Künstlicher Intelligenz auf die Medienbranche. Gleichzeitig bot die Veranstaltung Gelegenheit zum persönlichen Austausch zwischen Vertreterinnen und Vertretern aus Medienwirtschaft, Forschung, Vermarktung und Produktion.\n\n## Leica als Brücke zwischen Tradition und Zukunft\n\nZu Beginn wurde die besondere Bedeutung der Marke Leica für die internationale Medien- und Kreativbranche hervorgehoben. Das Unternehmen hatte 2025 das 100-jährige Jubiläum der legendären Leica I gefeiert – jener Kamera, die die moderne Fotografie nachhaltig geprägt hatte.\n\nDabei wurde deutlich, dass Leica heute nicht nur in der Fotografie eine herausragende Rolle spielt. Hochwertige Leica-Objektive kommen weltweit bei Filmproduktionen, TV-Serien und Streaming-Formaten zum Einsatz und stehen für höchste technische Qualität sowie besondere Bildästhetik. Die Leica-Welt bot damit den passenden Rahmen für die Diskussion aktueller Entwicklungen in der Medienbranche.\n\n## Vorträge und Diskussionen\n\nNach der Begrüßung durch den Vorstand von PROdigitalTV begann das Symposium mit einem abwechslungsreichen Programm.\n\nMola Adebisi sprach in einem persönlichen Interview über seine Erfahrungen in der Medienbranche und gab Einblicke in die Entwicklung des Fernsehens aus Sicht eines langjährigen Branchenkenners.\n\nBert Sahm von der M-COS Group erläuterte in seinem Vortrag, wie KI-gestützte Prozesse die klassische Content-Produktion verändern. Dabei zeigte er auf, wie sich Produktionsabläufe von analogen hin zu digitalen und zunehmend automatisierten Workflows entwickelt hatten.\n\nThomas Schneider-Trumpp, Gründer der Watch Movies GmbH, beschäftigte sich mit Strategien zur internationalen Vermarktung audiovisueller Inhalte und erläuterte, wie Produzenten heute globale Zielgruppen erreichen können.\n\nJan Isenbart, Geschäftsleiter Forschung & Service bei ARD Media, präsentierte aktuelle Erkenntnisse zur Wirkung von Werbung und zeigte auf, welche Erwartungen Werbetreibende realistisch an moderne Kommunikationsmaßnahmen stellen können.\n\nChristof Baron, Geschäftsführer der Nayoki Mediaplus GmbH & Co. KG, analysierte die zunehmende Konkurrenz internationaler Plattformen und diskutierte die Perspektiven lokaler Publisher in einem globalisierten Medienmarkt.\n\nDirk Engel, freiberuflicher Dozent, Fachautor sowie Markt- und Mediaforscher, widmete sich dem „Zeitalter des posthumanen Marketings“ und beleuchtete die Rolle von Daten, Automatisierung und Künstlicher Intelligenz in zukünftigen Marketingstrategien.\n\nZwischen den Vorträgen nutzten die Teilnehmerinnen und Teilnehmer die Gelegenheit zum Networking bei einem gemeinsamen Frühstück mit Kaffee und Snacks.\n\n## Blick hinter die Kulissen der Leica-Manufaktur\n\nIm Anschluss an das Symposium erhielten die Gäste im Rahmen einer Führung durch die Leica-Manufaktur einen Einblick in die Fertigung, Geschichte und Unternehmenskultur der Marke Leica.\n\nDie Besichtigung vermittelte eindrucksvoll, wie traditionelle Handwerkskunst, technologische Innovation und höchste Qualitätsansprüche bis heute miteinander verbunden werden.\n\n## Fazit\n\nDas Medienfrühstück in der Leica-Welt Wetzlar zeigte eindrucksvoll, wie eng technologische Innovation, hochwertige Medienproduktion und wirtschaftliche Zukunftsfragen miteinander verknüpft sind. Die Veranstaltung verband spannende Fachvorträge mit intensivem Austausch und bot den Teilnehmerinnen und Teilnehmern wertvolle Impulse für die Herausforderungen der digitalen Medienwelt.\n\nPROdigitalTV bedankte sich bei Leica, dem Ernst Leitz Museum sowie allen Referentinnen, Referenten und Gästen für eine erfolgreiche Veranstaltung und die zahlreichen anregenden Gespräche.\n","archiveText":"Am 13. Januar 2026 veranstaltete PROdigitalTV sein erstes Medienfrühstück des Jahres in der Leica-Welt in Wetzlar. Gastgeber des Branchentreffens war das Ernst Leitz Museum im Leitz-Park, einem Ort, der wie kaum ein anderer für Innovationskraft, Präzision und höchste Bildqualität steht.\n\nIm Mittelpunkt der Veranstaltung standen die Zukunft audiovisueller Medien, neue Technologien in Produktion und Vermarktung sowie die Auswirkungen Künstlicher Intelligenz auf die Medienbranche. Gleichzeitig bot die Veranstaltung Gelegenheit zum persönlichen Austausch zwischen Vertreterinnen und Vertretern aus Medienwirtschaft, Forschung, Vermarktung und Produktion.\n\n## Leica als Brücke zwischen Tradition und Zukunft\n\nZu Beginn wurde die besondere Bedeutung der Marke Leica für die internationale Medien- und Kreativbranche hervorgehoben. Das Unternehmen hatte 2025 d n und diskutierte die Perspektiven lokaler Publisher in einem globalisierten Medienmarkt.\n\nDirk Engel, freiberuflicher Dozent, Fachautor sowie Markt- und Mediaforscher, widmete sich dem „Zeitalter des posthumanen Marketings“ und beleuchtete die Rolle von Daten, Automatisierung und Künstlicher Intelligenz in zukünftigen Marketingstrategien.\n\nZwischen den Vorträgen nutzten die Teilnehmerinnen und Teilnehmer die Gelegenheit zum Networking bei einem gemeinsamen Frühstück mit Kaffee und Snacks.\n\n## Blick hinter die Kulissen der Leica-Manufaktur\n\nIm Anschluss an das Symposium erhielten die Gäste im Rahmen einer Führung durch die Leica-Manufaktur einen Einblick in die Fertigung, Geschichte und Unternehmenskultur der Marke Leica.\n\nDie Besichtigung vermittelte eindrucksvoll, wie traditionelle Handwerkskunst, technologische Innovation und höchste Qualitätsansprüche bis heute miteinander verbunden werden.\n\n## Fazit\n\nDas Medienfrühstück in der Leica-Welt Wetzlar zeigte eindrucksvoll, wie eng technologische Innovation, hochwertige Medienproduktion und wirtschaftliche Zukunftsfragen miteinander verknüpft sind. Die Veranstaltung verband spannende Fachvorträge mit intensivem Austausch und bot den Teilnehmerinnen und Teilnehmern wertvolle Impulse für die Herausforderungen der digitalen Medienwelt.\n\nPROdigitalTV bedankte sich bei Leica, dem Ernst Leitz Museum sowie allen Referentinnen, Referenten und Gästen für eine erfolgreiche Veranstaltung und die zahlreichen anregenden Gespräche.\n","thumbnailMediaAssetId":"media-asset-e1751af9-2377-4224-96fc-db557a74783a","imageUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fevents%2Fevent-leica-welt-2026%2Fmigrated%2F1784451837477-25dd6a9c-7687-40c7-9205-48b566e2aa20.webp?alt=media&token=f8cf10df-5f95-43b2-b41a-bf3a82bf8463","thumbnail_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fevents%2Fevent-leica-welt-2026%2Fmigrated%2F tps://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fuploads%2FQERO%2Fprodigitaltv-bild_QERO_upload_4x3_v1.png?alt=media&token=537ddbc0-f42b-4785-8160-6795793be617","thumbnail_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fuploads%2FQERO%2Fprodigitaltv-bild_QERO_upload_4x3_v1.png?alt=media&token=537ddbc0-f42b-4785-8160-6795793be617","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fuploads%2FQERO%2Fprodigitaltv-bild_QERO_upload_4x3_v1.png?alt=media&token=537ddbc0-f42b-4785-8160-6795793be617","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fuploads%2FQERO%2Fprodigitaltv-bild_QERO_upload_4x3_v1.png?alt=media&token=537ddbc0-f42b-4785-8160-6795793be617","startTime":"09:30","endTime":"15:00","thumbnailMediaAssetId":"asset-events-event-archive-63","thumbnail_media_asset_id":"asset-events-event-archive-63","mediaAssetId":"asset-events-event-archive-63","date":"2026-10-23","address":"Prinzregentenstraße 48","postalCode":"80538","longDescription":"","archiveText":"","bodyText":"","postEventSummary":"","articleText":"","postEventummary":"","descriptionMode":"complete","visible":true,"registrationEnabled":true,"registrationStatus":"open","lifecyclePhase":"registration_open","registration_state":"open","preStatus":"invitation_published","allowPublicRegistration":true,"status":"active","description":"Am 23. Oktober 2026 lädt PROdigitalTV von 9:30 bis 15:00 Uhr zum Medienfrühstück in die Kanzlei HEUKING in München ein. Die Veranstaltung richtet sich an Fach- und Führungskräfte der digitalen Medienwirtschaft und bietet eine Plattform, um aktuelle Entwicklungen in den Bereichen Medienrecht, Streaming, TV-Produktion und Content-Distribution zu erörtern. Gastgeber HEUKING schafft den Rahmen für einen intensiven Austausch, der Chancen und Herausforderungen der sich wandelnden Medienlandschaft in den Mittelpunkt stellt.\n\nMichael Schmittmann von Ra Heuking thematisiert in seinem Vortrag „Der neue Tarif der Münchner Gruppe für Direkteinspeisung von Fast Channels nach §20d UrhG“ die rechtlichen Rahmenbedingungen, die für Sender und Plattformbetreiber zunehmend an Bedeutung gewinnen. Dabei wird er von Nikolaus Sommer von der Gema als Co-Referent unterstützt, der die Diskussion mit fachlicher Expertise ergänzt.\n\nDr. Melanie Grundmann von FUNKE Digital GmbH beleuchtet unter dem Titel „Vom Playout auf die Plattform: Was einen FAST Channel wirklich distributionsfähig macht“, wie sich klassische Distributionsstrukturen verändern und welche Potenziale plattformbasierte Modelle für die effiziente Verbreitung von Inhalten eröffnen.\n\nInnovative Produktionsansätze stellt Hansjörg Baumgartner von DMC Production Germany GmbH vor. In „Die TV-Produktion der Zukunft: Remote, softwarebasiert und KI-gestützt“ zeigt er auf, wie technologische Fortschritte Produktionsprozesse flexibler und effizienter gestalten.\n\nNorbert Grill von Big Blue Marble widmet sich dem Thema „C2PA – Vertrauen in digitale Inhalte stärken“ und erläutert, wie der C2PA-Standard Manipulationen entgegenwirken und die Authentizität digitaler Medieninhalte sichern kann.\n\nAbschließend präsentiert Julia Gloning von Utiq SA/NV mit „Adressierbare Werbung ohne Third-Party-Cookies – der Utiq-Ansatz“ neue Möglichkeiten für zielgerichtete Werbung in einer zunehmend datenschutzbewussten Medienwelt.\n\nDas Medienfrühstück bei HEUKING verspricht somit vielfältige Einblicke in aktuelle Trends und Herausforderungen der digitalen Medienbranche. Interessierte sind eingeladen, sich frühzeitig anzumelden, um an diesem wichtigen Branchentreffen in München teilzunehmen.\n\nKeywords: Medienrecht, Streaming, TV-Produktion, Content-Distribution","topicIds":["topics-63a7e03c-d2e5-42cb-b3e6-49daf4877ca3","topics-1fc49fa9-483f-4961-a281-a0104716dcec","topics-ca341066-3730-492b-ae9b-256f3acdc9ee","topics-0b7803 nsprozesse flexibler und effizienter gestalten.\n\nNorbert Grill von Big Blue Marble widmet sich dem Thema „C2PA – Vertrauen in digitale Inhalte stärken“ und erläutert, wie der C2PA-Standard Manipulationen entgegenwirken und die Authentizität digitaler Medieninhalte sichern kann.\n\nAbschließend präsentiert Julia Gloning von Utiq SA/NV mit „Adressierbare Werbung ohne Third-Party-Cookies – der Utiq-Ansatz“ neue Möglichkeiten für zielgerichtete Werbung in einer zunehmend datenschutzbewussten Medienwelt.\n\nDas Medienfrühstück bei HEUKING verspricht somit vielfältige Einblicke in aktuelle Trends und Herausforderungen der digitalen Medienbranche. Interessierte sind eingeladen, sich frühzeitig anzumelden, um an diesem wichtigen Branchentreffen in München teilzunehmen.\n\nKeywords: Medienrecht, Streaming, TV-Produktion, Content-Distribution","topicIds":["topics-63a7e03c-d2e5-42cb-b3e6-49daf4877ca3","topics-1fc49fa9-483f-4961-a281-a0104716dcec","topics-ca341066-3730-492b-ae9b-256f3acdc9ee","topics-0b780394-21e0-4d72-9f3e-b3e7b50ab3dc","topics-f0a8723e-d11b-4dc4-ace5-3cb37f1c62eb","topics-527a7339-d174-4a41-9282-9f9190bac80d"],"speakerIds":["speakers-258a7f87-007f-49e9-83a5-c5f71bccb033","speakers-b2f60ad4-4306-4e06-9ca8-98771d77435b","speakers-497de429-fc6a-4969-89d1-af8a180be1c2","speakers-914d40aa-6b45-49b6-bd89-fd128cd9633b","speakers-b427d653-d473-4e8f-b00f-904e3afc1214","speakers-17eb66c1-444b-4e00-a9e9-2bd401f65523","speakers-278f6d39-6322-4279-8a16-2f1b04109c22","speakers-c23e4d5d-2474-43bb-8426-d4f9ff0afcc9"],"scheduleText":"09:00 | Einlass | Empfang, Registrierung und Ankommen\n09:30 | Beate Busch / M. Schmidtmann | Begruessung durch PROdigitalTV und organisatorische Hinweise\n09:40 | Norbert Grill | C2PA – Vertrauen in digitale Inhalte stärken\n10:00 | Dr. Albrecht Bischoffshausen | Der neue Tarif der Münchner Gruppe für Direkteinspeisung von Fast Channels nach §20d UrhG\n10:30 | Pause | Austausch und Networking\n10:50 | Dr. Melanie Grundmann | Vom Playout auf di basestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/events%2Fevent-c5082f22-057b-44b4-8d50-8ccf3421f459%2Fcover%2F1787046645356-c8c66078-bafd-403e-9187-f60de6853cf4.png?alt=media&token=4808bde9-4f69-458f-9427-6e6b17a75f87","startTime":"18:30","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/events%2Fevent-c5082f22-057b-44b4-8d50-8ccf3421f459%2Fcover%2F1787046645356-c8c66078-bafd-403e-9187-f60de6853cf4.png?alt=media&token=4808bde9-4f69-458f-9427-6e6b17a75f87","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/events%2Fevent-c5082f22-057b-44b4-8d50-8ccf3421f459%2Fcover%2F1787046645356-c8c66078-bafd-403e-9187-f60de6853cf4.png?alt=media&token=4808bde9-4f69-458f-9427-6e6b17a75f87","address":"Innere Wiener Strasse 19","locationName":"Hofbräukeller","hostId":"","eventType":"von den Besten lernen","sponsorIds":[],"subtitle":"am 22.10.2026 in München","endTime":"21:30","allowPublicRegistration":false,"title":"Von den Besten Lernen - München","visible":true,"registrationEnabled":true,"registrationStatus":"open","lifecyclePhase":"registration_open","registration_state":"open","allowMemberRegistration":true,"preStatus":"invitation_published","status":"active","descriptionMode":"complete","description":"Am **Vorabend des Medienfrühstückes** bei der RA Kanzlei Heuking und Partner lädt PROdigitalTV seine Mitglieder und Referenten am 22. Oktober 2026 um 18:30 Uhr zu einem exklusiven Expertenabend in den **Münchner Hofbräukelle**r ein. Unter dem Motto „Von den Besten lernen“ präsentiert ein erfahrener Unternehmer und Fachmann aus Wirtschaft, Medien und Innovation seine erfolgreichen Strategien und teilen praxisnahe Erkenntnisse.\n\nDie Veranstaltung bietet den Mitgliedern die Möglichkeit, direkt von den Herausforderungen und Erfolgen der Referenten zu profitieren und neue Impulse für die digitale Medienwirtschaft zu gewinnen. Neben den Vorträgen steht der intensive Austausch im Mittelpunkt: In Gesprächen und Diskussionen können die Teilnehmer ihr Netzwerk erweitern und wertvolle Kontakte knüpfen.\n\nAls geschlossene Plattform fördert der Abend den Wissenstransfer innerhalb der Branche und unterstützt die Weiterentwicklung der digitalen Medienlandschaft in München und darüber hinaus. Die Kombination aus persönlichen Einblicken und konkreten Praxisbeispielen macht das Event zu einer bedeutenden Gelegenheit für Mitglieder von PROdigitalTV, aktuelle Trends und bewährte Methoden kennenzulernen.\n\nKeywords: Medienwirtschaft, Innovation, Netzwerk, Strategie\n\nDas Programm verbindet mehrere Perspektiven aus der digitalen Medienwirtschaft: Andreas Gerhard von Sport 1 GmbH stellt den Vortrag „Sport1 - All Access“ vor.\n\nWir freuen uns darauf, Sie in München persönlich zu begrüßen. Bitte melden Sie sich frühzeitig an, damit wir Ihre Teilnahme verbindlich einplanen können.","longDescription":"Von den Besten Lernen – München 2026  \nExklusive Einblicke in Content- und Distributionsstrategien bei Sport1  \n\nAm 22. Oktober 2026 fand im Münchner Hofbräukeller das exklusive PROdigitalTV-Event „Von den Besten Lernen“ statt. Die Veranstaltung richtete sich ausschließlich an die Mitglieder von PROdigitalTV sowie eingeladene Gäste und bot einen intensiven Austausch zu aktuellen Herausforderungen und erfolgreichen Strategien in der digitalen Medienwirtschaft. Im Fokus stand die praxisnahe Vermittlung von Wissen durch erfahrene Branchenexperten, die ihre Einblicke und Erfahrungen mit den Teilnehmern teilten.  \n\nDen Auftakt bildete die Begrüßung durch Beate Busch, die den Abend eröffnete und den Rahmen für den fachlichen Austausch setzte. Im Anschluss präsentierte Norman Schneider ein Interview mit Andreas Gerhard, Chief Content & Distribution Officer der Sport 1 GmbH. Unter dem Titel „Sport1 – All Access“ erläuterte Gerhard, wie aus einem Sportthema ein kanalübergreifendes Medienereignis entsteht. Dabei stand die Frage im Mittelpunkt, wie Inhalte, Distribution und verschiedene Touchpoints so orchestriert werden, dass Aufmerksamkeit und Reichweite gezielt aufgebaut werden können.  \n\nGerhard zeigte auf, wie eine koordinierte Content- und Distributionsstrategie essenziell ist, um Medienhypes nicht nur über einzelne Ausspielwege, sondern über mehrere Kontaktpunkte hinweg zu entwickeln. Er betonte die Bedeutung, redaktionelle Inhalte, Plattformen und Nutzeransprache aufeinander abzustimmen, um ein konsistentes Medienerlebnis zu schaffen. Für digitale Medienunternehmen eröffnen sich daraus neue Möglichkeiten, Reichweite, Engagement und Markenbindung ganzheitlich zu gestalten.  \n\nDer Vortrag bot den Mitgliedern von PROdigitalTV wertvolle Einblicke in die Mechanismen moderner Medieninszenierung und gab einen Ausblick darauf, wie Medienmarken ihre Themen künftig kanalübergreifend führen können, ohne die jeweilige Nutzungssituation aus dem Blick zu verlieren.  \n\nIm Anschluss an den Vortrag nutzten die Teilnehmer die Gelegenheit zum Abendessen und Networking. Der intensive persönliche Austausch förderte die Vernetzung innerhalb der Branche und ermöglichte es, neue Partnerschaften und Kooperationen anzustoßen.  \n\nMit diesem Abend setzte PROdigitalTV erneut einen wichtigen Impuls für die Weiterentwicklung der digitalen Medienlandschaft in München und darüber hinaus. Die Kombination aus fundierten Fachvorträgen und persönlichem Dialog stärkte den Wissenstransfer und die Innovationskraft der Mitglieder.  \n\nKeywords: Contentstrategie, Distribution, Medienhype, Netzwerk","archiveText":"Von den Besten Lernen – München 2026  \nExklusive Einblicke in Content- und Distributionsstrategien bei Sport1  \n\nAm 22. Oktober 2026 fand im Münchner Hofbräukeller das exklusive PROdigitalTV-Event „Von den Besten Lernen“ statt. Die Veranstaltung richtete sich ausschließlich an die Mitglieder von PROdigitalTV sowie eingeladene Gäste und bot einen intensiven Austausch zu aktuellen Herausforderungen und erfolgreichen Strategien i en\n19:00 | Beate Busch | Begruessung durch PROdigitalTV\n19:10 | Pause | Essen Bestellung\n19:30 | Michael Schmittmann | Medien und Gema im Zeitalter von KI\n20:00 | Programmpunkt | Abendessen und Networking\n21:20 | Beate Busch | Fazit, Danksagung\n21:30 | Ende der Veranstaltung |","updatedAt":"2026-09-28T07:35:12.930Z"}]},"pdtv-public-list-v7:events:[[\"registrationStatus\",\"==\",\"open\"]]":{"createdAt":1790692911691,"records":[{"id":"event-archive-63","showPublicTeaser":true,"accessType":"public","allowMemberRegistration":false,"visibility":"public","displayDate":"Keine Datumsangabe im Quellarchiv","updated_at":"2026-06-23T08:11:57.876Z","locationName":"Heuking Rechtsanwalt Kanzlei","city":"München","eventType":"Medienfrühstück","title":"Medienfrühstück bei HEUKING in München","subtitle":"","sponsorIds":["sponsors-3757c291-f273-4c13-866c-59d6e0abd9ac"],"hostId":"sponsors-3757c291-f273-4c13-866c-59d6e0abd9ac","imageUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fuploads%2FQERO%2Fprodigitaltv-bild_QERO_upload_4x3_v1.png?alt=media&token=537ddbc0-f42b-4785-8160-6795793be617","thumbnail_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fuploads%2FQERO%2Fprodigitaltv-bild_QERO_upload_4x3_v1.png?alt=media&token=537ddbc0-f42b-4785-8160-6795793be617","assetUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fuploads%2FQERO%2Fprodigitaltv-bild_QERO_upload_4x3_v1.png?alt=media&token=537ddbc0-f42b-4785-8160-6795793be617","thumbnailUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/images%2Fuploads%2FQERO%2Fprodigitaltv-bild_QERO_upload_4x3_v1.png?alt=media&token=537ddbc0-f42b-4785-8160-6795793be617","startTime":"09:30","endTime":"15:00","thumbnailMediaAssetId":"asset-events-event-archive-63","thumbnail_media_asset_id":"asset-events-event-archive-63","mediaAssetId":"asset-events-event-archive-63","date":"2026-10-23","address":"Prinzregentenstraße 48","postalCode":"80538","longDescription":"","archiveText":"","bodyText":"","postEventSummary":"","articleText":"","postEventummary":"","descriptionMode":"complete","visible":true,"registrationEnabled":true,"registrationStatus":"open","lifecyclePhase":"registration_open","registration_state":"open","preStatus":"invitation_published","allowPublicRegistration":true,"status":"active","description":"Am 23. Oktober 2026 lädt PROdigitalTV von 9:30 bis 15:00 Uhr zum Medienfrühstück in die Kanzlei HEUKING in München ein. Die Veranstaltung richtet sich an Fach- und Führungskräfte der digitalen Medienwirtschaft und bietet eine Plattform, um aktuelle Entwicklungen in den Bereichen Medienrecht, Streaming, TV-Produktion und Content-Distribution zu erörtern. Gastgeber HEUKING schafft den Rahmen für einen intensiven Austausch, der Chancen und Herausforderungen der sich wandelnden Medienlandschaft in den Mittelpunkt stellt.\n\nMichael Schmittmann von Ra Heuking thematisiert in seinem Vortrag „Der neue Tarif der Münchner Gruppe für Direkteinspeisung von Fast Channels nach §20d UrhG“ die rechtlichen Rahmenbedingungen, die für Sender und Plattformbetreiber zunehmend an Bedeutung gewinnen. Dabei wird er von Nikolaus Sommer von der Gema als Co-Referent unterstützt, der die Diskussion mit fachlicher Expertise ergänzt.\n\nDr. Melanie Grundmann von FUNKE Digital GmbH beleuchtet unter dem Titel „Vom Playout auf die Plattform: Was einen FAST Channel wirklich distributionsfähig macht“, wie sich klassische Distributionsstrukturen verändern und welche Potenziale plattformbasierte Modelle für die effiziente Verbreitung von Inhalten eröffnen.\n\nInnovative Produktionsansätze stellt Hansjörg Baumgartner von DMC Production Germany GmbH vor. In „Die TV-Produktion der Zukunft: Remote, softwarebasiert und KI-gestützt“ zeigt er auf, wie technologische Fortschritte Produktionsprozesse flexibler und effizienter gestalten.\n\nNorbert Grill von Big Blue Marble widmet sich dem Thema „C2PA – Vertrauen in digitale Inhalte stärken“ und erläutert, wie der C2PA-Standard Manipulationen entgegenwirken und die Authentizität digitaler Medieninhalte sichern kann.\n\nAbschließend präsentiert Julia Gloning von Utiq SA/NV mit „Adressierbare Werbung ohne Third-Party-Cookies – der Utiq-Ansatz“ neue Möglichkeiten für zielgerichtete Werbung in einer zunehmend datenschutzbewussten Medienwelt.\n\nDas Medienfrühstück bei HEUKING verspricht somit vielfältige Einblicke in aktuelle Trends und Herausforderungen der digitalen Medienbranche. Interessierte sind eingeladen, sich frühzeitig anzumelden, um an diesem wichtigen Branchentreffen in München teilzunehmen.\n\nKeywords: Medienrecht, Streaming, TV-Produktion, Content-Distribution","topicIds":["topics-63a7e03c-d2e5-42cb-b3e6-49daf4877ca3","topics-1fc49fa9-483f-4961-a281-a0104716dcec","topics-ca341066-3730-492b-ae9b-256f3acdc9ee","topics-0b780394-21e0-4d72-9f3e-b3e7b50ab3dc","topics-f0a8723e-d11b-4dc4-ace5-3cb37f1c62eb","topics-527a7339-d174-4a41-9282-9f9190bac80d"],"speakerIds":["speakers-258a7f87-007f-49e9-83a5-c5f71bccb033","speakers-b2f60ad4-4306-4e06-9ca8-98771d77435b","speakers-497de429-fc6a-4969-89d1-af8a180be1c2","speakers-914d40aa-6b45-49b6-bd89-fd128cd9633b","speakers-b427d653-d473-4e8f-b00f-904e3afc1214","speakers-17eb66c1-444b-4e00-a9e9-2bd401f65523","speakers-278f6d39-6322-4279-8a16-2f1b04109c22","speakers-c23e4d5d-2474-43bb-8426-d4f9ff0afcc9"],"scheduleText":"09:00 | Einlass | Empfang, Registrierung und Ankommen\n09:30 | Beate Busch / M. Schmidtmann | Begruessung durch PROdigitalTV und organisatorische Hinweise\n09:40 | Norbert Grill | C2PA – Vertrauen in digitale Inhalte stärken\n10:00 | Dr. Albrecht Bischoffshausen | Der neue Tarif der Münchner Gruppe für Direkteinspeisung von Fast Channels nach §20d UrhG\n10:30 | Pause | Austausch und Networking\n10:50 | Dr. Melanie Grundmann | Vom Playout auf die Plattform:\n11:20 | Hansjörg Baumgartner | Die TV-Produktion der Zukunft: Remote, softwarebasiert und KI-gestützt\n11:50 | Pause | Laengere Pause, Lunch oder Networking\n12:50 | Julia Gloning | Adressierbare Werbung ohne Third-Party-Cookies – der Utiq-Ansatz\n13:20 | Andreas Gerhard | Sport1 - All Access\n13:50 | Beate Busch | Fazit, Danksagung und Vortragsende\n14:00 | Networking | Networking und informeller Austausch\n15:00 | Ende der Veranstaltung |","agendaText":"09:00 | Einlass | Empfang, Registrierung und Ankommen\n09:30 | Beate Busch / M. Schmidtmann | Begruessung durch PROdigitalTV und organisatorische Hinweise\n09:40 | Norbert Grill | C2PA – Vertrauen in digitale Inhalte stärken\n10:00 | Dr. Albrecht Bischoffshausen | Der neue Tarif der Münchner Gruppe für Direkteinspeisung von Fast Channels nach §20d UrhG\n10:30 | Pause | Austausch und Networking\n10:50 | Dr. Melanie Grundmann | Vom Playout auf die Plattform:\n11:20 | Hansjörg Baumgartner | Die TV-Produktion der Zukunft: Remote, softwarebasiert und KI-gestützt\n11:50 | Pause | Laengere Pause, Lunch oder Networking\n12:50 | Julia Gloning | Adressierbare Werbung ohne Third-Party-Cookies – der Utiq-Ansatz\n13:20 | Andreas Gerhard | Sport1 - All Access\n13:50 | Beate Busch | Fazit, Danksagung und Vortragsende\n14:00 | Networking | Networking und informeller Austausch\n15:00 | Ende der Veranstaltung |","updatedAt":"2026-09-29T14:31:22.037Z"},{"id":"event-c5082f22-057b-44b4-8d50-8ccf3421f459","date":"2026-10-22","thumbnail_media_asset_id":"media-asset-602c969d-9a86-4aea-b114-347a243987da","city":"München","postalCode":"81667","thumbnail_url":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app/o/events%2Fevent-c5082f22-057b-44b4-8d50-8ccf3421f459%2Fcover%2F1787046645356-c8c66078-bafd-403e-9187-f60de6853cf4.png?alt=media&token=4808bde9-4f69-458f-9427-6e6b17a75f87","mediaAssetId":"media-asset-602c969d-9a86-4aea-b114-347a243987da","accessType":"members_only","imageUrl":"https://firebasestorage.googleapis.com/v0/b/prodigitaltv-da47b.firebasestorage.app ilnehmer ihr Netzwerk erweitern und wertvolle Kontakte knüpfen.\n\nAls geschlossene Plattform fördert der Abend den Wissenstransfer innerhalb der Branche und unterstützt die Weiterentwicklung der digitalen Medienlandschaft in München und darüber hinaus. Die Kombination aus persönlichen Einblicken und konkreten Praxisbeispielen macht das Event zu einer bedeutenden Gelegenheit für Mitglieder von PROdigitalTV, aktuelle Trends und bewährte Methoden kennenzulernen.\n\nKeywords: Medienwirtschaft, Innovation, Netzwerk, Strategie\n\nDas Programm verbindet mehrere Perspektiven aus der digitalen Medienwirtschaft: Andreas Gerhard von Sport 1 GmbH stellt den Vortrag „Sport1 - All Access“ vor.\n\nWir freuen uns darauf, Sie in München persönlich zu begrüßen. Bitte melden Sie sich frühzeitig an, damit wir Ihre Teilnahme verbindlich einplanen können.","longDescription":"Von den Besten Lernen – München 2026  \nExklusive Einblicke in Content- und Distributionsstrategien bei Sport1  \n\nAm 22. Oktober 2026 fand im Münchner Hofbräukeller das exklusive PROdigitalTV-Event „Von den Besten Lernen“ statt. Die Veranstaltung richtete sich ausschließlich an die Mitglieder von PROdigitalTV sowie eingeladene Gäste und bot einen intensiven Austausch zu aktuellen Herausforderungen und erfolgreichen Strategien in der digitalen Medienwirtschaft. Im Fokus stand die praxisnahe Vermittlung von Wissen durch erfahrene Branchenexperten, die ihre Einblicke und Erfahrungen mit den Teilnehmern teilten.  \n\nDen Auftakt bildete die Begrüßung durch Beate Busch, die den Abend eröffnete und den Rahmen für den fachlichen Austausch setzte. Im Anschluss präsentierte Norman Schneider ein Interview mit Andreas Gerhard, Chief Content & Distribution Officer der Sport 1 GmbH. Unter dem Titel „Sport1 – All Access“ erläuterte Gerhard, wie aus einem Sportthema ein kanalübergreifendes Medienereignis entsteht. Dabei stand die Frage im Mittelpunkt, wie Inhalte, Distribution und verschiedene Touchpoints so orchestriert werden, lCode":"80538","longDescription":"","archiveText":"","bodyText":"","postEventSummary":"","articleText":"","postEventummary":"","descriptionMode":"complete","visible":true,"registrationEnabled":true,"registrationStatus":"open","lifecyclePhase":"registration_open","registration_state":"open","preStatus":"invitation_published","allowPublicRegistration":true,"status":"active","description":"Am 23. Oktober 2026 lädt PROdigitalTV von 9:30 bis 15:00 Uhr zum Medienfrühstück in die Kanzlei HEUKING in München ein. Die Veranstaltung richtet sich an Fach- und Führungskräfte der digitalen Medienwirtschaft und bietet eine Plattform, um aktuelle Entwicklungen in den Bereichen Medienrecht, Streaming, TV-Produktion und Content-Distribution zu erörtern. Gastgeber HEUKING schafft den Rahmen für einen intensiven Austausch, der Chancen und Herausforderungen der sich wandelnden Medienlandschaft in den Mittelpunkt stellt.\n\nMichael Schmittmann von Ra Heuking thematisiert in seinem Vortrag „Der neue Tarif der Münchner Gruppe für Direkteinspeisung von Fast Channels nach §20d UrhG“ die rechtlichen Rahmenbedingungen, die für Sender und Plattformbetreiber zunehmend an Bedeutung gewinnen. Dabei wird er von Nikolaus Sommer von der Gema als Co-Referent unterstützt, der die Diskussion mit fachlicher Expertise ergänzt.\n\nDr. Melanie Grundmann von FUNKE Digital GmbH beleuchtet unter dem Titel „Vom Playout auf die Plattform: Was einen FAST Channel wirklich distributionsfähig macht“, wie sich klassische Distributionsstrukturen verändern und welche Potenziale plattformbasierte Modelle für die effiziente Verbreitung von Inhalten eröffnen.\n\nInnovative Produktionsansätze stellt Hansjörg Baumgartner von DMC Production Germany GmbH vor. In „Die TV-Produktion der Zukunft: Remote, softwarebasiert und KI-gestützt“ zeigt er auf, wie technologische Fortschritte Produktionsprozesse flexibler und effizienter gestalten.\n\nNorbert Grill von Big Blue Marble widmet sich dem Thema „C2PA – Vertrauen in digitale Inhalte stärken“ und erläutert, wie der C2PA-Standard Manipulationen entgegenwirken und die Authentizität digitaler Medieninhalte sichern kann.\n\nAbschließend präsentiert Julia Gloning von Utiq SA/NV mit „Adressierbare Werbung ohne Third-Party-Cookies – der Utiq-Ansatz“ neue Möglichkeiten für zielgerichtete Werbung in einer zunehmend datenschutzbewussten Medienwelt.\n\nDas Medienfrühstück bei HEUKING verspricht somit vielfältige Einblicke in aktuelle Trends und Herausforderungen der digitalen Medienbranche. Interessierte sind eingeladen, sich frühzeitig anzumelden, um an diesem wichtigen Branchentreffen in München teilzunehmen.\n\nKeywords: Medienrecht, Streaming, TV-Produktion, Content-Distribution","topicIds":["topics-63a7e03c-d2e5-42cb-b3e6-49daf4877ca3","topics-1fc49fa9-483f-4961-a281-a0104716dcec","topics-ca341066-3730-492b-ae9b-256f3acdc9ee","topics-0b780394-21e0-4d72-9f3e-b3e7b50ab3dc","topics-f0a8723e-d11b-4dc4-ace5-3cb37f1c62eb","topics-527a7339-d174-4a41-9282-9f9190bac80d"],"speakerIds":["speakers-258a7f87-007f-49e9-83a5-c5f71bccb033","speakers-b2f60ad4-4306-4e06-9ca8-98771d77435b","speakers-497de429-fc6a-4969-89d1-af8a180be1c2","speakers-914d40aa-6b45-49b6-bd89-fd128cd9633b","speakers-b427d653-d473-4e8f-b00f-904e3afc1214","speakers-17eb66c1-444b-4e00-a9e9-2bd401f65523","speakers-278f6d39-6322-4279-8a16-2f1b04109c22","speakers-c23e4d5d-2474-43bb-8426-d4f9ff0afcc9"],"scheduleText":"09:00 | Einlass | Empfang, Registrierung und Ankommen\n09:30 | Beate Busch / M. Schmidtmann | Begruessung durch PROdigitalTV und organisatorische Hinweise\n09:40 | Norbert Grill | C2PA – Vertrauen in digitale Inhalte stärken\n10:00 | Dr. Albrecht Bischoffshausen | Der neue Tarif der Münchner Gruppe für Direkteinspeisung von Fast Channels nach §20d UrhG\n10:30 | Pause | Austausch und Networking\n10:50 | Dr. Melanie Grundmann | Vom Playout auf die Plattform:\n11:20 | Hansjörg Baumgartner | Die TV-Produktion der Zukunft: Remote, softwarebasiert und KI-gestützt\n11:50 | Pause | Laenger "address":"Prinzregentenstraße 48","postalCode":"80538","longDescription":"","archiveText":"","bodyText":"","postEventSummary":"","articleText":"","postEventummary":"","descriptionMode":"complete","visible":true,"registrationEnabled":true,"registrationStatus":"open","lifecyclePhase":"registration_open","registration_state":"open","preStatus":"invitation_published","allowPublicRegistration":true,"status":"active","description":"Am 23. Oktober 2026 lädt PROdigitalTV von 9:30 bis 15:00 Uhr zum Medienfrühstück in die Kanzlei HEUKING in München ein. Die Veranstaltung richtet sich an Fach- und Führungskräfte der digitalen Medienwirtschaft und bietet eine Plattform, um aktuelle Entwicklungen in den Bereichen Medienrecht, Streaming, TV-Produktion und Content-Distribution zu erörtern. Gastgeber HEUKING schafft den Rahmen für einen intensiven Austausch, der Chancen und Herausforderungen der sich wandelnden Medienlandschaft in den Mittelpunkt stellt.\n\nMichael Schmittmann von Ra Heuking thematisiert in seinem Vortrag „Der neue Tarif der Münchner Gruppe für Direkteinspeisung von Fast Channels nach §20d UrhG“ die rechtlichen Rahmenbedingungen, die für Sender und Plattformbetreiber zunehmend an Bedeutung gewinnen. Dabei wird er von Nikolaus Sommer von der Gema als Co-Referent unterstützt, der die Diskussion mit fachlicher Expertise ergänzt.\n\nDr. Melanie Grundmann von FUNKE Digital GmbH beleuchtet unter dem Titel „Vom Playout auf die Plattform: Was einen FAST Channel wirklich distributionsfähig macht“, wie sich klassische Distributionsstrukturen verändern und welche Potenziale plattformbasierte Modelle für die effiziente Verbreitung von Inhalten eröffnen.\n\nInnovative Produktionsansätze stellt Hansjörg Baumgartner von DMC Production Germany GmbH vor. In „Die TV-Produktion der Zukunft: Remote, softwarebasiert und KI-gestützt“ zeigt er auf, wie technologische Fortschritte Produktionsprozesse flexibler und effizienter gestalten.\n\nNorbert Grill von Big Blue Marble widmet sich dem Thema „C2PA – Vertrauen in digitale Inhalte stärken“ und erläutert, wie der C2PA-Standard Manipulationen entgegenwirken und die Authentizität digitaler Medieninhalte sichern kann.\n\nAbschließend präsentiert Julia Gloning von Utiq SA/NV mit „Adressierbare Werbung ohne Third-Party-Cookies – der Utiq-Ansatz“ neue Möglichkeiten für zielgerichtete Werbung in einer zunehmend datenschutzbewussten Medienwelt.\n\nDas Medienfrühstück bei HEUKING verspricht somit vielfältige Einblicke in aktuelle Trends und Herausforderungen der digitalen Medienbranche. Interessierte sind eingeladen, sich frühzeitig anzumelden, um an diesem wichtigen Branchentreffen in München teilzunehmen.\n\nKeywords: Medienrecht, Streaming, TV-Produktion, Content-Distribution","topicIds":["topics-63a7e03c-d2e5-42cb-b3e6-49daf4877ca3","topics-1fc49fa9-483f-4961-a281-a0104716dcec","topics-ca341066-3730-492b-ae9b-256f3acdc9ee","topics-0b780394-21e0-4d72-9f3e-b3e7b50ab3dc","topics-f0a8723e-d11b-4dc4-ace5-3cb37f1c62eb","topics-527a7339-d174-4a41-9282-9f9190bac80d"],"speakerIds":["speakers-258a7f87-007f-49e9-83a5-c5f71bccb033","speakers-b2f60ad4-4306-4e06-9ca8-98771d77435b","speakers-497de429-fc6a-4969-89d1-af8a180be1c2","speakers-914d40aa-6b45-49b6-bd89-fd128cd9633b","speakers-b427d653-d473-4e8f-b00f-904e3afc1214","speakers-17eb66c1-444b-4e00-a9e9-2bd401f65523","speakers-278f6d39-6322-4279-8a16-2f1b04109c22","speakers-c23e4d5d-2474-43bb-8426-d4f9ff0afcc9"],"scheduleText":"09:00 | Einlass | Empfang, Registrierung und Ankommen\n09:30 | Beate Busch / M. Schmidtmann | Begruessung durch PROdigitalTV und organisatorische Hinweise\n09:40 | Norbert Grill | C2PA – Vertrauen in digitale Inhalte stärken\n10:00 | Dr. Albrecht Bischoffshausen | Der neue Tarif der Münchner Gruppe für Direkteinspeisung von Fast Channels nach §20d UrhG\n10:30 | Pause | Austausch und Networking\n10:50 | Dr. Melanie Grundmann | Vom Playout auf die Plattform:\n11:20 | Hansjörg Baumgartner | Die TV-Produktion der Zukunft: Remote, softwarebasiert rn und wertvolle Kontakte knüpfen.\n\nAls geschlossene Plattform fördert der Abend den Wissenstransfer innerhalb der Branche und unterstützt die Weiterentwicklung der digitalen Medienlandschaft in München und darüber hinaus. Die Kombination aus persönlichen Einblicken und konkreten Praxisbeispielen macht das Event zu einer bedeutenden Gelegenheit für Mitglieder von PROdigitalTV, aktuelle Trends und bewährte Methoden kennenzulernen.\n\nKeywords: Medienwirtschaft, Innovation, Netzwerk, Strategie\n\nDas Programm verbindet mehrere Perspektiven aus der digitalen Medienwirtschaft: Andreas Gerhard von Sport 1 GmbH stellt den Vortrag „Sport1 - All Access“ vor.\n\nWir freuen uns darauf, Sie in München persönlich zu begrüßen. Bitte melden Sie sich frühzeitig an, damit wir Ihre Teilnahme verbindlich einplanen können.","longDescription":"Von den Besten Lernen – München 2026  \nExklusive Einblicke in Content- und Distributionsstrategien bei Sport1  \n\nAm 22. Oktober 2026 fand im Münchner Hofbräukeller das exklusive PROdigitalTV-Event „Von den Besten Lernen“ statt. Die Veranstaltung richtete sich ausschließlich an die Mitglieder von PROdigitalTV sowie eingeladene Gäste und bot einen intensiven Austausch zu aktuellen Herausforderungen und erfolgreichen Strategien in der digitalen Medienwirtschaft. Im Fokus stand die praxisnahe Vermittlung von Wissen durch erfahrene Branchenexperten, die ihre Einblicke und Erfahrungen mit den Teilnehmern teilten.  \n\nDen Auftakt bildete die Begrüßung durch Beate Busch, die den Abend eröffnete und den Rahmen für den fachlichen Austausch setzte. Im Anschluss präsentierte Norman Schneider ein Interview mit Andreas Gerhard, Chief Content & Distribution Officer der Sport 1 GmbH. Unter dem Titel „Sport1 – All Access“ erläuterte Gerhard, wie aus einem Sportthema ein kanalübergreifendes Medienereignis entsteht. Dabei stand die Frage im Mittelpunkt, wie Inhalte, Distribution und verschiedene Touchpoints so orchestriert werden, dass Aufmerksamkeit und Reichweite gezielt aufgebaut werden können.  \n\nGerhard zeigte auf, wie eine koordinierte Content- und Distributionsstrategie essenziell ist, um Medienhypes nicht nur über einzelne Ausspielwege, sondern über mehrere Kontaktpunkte hinweg zu entwickeln. Er betonte die Bedeutung, redaktionelle Inhalte, Plattformen und Nutzeransprache aufeinander abzustimmen, um ein konsistentes Medienerlebnis zu schaffen. Für digitale Medienunternehmen eröffnen sich daraus neue Möglichkeiten, Reichweite, Engagement und Markenbindung ganzheitlich zu gestalten.  \n\nDer Vortrag bot den Mitgliedern von PROdigitalTV wertvolle Einblicke in die Mechanismen moderner Medieninszenierung und gab einen Ausblick darauf, wie Medienmarken ihre Themen künftig kanalübergreifend führen können, ohne die jeweilige Nutzungssituation aus dem Blick zu verlieren.  \n\nIm Anschluss an den Vortrag nutzten die Teilnehmer die Gelegenheit zum Abendessen und Networking. Der intensive persönliche Austausch förderte die Vernetzung innerhalb der Branche und ermöglichte es, neue Partnerschaften und Kooperationen anzustoßen.  \n\nMit diesem Abend setzte PROdigitalTV erneut einen wichtigen Impuls für die Weiterentwicklung der digitalen Medienlandschaft in München und darüber hinaus. Die Kombination aus fundierten Fachvorträgen und persönlichem Dialog stärkte den Wissenstransfer und die Innovationskraft der Mitglieder.  \n\nKeywords: Contentstrategie, Distribution, Medienhype, Netzwerk","archiveText":"Von den Besten Lernen – München 2026  \nExklusive Einblicke in Content- und Distributionsstrategien bei Sport1  \n\nAm 22. Oktober 2026 fand im Münchner Hofbräukeller das exklusive PROdigitalTV-Event „Von den Besten Lernen“ statt. Die Veranstaltung richtete sich ausschließlich an die Mitglieder von PROdigitalTV sowie eingeladene Gäste und bot einen intensiven Austausch zu aktuellen Herausforderungen und erfolgreichen Strategien in der digitalen Medienwirtschaft. Im Fokus stand die praxisnahe Vermittlung von Wissen durch erfahr n - München","visible":true,"registrationEnabled":true,"registrationStatus":"open","lifecyclePhase":"registration_open","registration_state":"open","allowMemberRegistration":true,"preStatus":"invitation_published","status":"active","descriptionMode":"complete","description":"Am **Vorabend des Medienfrühstückes** bei der RA Kanzlei Heuking und Partner lädt PROdigitalTV seine Mitglieder und Referenten am 22. Oktober 2026 um 18:30 Uhr zu einem exklusiven Expertenabend in den **Münchner Hofbräukelle**r ein. Unter dem Motto „Von den Besten lernen“ präsentiert ein erfahrener Unternehmer und Fachmann aus Wirtschaft, Medien und Innovation seine erfolgreichen Strategien und teilen praxisnahe Erkenntnisse.\n\nDie Veranstaltung bietet den Mitgliedern die Möglichkeit, direkt von den Herausforderungen und Erfolgen der Referenten zu profitieren und neue Impulse für die digitale Medienwirtschaft zu gewinnen. Neben den Vorträgen steht der intensive Austausch im Mittelpunkt: In Gesprächen und Diskussionen können die Teilnehmer ihr Netzwerk erweitern und wertvolle Kontakte knüpfen.\n\nAls geschlossene Plattform fördert der Abend den Wissenstransfer innerhalb der Branche und unterstützt die Weiterentwicklung der digitalen Medienlandschaft in München und darüber hinaus. Die Kombination aus persönlichen Einblicken und konkreten Praxisbeispielen macht das Event zu einer bedeutenden Gelegenheit für Mitglieder von PROdigitalTV, aktuelle Trends und bewährte Methoden kennenzulernen.\n\nKeywords: Medienwirtschaft, Innovation, Netzwerk, Strategie\n\nDas Programm verbindet mehrere Perspektiven aus der digitalen Medienwirtschaft: Andreas Gerhard von Sport 1 GmbH stellt den Vortrag „Sport1 - All Access“ vor.\n\nWir freuen uns darauf, Sie in München persönlich zu begrüßen. Bitte melden Sie sich frühzeitig an, damit wir Ihre Teilnahme verbindlich einplanen können.","longDescription":"Von den Besten Lernen – München 2026  \nExklusive Einblicke in Content- und Distributionsstrategien bei Sport1  \n\nAm 22. Oktober 2026 fand im Münchner Hofbräukeller das exklusive PROdigitalTV-Event „Von den Besten Lernen“ statt. Die Veranstaltung richtete sich ausschließlich an die Mitglieder von PROdigitalTV sowie eingeladene Gäste und bot einen intensiven Austausch zu aktuellen Herausforderungen und erfolgreichen Strategien in der digitalen Medienwirtschaft. Im Fokus stand die praxisnahe Vermittlung von Wissen durch erfahrene Branchenexperten, die ihre Einblicke und Erfahrungen mit den Teilnehmern teilten.  \n\nDen Auftakt bildete die Begrüßung durch Beate Busch, die den Abend eröffnete und den Rahmen für den fachlichen Austausch setzte. Im Anschluss präsentierte Norman Schneider ein Interview mit Andreas Gerhard, Chief Content & Distribution Officer der Sport 1 GmbH. Unter dem Titel „Sport1 – All Access“ erläuterte Gerhard, wie aus einem Sportthema ein kanalübergreifendes Medienereignis entsteht. Dabei stand die Frage im Mittelpunkt, wie Inhalte, Distribution und verschiedene Touchpoints so orchestriert werden, dass Aufmerksamkeit und Reichweite gezielt aufgebaut werden können.  \n\nGerhard zeigte auf, wie eine koordinierte Content- und Distributionsstrategie essenziell ist, um Medienhypes nicht nur über einzelne Ausspielwege, sondern über mehrere Kontaktpunkte hinweg zu entwickeln. Er betonte die Bedeutung, redaktionelle Inhalte, Plattformen und Nutzeransprache aufeinander abzustimmen, um ein konsistentes Medienerlebnis zu schaffen. Für digitale Medienunternehmen eröffnen sich daraus neue Möglichkeiten, Reichweite, Engagement und Markenbindung ganzheitlich zu gestalten.  \n\nDer Vortrag bot den Mitgliedern von PROdigitalTV wertvolle Einblicke in die Mechanismen moderner Medieninszenierung und gab einen Ausblick darauf, wie Medienmarken ihre Themen künftig kanalübergreifend führen können, ohne die jeweilige Nutzungssituation aus dem Blick zu verlieren.  \n\nIm Anschluss an den Vortrag nutzten die Teilnehmer die Gelegenheit zum Abendessen und Networking. Der intensive persönliche Austausch förderte die Vernetzung innerhalb der Branche und ermöglichte es, neue Partnerschaften und Kooperationen anzustoßen.  \n\nMit diesem Abend setzte PROdigitalTV erneut einen wichtigen Impuls für die Weiterentwicklung der digitalen Medienlandschaft in München und darüber hinaus. Die Kombination aus fundierten Fachvorträgen und persönlichem Dialog stärkte den Wissenstransfer und die Innovationskraft der Mitglieder.  \n\nKeywords: Contentstrategie, Distribution, Medienhype, Netzwerk","archiveText":"Von den Besten Lernen – München 2026  \nExklusive Einblicke in Content- und Distributionsstrategien bei Sport1  \n\nAm 22. Oktober 2026 fand im Münchner Hofbräukeller das exklusive PROdigitalTV-Event „Von den Besten Lernen“ statt. Die Veranstaltung richtete sich ausschließlich an die Mitglieder von PROdigitalTV sowie eingeladene Gäste und bot einen intensiven Austausch zu aktuellen Herausforderungen und erfolgreichen Strategien in der digitalen Medienwirtschaft. Im Fokus stand die praxisnahe Vermittlung von Wissen durch erfahrene Branchenexperten, die ihre Einblicke und Erfahrungen mit den Teilnehmern teilten.  \n\nDen Auftakt bildete die Begrüßung durch Beate Busch, die den Abend eröffnete und den Rahmen für den fachlichen Austausch setzte. Im Anschluss präsentierte Norman Schneider ein Interview mit Andreas Gerhard, Chief Content & Distribution Officer der Sport 1 GmbH. Unter dem Titel „Sport1 – All Access“ erläuterte Gerhard, wie aus einem Sportthema ein kanalübergreifendes Medienereignis entsteht. Dabei stand die Frage im Mittelpunkt, wie Inhalte, Distribution und verschiedene Touchpoints so orchestriert werden, dass Aufmerksamkeit und Reichweite gezielt aufgebaut werden können.  \n\nGerhard zeigte auf, wie eine koordinierte Content- und Distributionsstrategie essenziell ist, um Medienhypes nicht nur über einzelne Ausspielwege, sondern über mehrere Kontaktpunkte hinweg zu entwickeln. Er betonte die Bedeutung, redaktionelle Inhalte, Plattformen und Nutzeransp
