<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PROdigitalTV Zugang aktivieren</title>
    <style>
      :root {
        color-scheme: light;
        --navy: #061a33;
        --muted: #687487;
        --red: #e6001a;
        --line: #dce4f0;
        --bg: #eef4fb;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--navy);
        background: linear-gradient(180deg, #f7fbff 0%, var(--bg) 100%);
      }
      .page {
        width: min(720px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }
      .logo {
        display: inline-grid;
        gap: 3px;
        margin-bottom: 32px;
        color: var(--navy);
        text-decoration: none;
      }
      .logo strong {
        color: #c90018;
        font-size: clamp(2rem, 7vw, 3.2rem);
        line-height: .9;
      }
      .logo span {
        color: #222;
        font-size: .92rem;
      }
      .card {
        padding: clamp(24px, 6vw, 44px);
        border: 1px solid var(--line);
        border-radius: 22px;
        background: #fff;
        box-shadow: 0 18px 48px rgba(6, 26, 51, .12);
      }
      .eyebrow {
        margin: 0 0 12px;
        color: var(--red);
        font-size: .82rem;
        font-weight: 900;
        letter-spacing: .24em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 8vw, 4rem);
        line-height: 1;
        letter-spacing: 0;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.5;
      }
      form {
        display: grid;
        gap: 16px;
        margin-top: 26px;
      }
      label {
        display: grid;
        gap: 7px;
        color: var(--navy);
        font-weight: 800;
      }
      input {
        width: 100%;
        min-height: 56px;
        padding: 13px 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        color: var(--navy);
        font: inherit;
      }
      input:focus {
        border-color: rgba(230, 0, 26, .5);
        outline: 3px solid rgba(230, 0, 26, .12);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        margin-top: 8px;
      }
      button,
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 13px 24px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--navy);
        font: inherit;
        font-weight: 900;
        text-decoration: none;
        cursor: pointer;
      }
      button.primary,
      .button.primary {
        border-color: var(--red);
        background: var(--red);
        color: #fff;
      }
      button:disabled {
        cursor: wait;
        opacity: .62;
      }
      .alert {
        margin-top: 18px;
        padding: 14px 16px;
        border-radius: 14px;
        background: #edf4ff;
        color: var(--navy);
        line-height: 1.45;
      }
      .alert.error {
        background: #fff0f2;
        color: #a40015;
      }
      .alert.success {
        background: #e9f8ef;
        color: #066734;
      }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <main class="page">
      <a class="logo" href="/#/home" aria-label="PROdigitalTV Webseite">
        <strong>PROdigitalTV</strong>
        <span>Interessengemeinschaft Digitale Medien e.V.</span>
      </a>
      <section class="card">
        <p class="eyebrow">Mitglieder-Login</p>
        <h1>Zugang aktivieren</h1>
        <p>Bitte vergeben Sie Ihr persoenliches Passwort. Danach ist Ihr Zugang mit diesem Mitgliedsprofil verbunden.</p>
        <form id="invite-form">
          <label>Passwort
            <input name="password" type="password" minlength="8" autocomplete="new-password" required>
          </label>
          <label>Passwort wiederholen
            <input name="passwordRepeat" type="password" minlength="8" autocomplete="new-password" required>
          </label>
          <div class="actions">
            <button class="primary" type="submit">Zugang aktivieren</button>
            <a class="button" href="/#/home">Zur Webseite</a>
          </div>
          <div id="result"></div>
        </form>
      </section>
    </main>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
      import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
      import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-functions.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDM7fo7ApSXixviFaphnSFosW7gjWvHRNg",
        authDomain: "prodigitaltv-da47b.firebaseapp.com",
        projectId: "prodigitaltv-da47b",
        storageBucket: "prodigitaltv-da47b.firebasestorage.app",
        messagingSenderId: "769486150443",
        appId: "1:769486150443:web:7cb4e407c58c56362d836e",
        measurementId: "G-X36TS46YNE"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const functions = getFunctions(app, "europe-west3");
      const params = new URLSearchParams(location.search);
      const pathParts = location.pathname.split("/").filter(Boolean);
      const invitationId = params.get("invitationId") || params.get("invitation") || params.get("id") || pathParts[1] || "";
      const token = params.get("token") || pathParts[2] || "";
      const form = document.querySelector("#invite-form");
      const result = document.querySelector("#result");

      function show(message, type = "") {
        result.innerHTML = `<div class="alert ${type}">${message}</div>`;
      }

      if (!invitationId || !token) {
        form.querySelector("button").disabled = true;
        show("Dieser Link ist unvollstaendig oder wurde falsch kopiert. Bitte fordern Sie einen neuen Link an.", "error");
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = form.querySelector("button");
        const password = form.elements.password.value;
        const passwordRepeat = form.elements.passwordRepeat.value;
        if (password !== passwordRepeat) {
          show("Die beiden Passwoerter stimmen nicht ueberein.", "error");
          return;
        }
        button.disabled = true;
        show("Zugang wird aktiviert ...");
        try {
          const complete = httpsCallable(functions, "completeMemberLoginInvitation");
          const response = await complete({ invitationId, token, password });
          const data = response.data || {};
          if (data.email) await signInWithEmailAndPassword(auth, data.email, password);
          show('Zugang aktiviert. Sie koennen jetzt zur Webseite wechseln: <a href="/#/portal?tab=profile">Profil oeffnen</a>', "success");
          window.setTimeout(() => { location.href = "/#/portal?tab=profile"; }, 900);
        } catch (error) {
          button.disabled = false;
          show(error?.message || "Der Zugang konnte nicht aktiviert werden. Bitte pruefen Sie den Link oder fordern Sie einen neuen Link an.", "error");
        }
      });
    </script>
  </body>
</html>
